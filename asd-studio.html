\n\n\n/* Scrivi il codice in linguaggio C della funzione int test(plist p) che\n   verifica che la somma degli elementi di una lista doppiamente\n   concatenata di interi \"p\" sia un numero dispari. Se la lista è vuota la\n   funzione ritorna 0 (cioè false). Zero è considerato un numero pari. */\n\nint test(plist p){\n\n}\n","solution":"int test(plist p){\n  int somma = 0;\n  if (p == NULL)\n    return 0;\n  while (p != NULL) {\n    somma = somma + p->info;\n    p = p->next;\n  }\n  return somma % 2 != 0;      /* \"!= 0\" va bene anche per i negativi (-3 % 2 vale -1) */\n}","solutionFull":"typedef struct elem {\n  int info;\n  struct elem* prev;\n  struct elem* next;\n} elist;\n\ntypedef elist* plist;\n\nint test(plist p){\n  int somma = 0;\n  if (p == NULL)\n    return 0;\n  while (p != NULL) {\n    somma = somma + p->info;\n    p = p->next;\n  }\n  return somma % 2 != 0;      /* \"!= 0\" va bene anche per i negativi (-3 % 2 vale -1) */\n}","explain":"Somma tutti gli elementi e controlla la parità solo alla fine. In C il resto ha il segno del dividendo: -3 % 2 vale -1, quindi \"somma % 2 == 1\" sbaglia con le somme negative; usa \"somma % 2 != 0\".","hints":["Somma tutto in un ciclo.","Per i negativi: -3 % 2 vale -1 in C."],"pitfalls":["somma % 2 == 1","Controllare la parità di ogni elemento invece che della somma"],"topics":["c-liste","c-modulo","c-casi-limite"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[]\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {1};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[1]\n","tags":["dispari"]},{"n":3,"code":"int v[] = {2};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[2]\n","tags":["pari"]},{"n":4,"code":"int v[] = {0};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[0]\n","tags":["zero"]},{"n":5,"code":"int v[] = {1, 2};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[1 2]\n","tags":["somma 3"]},{"n":6,"code":"int v[] = {3, 5};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[3 5]\n","tags":["somma 8"]},{"n":7,"code":"int v[] = {-3};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[-3]\n","tags":["negativo dispari"]},{"n":8,"code":"int v[] = {-2, -1};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[-2 -1]\n","tags":["somma -3"]},{"n":9,"code":"int v[] = {1, 1, 1};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[1 1 1]\n","tags":["somma 3"]},{"n":10,"code":"int v[] = {-1, -1};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[-1 -1]\n","tags":["somma -2"]}]},{"id":"l-rimuovi-massimo","title":"Rimuovere la prima occorrenza del massimo","group":"lista","kind":"L_rem","statement":"Scrivi il codice in linguaggio C della funzione void test(plist* p) che rimuove da una lista doppiamente concatenata di interi \"p\" la prima occorrenza del valore \"max\", dove \"max\" è il massimo valore presente nella lista. Se la lista è vuota la funzione non fa nulla. Ricordati di deallocare l'elemento rimosso.","fn":"void test(plist* p)","starter":"#include <stdio.h>  /* ora puoi usare NULL */\n\n/* scrivi qui la definizione del tipo \"elist\" (elemento della lista)\n   che e' una struttura con i campi \"info\" (intero), \"prev\" (puntatore\n   all'elemento precedente) e \"next\" (puntatore al prossimo elemento). */\n\ntypedef struct elem {\n      ...\n      ...\n    } elist;\n\n/* scrivi qui la definizione del tipo \"plist\" che e' un riferimento\n   ad un oggetto di tipo \"elist\" */\n\ntypedef ...  plist;\n\n/* Scrivi qui eventuali funzioni di appoggio. */\n\n\n/* Scrivi il codice in linguaggio C della funzione void test(plist* p) che\n   rimuove da una lista doppiamente concatenata di interi \"p\" la prima\n   occorrenza del valore \"max\", dove \"max\" è il massimo valore presente\n   nella lista. Se la lista è vuota la funzione non fa nulla. Ricordati di\n   deallocare l'elemento rimosso. */\n\nvoid test(plist* p){\n\n}\n","solution":"void test(plist* p){\n  elist *c, *m;\n  if (*p == NULL)\n    return;\n  m = *p;                                   /* m = puntatore al (primo) massimo */\n  for (c = (*p)->next; c != NULL; c = c->next)\n    if (c->info > m->info)                  /* > stretto: tengo la PRIMA occorrenza */\n      m = c;\n  /* scollego m dalla lista */\n  if (m->prev != NULL)\n    m->prev->next = m->next;\n  else\n    *p = m->next;                           /* m era la testa: cambia la testa */\n  if (m->next != NULL)\n    m->next->prev = m->prev;\n  free(m);\n}","solutionFull":"typedef struct elem {\n  int info;\n  struct elem* prev;\n  struct elem* next;\n} elist;\n\ntypedef elist* plist;\n\nvoid test(plist* p){\n  elist *c, *m;\n  if (*p == NULL)\n    return;\n  m = *p;                                   /* m = puntatore al (primo) massimo */\n  for (c = (*p)->next; c != NULL; c = c->next)\n    if (c->info > m->info)                  /* > stretto: tengo la PRIMA occorrenza */\n      m = c;\n  /* scollego m dalla lista */\n  if (m->prev != NULL)\n    m->prev->next = m->next;\n  else\n    *p = m->next;                           /* m era la testa: cambia la testa */\n  if (m->next != NULL)\n    m->next->prev = m->prev;\n  free(m);\n}","explain":"Due fasi: (1) trova il puntatore m al primo massimo, usando > e non >= così le occorrenze successive non lo sostituiscono; (2) scollegalo sistemando i due versi: il next del precedente (oppure la testa *p se m è il primo) e il prev del successivo, poi free(m). Serve plist* perché la testa può cambiare.","hints":["Prima trova il puntatore al massimo, poi rimuovilo.","Per la PRIMA occorrenza usa > stretto nel confronto.","Se l'elemento è la testa devi aggiornare *p.","Aggiorna sia il next del precedente sia il prev del successivo, poi free."],"pitfalls":["Dimenticare di aggiornare *p quando si rimuove la testa","Dimenticare m->next->prev","Dimenticare free(m)","Usare >= (rimuove l'ultima occorrenza)","Dereferenziare NULL quando m è primo o ultimo"],"topics":["c-liste","c-rimozione","c-puntatori","c-casi-limite"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[]\nliberati: 0\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {5};\nplist p = L_make(v, 1);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[]\nliberati: 1\n","tags":["un elemento"]},{"n":3,"code":"int v[] = {1, 2, 3};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 2]\nliberati: 1\n","tags":["massimo in coda"]},{"n":4,"code":"int v[] = {3, 2, 1};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[2 1]\nliberati: 1\n","tags":["massimo in testa"]},{"n":5,"code":"int v[] = {1, 3, 2};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 2]\nliberati: 1\n","tags":["massimo in mezzo"]},{"n":6,"code":"int v[] = {4, 4, 2};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[4 2]\nliberati: 1\n","tags":["massimo duplicato in testa"]},{"n":7,"code":"int v[] = {2, 4, 4};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[2 4]\nliberati: 1\n","tags":["massimo duplicato: vale il primo"]},{"n":8,"code":"int v[] = {1, 5, 3, 5};\nplist p = L_make(v, 4);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 3 5]\nliberati: 1\n","tags":["massimo duplicato in mezzo"]},{"n":9,"code":"int v[] = {-3, -1, -2};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[-3 -2]\nliberati: 1\n","tags":["negativi"]},{"n":10,"code":"int v[] = {7, 7};\nplist p = L_make(v, 2);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[7]\nliberati: 1\n","tags":["tutti uguali"]}]},{"id":"l-somma-uguale-lunghezza","title":"Somma degli elementi uguale alla lunghezza","group":"lista","kind":"L_ret","statement":"Scrivi il codice in linguaggio C della funzione int test(plist p) che verifica che la somma degli elementi contenuti in una lista doppiamente concatenata di interi \"p\" sia uguale alla sua lunghezza. Se la lista è vuota la funzione ritorna 1 (cioè true).","fn":"int test(plist p)","starter":"#include <stdio.h>  /* ora puoi usare NULL */\n\n/* scrivi qui la definizione del tipo \"elist\" (elemento della lista)\n   che e' una struttura con i campi \"info\" (intero), \"prev\" (puntatore\n   all'elemento precedente) e \"next\" (puntatore al prossimo elemento). */\n\ntypedef struct elem {\n      ...\n      ...\n    } elist;\n\n/* scrivi qui la definizione del tipo \"plist\" che e' un riferimento\n   ad un oggetto di tipo \"elist\" */\n\ntypedef ...  plist;\n\n/* Scrivi qui eventuali funzioni di appoggio. */\n\n\n/* Scrivi il codice in linguaggio C della funzione int test(plist p) che\n   verifica che la somma degli elementi contenuti in una lista doppiamente\n   concatenata di interi \"p\" sia uguale alla sua lunghezza. Se la lista è\n   vuota la funzione ritorna 1 (cioè true). */\n\nint test(plist p){\n\n}\n","solution":"int test(plist p){\n  int somma = 0, lunghezza = 0;\n  while (p != NULL) {\n    somma = somma + p->info;\n    lunghezza++;\n    p = p->next;\n  }\n  return somma == lunghezza;    /* per la lista vuota: 0 == 0, cioè 1 */\n}","solutionFull":"typedef struct elem {\n  int info;\n  struct elem* prev;\n  struct elem* next;\n} elist;\n\ntypedef elist* plist;\n\nint test(plist p){\n  int somma = 0, lunghezza = 0;\n  while (p != NULL) {\n    somma = somma + p->info;\n    lunghezza++;\n    p = p->next;\n  }\n  return somma == lunghezza;    /* per la lista vuota: 0 == 0, cioè 1 */\n}","explain":"Stessa scansione dell'esercizio \"somma < lunghezza\", ma qui la lista vuota dà 1: senza un caso speciale il codice funziona da solo perché 0 == 0. Controlla che il tuo codice non ritorni 0 per la lista vuota.","hints":["Una sola scansione che calcola somma e lunghezza.","Che cosa devono valere somma e lunghezza se la lista è vuota?"],"pitfalls":["Ritornare 0 per la lista vuota (qui deve essere 1)"],"topics":["c-liste","c-casi-limite"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[]\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {1};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[1]\n","tags":["vero"]},{"n":3,"code":"int v[] = {2};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[2]\n","tags":["falso"]},{"n":4,"code":"int v[] = {0, 2};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[0 2]\n","tags":["vero con zero"]},{"n":5,"code":"int v[] = {3, 0, 0};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[3 0 0]\n","tags":["vero"]},{"n":6,"code":"int v[] = {1, 1, 1};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[1 1 1]\n","tags":["vero"]},{"n":7,"code":"int v[] = {1, 2};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[1 2]\n","tags":["falso"]},{"n":8,"code":"int v[] = {-1, 3};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[-1 3]\n","tags":["negativo, vero"]},{"n":9,"code":"int v[] = {5, -3};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[5 -3]\n","tags":["vero"]},{"n":10,"code":"int v[] = {0};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[0]\n","tags":["zero: falso"]}]},{"id":"l-strettamente-decrescente","title":"Lista strettamente decrescente","group":"lista","kind":"L_ret","statement":"Scrivi il codice in linguaggio C della funzione int test(plist p) che verifica che una lista doppiamente concatenata di interi \"p\" sia ordinata in modo strettamente decrescente. Se la lista è vuota la funzione ritorna 1 (cioè true).","fn":"int test(plist p)","starter":"#include <stdio.h>  /* ora puoi usare NULL */\n\n/* scrivi qui la definizione del tipo \"elist\" (elemento della lista)\n   che e' una struttura con i campi \"info\" (intero), \"prev\" (puntatore\n   all'elemento precedente) e \"next\" (puntatore al prossimo elemento). */\n\ntypedef struct elem {\n      ...\n      ...\n    } elist;\n\n/* scrivi qui la definizione del tipo \"plist\" che e' un riferimento\n   ad un oggetto di tipo \"elist\" */\n\ntypedef ...  plist;\n\n/* Scrivi qui eventuali funzioni di appoggio. */\n\n\n/* Scrivi il codice in linguaggio C della funzione int test(plist p) che\n   verifica che una lista doppiamente concatenata di interi \"p\" sia\n   ordinata in modo strettamente decrescente. Se la lista è vuota la\n   funzione ritorna 1 (cioè true). */\n\nint test(plist p){\n\n}\n","solution":"int test(plist p){\n  while (p != NULL && p->next != NULL) {      /* confronto ogni elemento con il successivo */\n    if (p->info <= p->next->info)             /* non strettamente decrescente */\n      return 0;\n    p = p->next;\n  }\n  return 1;\n}","solutionFull":"typedef struct elem {\n  int info;\n  struct elem* prev;\n  struct elem* next;\n} elist;\n\ntypedef elist* plist;\n\nint test(plist p){\n  while (p != NULL && p->next != NULL) {      /* confronto ogni elemento con il successivo */\n    if (p->info <= p->next->info)             /* non strettamente decrescente */\n      return 0;\n    p = p->next;\n  }\n  return 1;\n}","explain":"Confronta ogni coppia di elementi consecutivi (p e p->next). Basta una coppia con info <= successivo per rispondere 0. La condizione del while deve controllare anche p->next != NULL, altrimenti p->next->info dereferenzia NULL sull'ultimo elemento.","hints":["Confronta p->info con p->next->info.","Prima di usare p->next->info verifica che p->next non sia NULL."],"pitfalls":["Dereferenziare p->next quando è NULL","Usare < invece di <= nel controllo di violazione"],"topics":["c-liste","c-casi-limite","c-puntatori"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[]\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {5};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[5]\n","tags":["un elemento"]},{"n":3,"code":"int v[] = {3, 2, 1};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[3 2 1]\n","tags":["vero"]},{"n":4,"code":"int v[] = {3, 3, 1};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[3 3 1]\n","tags":["uguali (non stretto)"]},{"n":5,"code":"int v[] = {1, 2};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[1 2]\n","tags":["crescente"]},{"n":6,"code":"int v[] = {5, 4, 6};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[5 4 6]\n","tags":["rompe alla fine"]},{"n":7,"code":"int v[] = {10, 5, 0, -5};\nplist p = L_make(v, 4);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[10 5 0 -5]\n","tags":["negativi"]},{"n":8,"code":"int v[] = {4, 3, 3};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[4 3 3]\n","tags":["uguali alla fine"]},{"n":9,"code":"int v[] = {9, 8, 7, 6, 5, 4, 3, 2, 1};\nplist p = L_make(v, 9);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[9 8 7 6 5 4 3 2 1]\n","tags":["lungo vero"]},{"n":10,"code":"int v[] = {2, 1, 2};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[2 1 2]\n","tags":["dopo la discesa risale"]}]},{"id":"l-rimuovi-ultimo-pari","title":"Rimuovere l'ultimo elemento se è pari","group":"lista","kind":"L_rem","statement":"Scrivi il codice in linguaggio C della funzione void test(plist* p) che rimuove da una lista doppiamente concatenata di interi \"p\" l'ultimo elemento solamente nel caso in cui questo abbia valore pari. Ricordati di deallocare l'elemento rimosso. Se la lista è vuota, oppure se l'ultimo elemento ha valore dispari, la funzione non fa nulla. Zero è considerato un elemento pari.","fn":"void test(plist* p)","starter":"#include <stdio.h>  /* ora puoi usare NULL */\n\n/* scrivi qui la definizione del tipo \"elist\" (elemento della lista)\n   che e' una struttura con i campi \"info\" (intero), \"prev\" (puntatore\n   all'elemento precedente) e \"next\" (puntatore al prossimo elemento). */\n\ntypedef struct elem {\n      ...\n      ...\n    } elist;\n\n/* scrivi qui la definizione del tipo \"plist\" che e' un riferimento\n   ad un oggetto di tipo \"elist\" */\n\ntypedef ...  plist;\n\n/* Scrivi qui eventuali funzioni di appoggio. */\n\n\n/* Scrivi il codice in linguaggio C della funzione void test(plist* p) che\n   rimuove da una lista doppiamente concatenata di interi \"p\" l'ultimo\n   elemento solamente nel caso in cui questo abbia valore pari. Ricordati\n   di deallocare l'elemento rimosso. Se la lista è vuota, oppure se\n   l'ultimo elemento ha valore dispari, la funzione non fa nulla. Zero è\n   considerato un elemento pari. */\n\nvoid test(plist* p){\n\n}\n","solution":"void test(plist* p){\n  elist* ultimo;\n  if (*p == NULL)\n    return;\n  ultimo = *p;\n  while (ultimo->next != NULL)          /* arrivo all'ultimo elemento */\n    ultimo = ultimo->next;\n  if (ultimo->info % 2 != 0)            /* dispari: non faccio nulla */\n    return;\n  if (ultimo->prev != NULL)\n    ultimo->prev->next = NULL;          /* il penultimo diventa l'ultimo */\n  else\n    *p = NULL;                          /* c'era un solo elemento: la lista diventa vuota */\n  free(ultimo);\n}","solutionFull":"typedef struct elem {\n  int info;\n  struct elem* prev;\n  struct elem* next;\n} elist;\n\ntypedef elist* plist;\n\nvoid test(plist* p){\n  elist* ultimo;\n  if (*p == NULL)\n    return;\n  ultimo = *p;\n  while (ultimo->next != NULL)          /* arrivo all'ultimo elemento */\n    ultimo = ultimo->next;\n  if (ultimo->info % 2 != 0)            /* dispari: non faccio nulla */\n    return;\n  if (ultimo->prev != NULL)\n    ultimo->prev->next = NULL;          /* il penultimo diventa l'ultimo */\n  else\n    *p = NULL;                          /* c'era un solo elemento: la lista diventa vuota */\n  free(ultimo);\n}","explain":"Scorri fino all'ultimo (next == NULL). Se è pari, scollegalo: il suo precedente diventa l'ultimo (prev->next = NULL). Se non ha precedente era anche la testa, quindi la lista diventa vuota (*p = NULL). Poi free.","hints":["Trova l'ultimo elemento: quello con next == NULL.","Se ha un precedente: prev->next = NULL. Altrimenti la lista diventa vuota: *p = NULL.","Per il dispari negativo usa % 2 != 0."],"pitfalls":["Dimenticare *p = NULL quando c'è un solo elemento","Dimenticare prev->next = NULL (il penultimo punta a memoria liberata)","Dimenticare free"],"topics":["c-liste","c-rimozione","c-modulo","c-casi-limite"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[]\nliberati: 0\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {2};\nplist p = L_make(v, 1);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[]\nliberati: 1\n","tags":["un solo elemento pari"]},{"n":3,"code":"int v[] = {1};\nplist p = L_make(v, 1);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1]\nliberati: 0\n","tags":["un solo elemento dispari"]},{"n":4,"code":"int v[] = {1, 2};\nplist p = L_make(v, 2);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1]\nliberati: 1\n","tags":["ultimo pari"]},{"n":5,"code":"int v[] = {2, 1};\nplist p = L_make(v, 2);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[2 1]\nliberati: 0\n","tags":["ultimo dispari"]},{"n":6,"code":"int v[] = {3, 0};\nplist p = L_make(v, 2);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[3]\nliberati: 1\n","tags":["ultimo zero"]},{"n":7,"code":"int v[] = {4, 6, 8};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[4 6]\nliberati: 1\n","tags":["tre elementi"]},{"n":8,"code":"int v[] = {5, 7, -4};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[5 7]\nliberati: 1\n","tags":["ultimo negativo pari"]},{"n":9,"code":"int v[] = {-3};\nplist p = L_make(v, 1);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[-3]\nliberati: 0\n","tags":["negativo dispari"]},{"n":10,"code":"int v[] = {1, 3, 5};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 3 5]\nliberati: 0\n","tags":["tutti dispari"]}]},{"id":"l-tutti-multipli","title":"Tutti gli elementi multipli di v","group":"lista","kind":"L_val_ret","statement":"Scrivi il codice in linguaggio C della funzione int test(plist p, int v) che verifica che una lista doppiamente concatenata di interi \"p\" contenga tutti elementi multipli di \"v\". Se la lista è vuota la funzione ritorna 1 (cioè true). Osservazione: se x è multiplo di y, allora x % y è uguale a zero.","fn":"int test(plist p, int v)","starter":"#include <stdio.h>  /* ora puoi usare NULL */\n\n/* scrivi qui la definizione del tipo \"elist\" (elemento della lista)\n   che e' una struttura con i campi \"info\" (intero), \"prev\" (puntatore\n   all'elemento precedente) e \"next\" (puntatore al prossimo elemento). */\n\ntypedef struct elem {\n      ...\n      ...\n    } elist;\n\n/* scrivi qui la definizione del tipo \"plist\" che e' un riferimento\n   ad un oggetto di tipo \"elist\" */\n\ntypedef ...  plist;\n\n/* Scrivi qui eventuali funzioni di appoggio. */\n\n\n/* Scrivi il codice in linguaggio C della funzione int test(plist p, int v)\n   che verifica che una lista doppiamente concatenata di interi \"p\"\n   contenga tutti elementi multipli di \"v\". Se la lista è vuota la funzione\n   ritorna 1 (cioè true). Osservazione: se x è multiplo di y, allora x % y\n   è uguale a zero. */\n\nint test(plist p, int v){\n\n}\n","solution":"int test(plist p, int v){\n  while (p != NULL) {\n    if (p->info % v != 0)         /* non è un multiplo di v */\n      return 0;\n    p = p->next;\n  }\n  return 1;\n}","solutionFull":"typedef struct elem {\n  int info;\n  struct elem* prev;\n  struct elem* next;\n} elist;\n\ntypedef elist* plist;\n\nint test(plist p, int v){\n  while (p != NULL) {\n    if (p->info % v != 0)         /* non è un multiplo di v */\n      return 0;\n    p = p->next;\n  }\n  return 1;\n}","explain":"Un \"per ogni\" sulla lista: se trovi un elemento con info % v != 0 ritorna 0; se arrivi in fondo ritorna 1 (anche per la lista vuota).","hints":["Scorri la lista e controlla info % v.","Ritorna 1 solo dopo il ciclo."],"pitfalls":["Scambiare v % info","Ritornare 1 dentro il ciclo"],"topics":["c-liste","c-modulo"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"int v[] = {4, 8};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p, 4));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[4 8]\n","tags":["vero"]},{"n":2,"code":"int v[] = {4, 9};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p, 4));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[4 9]\n","tags":["ultimo no"]},{"n":3,"code":"plist p = NULL;\nprintf(\"%d\\n\", test(p, 3));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[]\n","tags":["lista vuota"]},{"n":4,"code":"int v[] = {0};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p, 5));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[0]\n","tags":["zero"]},{"n":5,"code":"int v[] = {-6, 3};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p, 3));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[-6 3]\n","tags":["negativi"]},{"n":6,"code":"int v[] = {6, 9, 12};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p, 3));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[6 9 12]\n","tags":["vero lungo"]},{"n":7,"code":"int v[] = {6, 9, 13};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p, 3));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[6 9 13]\n","tags":["ultimo no"]},{"n":8,"code":"int v[] = {7};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p, 7));\nL_print(p);   /* la lista non deve essere s next;\n  }\n  return 0;\n}","explain":"Un \"esiste\": appena trovi un elemento > 0 ritorna 1; se finisci la lista senza trovarlo ritorna 0 (lista vuota compresa, senza bisogno di casi speciali).","hints":["Ritorna 1 non appena ne trovi uno.","Se esci dal ciclo senza averlo trovato, ritorna 0."],"pitfalls":["Ritornare 0 nell'else dentro il ciclo (guarda solo il primo elemento)"],"topics":["c-liste","c-casi-limite"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[]\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {1};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[1]\n","tags":["un positivo"]},{"n":3,"code":"int v[] = {0};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[0]\n","tags":["zero"]},{"n":4,"code":"int v[] = {-1};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[-1]\n","tags":["negativo"]},{"n":5,"code":"int v[] = {-1, 0, 3};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[-1 0 3]\n","tags":["positivo in fondo"]},{"n":6,"code":"int v[] = {0, 0, 0};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[0 0 0]\n","tags":["tutti zero"]},{"n":7,"code":"int v[] = {-5, -3, -1, 2};\nplist p = L_make(v, 4);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[-5 -3 -1 2]\n","tags":["solo l'ultimo"]},{"n":8,"code":"int v[] = {2, -1};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[2 -1]\n","tags":["solo il primo"]},{"n":9,"code":"int v[] = {-1, -2, -3};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[-1 -2 -3]\n","tags":["tutti negativi"]}]},{"id":"l-tutti-negativi","title":"Tutti gli elementi minori di zero","group":"lista","kind":"L_ret","statement":"Scrivi il codice in linguaggio C della funzione int test(plist p) che verifica che una lista doppiamente concatenata di interi \"p\" contenga tutti elementi < 0. Se la lista è vuota la funzione ritorna 0 (cioè false).","fn":"int test(plist p)","starter":"#include <stdio.h>  /* ora puoi usare NULL */\n\n/* scrivi qui la definizione del tipo \"elist\" (elemento della lista)\n   che e' una struttura con i campi \"info\" (intero), \"prev\" (puntatore\n   all'elemento precedente) e \"next\" (puntatore al prossimo elemento). */\n\ntypedef struct elem {\n      ...\n      ...\n    } elist;\n\n/* scrivi qui la definizione del tipo \"plist\" che e' un riferimento\n   ad un oggetto di tipo \"elist\" */\n\ntypedef ...  plist;\n\n/* Scrivi qui eventuali funzioni di appoggio. */\n\n\n/* Scrivi il codice in linguaggio C della funzione int test(plist p) che\n   verifica che una lista doppiamente concatenata di interi \"p\" contenga\n   tutti elementi < 0. Se la lista è vuota la funzione ritorna 0 (cioè\n   false). */\n\nint test(plist p){\n\n}\n","solution":"int test(plist p){\n  if (p == NULL)                  /* la lista vuota deve dare 0 */\n    return 0;\n  while (p != NULL) {\n    if (p->info >= 0)\n      return 0;\n    p = p->next;\n  }\n  return 1;\n}","solutionFull":"typedef struct elem {\n  int info;\n  struct elem* prev;\n  struct elem* next;\n} elist;\n\ntypedef elist* plist;\n\nint test(plist p){\n  if (p == NULL)                  /* la lista vuota deve dare 0 */\n    return 0;\n  while (p != NULL) {\n    if (p->info >= 0)\n      return 0;\n    p = p->next;\n  }\n  return 1;\n}","explain":"Un \"per ogni\" ma con la lista vuota che dà 0 (il testo lo vuole esplicitamente): gestiscila prima del ciclo. Poi ritorna 0 appena trovi info >= 0 e 1 alla fine.","hints":["Gestisci prima la lista vuota.","Ritorna 0 quando trovi un elemento >= 0."],"pitfalls":["Ritornare 1 per la lista vuota","Usare > 0 (lo zero non è negativo)"],"topics":["c-liste","c-casi-limite"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[]\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {-1};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[-1]\n","tags":["un negativo"]},{"n":3,"code":"int v[] = {0};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[0]\n","tags":["zero"]},{"n":4,"code":"int v[] = {1};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[1]\n","tags":["positivo"]},{"n":5,"code":"int v[] = {-1, -2, -3};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[-1 -2 -3]\n","tags":["vero"]},{"n":6,"code":"int v[] = {-1, 0};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[-1 0]\n","tags":["zero in fondo"]},{"n":7,"code":"int v[] = {-1, -2, 1};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[-1 -2 1]\n","tags":["positivo in fondo"]},{"n":8,"code":"int v[] = {-5, -4, -3, -2, -1};\nplist p = L_make(v, 5);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[-5 -4 -3 -2 -1]\n","tags":["vero lungo"]},{"n":9,"code":"int v[] = {1, -1};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[1 -1]\n","tags":["positivo all'inizio"]}]},{"id":"l-rimuovi-primo-dispari","title":"Rimuovere il primo elemento di valore dispari","group":"lista","kind":"L_rem","statement":"Scrivi il codice in linguaggio C della funzione void test(plist* p) che rimuove da una lista doppiamente concatenata di interi \"p\" il primo elemento di valore dispari presente nella lista. Ricordati di deallocare l'elemento rimosso. Se la lista è vuota, oppure se tutti gli elementi sono pari, la funzione non fa nulla. Zero è considerato un elemento pari.","fn":"void test(plist* p)","starter":"#include <stdio.h>  /* ora puoi usare NULL */\n\n/* scrivi qui la definizione del tipo \"elist\" (elemento della lista)\n   che e' una struttura con i campi \"info\" (intero), \"prev\" (puntatore\n   all'elemento precedente) e \"next\" (puntatore al prossimo elemento). */\n\ntypedef struct elem {\n      ...\n      ...\n    } elist;\n\n/* scrivi qui la definizione del tipo \"plist\" che e' un riferimento\n   ad un oggetto di tipo \"elist\" */\n\ntypedef ...  plist;\n\n/* Scrivi qui eventuali funzioni di appoggio. */\n\n\n/* Scrivi il codice in linguaggio C della funzione void test(plist* p) che\n   rimuove da una lista doppiamente concatenata di interi \"p\" il primo\n   elemento di valore dispari presente nella lista. Ricordati di deallocare\n   l'elemento rimosso. Se la lista è vuota, oppure se tutti gli elementi\n   sono pari, la funzione non fa nulla. Zero è considerato un elemento\n   pari. */\n\nvoid test(plist* p){\n\n}\n","solution":"void test(plist* p){\n  elist* c = *p;\n  while (c != NULL && c->info % 2 == 0)       /* salto i pari */\n    c = c->next;\n  if (c == NULL)                              /* nessun dispari */\n    return;\n  if (c->prev != NULL)\n    c->prev->next = c->next;\n  else\n    *p = c->next;                             /* rimossa la testa */\n  if (c->next != NULL)\n    c->next->prev = c->prev;\n  free(c);\n}","solutionFull":"typedef struct elem {\n  int info;\n  struct elem* prev;\n  struct elem* next;\n} elist;\n\ntypedef elist* plist;\n\nvoid test(plist* p){\n  elist* c = *p;\n  while (c != NULL && c->info % 2 == 0)       /* salto i pari */\n    c = c->next;\n  if (c == NULL)                              /* nessun dispari */\n    return;\n  if (c->prev != NULL)\n    c->prev->next = c->next;\n  else\n    *p = c->next;                             /* rimossa la testa */\n  if (c->next != NULL)\n    c->next->prev = c->prev;\n  free(c);\n}","explain":"Cerca il primo c con info dispari (usa \"% 2 != 0\" / salta i pari con \"% 2 == 0\", valido anche per i negativi). Poi lo scolleghi come in ogni rimozione: next del precedente (o *p), prev del successivo, free.","hints":["Cerca il puntatore al primo elemento dispari.","Poi applica lo schema di rimozione: precedente, successivo, testa, free.","-3 % 2 vale -1: controlla \"!= 0\"."],"pitfalls":["Testare \"% 2 == 1\"","Non aggiornare *p se si rimuove la testa","Dimenticare prev del successivo"],"topics":["c-liste","c-rimozione","c-modulo","c-casi-limite"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[]\nliberati: 0\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {2};\nplist p = L_make(v, 1);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[2]\nliberati: 0\n","tags":["un pari"]},{"n":3,"code":"int v[] = {1};\nplist p = L_make(v, 1);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[]\nliberati: 1\n","tags":["un dispari"]},{"n":4,"code":"int v[] = {2, 3};\nplist p = L_make(v, 2);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[2]\nliberati: 1\n","tags":["dispari in coda"]},{"n":5,"code":"int v[] = {3, 2};\nplist p = L_make(v, 2);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[2]\nliberati: 1\n","tags":["dispari in testa"]},{"n":6,"code":"int v[] = {2, 3, 5};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[2 5]\nliberati: 1\n","tags":["due dispari: vale il primo"]},{"n":7,"code":"int v[] = {2, 4, 6};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() -  ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[]\nliberati: 0\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {5};\nplist p = L_make(v, 1);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[]\nliberati: 1\n","tags":["un solo elemento"]},{"n":3,"code":"int v[] = {1, 2};\nplist p = L_make(v, 2);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 2]\nliberati: 0\n","tags":["diversi"]},{"n":4,"code":"int v[] = {1, 2, 1};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 2]\nliberati: 1\n","tags":["uguali agli estremi"]},{"n":5,"code":"int v[] = {3, 3};\nplist p = L_make(v, 2);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[3]\nliberati: 1\n","tags":["due uguali"]},{"n":6,"code":"int v[] = {4, 5, 6, 4};\nplist p = L_make(v, 4);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[4 5 6]\nliberati: 1\n","tags":["quattro elementi"]},{"n":7,"code":"int v[] = {-1, 0, -1};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[-1 0]\nliberati: 1\n","tags":["negativi"]},{"n":8,"code":"int v[] = {1, 2, 3, 2};\nplist p = L_make(v, 4);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 2 3 2]\nliberati: 0\n","tags":["uguale a uno di mezzo"]},{"n":9,"code":"int v[] = {7, 7, 7};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[7 7]\nliberati: 1\n","tags":["tutti uguali"]}]},{"id":"l-somma-negativa","title":"Somma degli elementi minore di zero","group":"lista","kind":"L_ret","statement":"Scrivi il codice in linguaggio C della funzione int test(plist p) che verifica che la somma degli elementi di una lista doppiamente concatenata di interi \"p\" sia un numero < 0. Se la lista è vuota la funzione ritorna 0 (cioè false).","fn":"int test(plist p)","starter":"#include <stdio.h>  /* ora puoi usare NULL */\n\n/* scrivi qui la definizione del tipo \"elist\" (elemento della lista)\n   che e' una struttura con i campi \"info\" (intero), \"prev\" (puntatore\n   all'elemento precedente) e \"next\" (puntatore al prossimo elemento). */\n\ntypedef struct elem {\n      ...\n      ...\n    } elist;\n\n/* scrivi qui la definizione del tipo \"plist\" che e' un riferimento\n   ad un oggetto di tipo \"elist\" */\n\ntypedef ...  plist;\n\n/* Scrivi qui eventuali funzioni di appoggio. */\n\n\n/* Scrivi il codice in linguaggio C della funzione int test(plist p) che\n   verifica che la somma degli elementi di una lista doppiamente\n   concatenata di interi \"p\" sia un numero < 0. Se la lista è vuota la\n   funzione ritorna 0 (cioè false). */\n\nint test(plist p){\n\n}\n","solution":"int test(plist p){\n  int somma = 0;\n  if (p == NULL)\n    return 0;\n  while (p != NULL) {\n    somma = somma + p->info;\n    p = p->next;\n  }\n  return somma < 0;\n}","solutionFull":"typedef struct elem {\n  int info;\n  struct elem* prev;\n  struct elem* next;\n} elist;\n\ntypedef elist* plist;\n\nint test(plist p){\n  int somma = 0;\n  if (p == NULL)\n    return 0;\n  while (p != NULL) {\n    somma = somma + p->info;\n    p = p->next;\n  }\n  return somma < 0;\n}","explain":"Somma tutto e confronta con 0 alla fine. La lista vuota ha somma 0 (che non è < 0), quindi darebbe 0 comunque: il caso speciale qui non cambia il risultato ma rende il codice più chiaro.","hints":["Somma tutti gli elementi e confronta con 0."],"pitfalls":["Controllare i singoli elementi invece della somma"],"topics":["c-liste","c-casi-limite"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[]\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {-1};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[-1]\n","tags":["un negativo"]},{"n":3,"code":"int v[] = {0};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[0]\n","tags":["zero"]},{"n":4,"code":"int v[] = {1};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[1]\n","tags":["positivo"]},{"n":5,"code":"int v[] = {1, -2};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[1 -2]\n","tags":["somma -1"]},{"n":6,"code":"int v[] = {2, -2};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[2 -2]\n","tags":["somma zero"]},{"n":7,"code":"int v[] = {-5, 3, 1};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[-5 3 1]\n","tags":["somma -1"]},{"n":8,"code":"int v[] = {3, -1, -1};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[3 -1 -1]\n","tags":["somma 1"]},{"n":9,"code":"int v[] = {-1, -1, 3};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[-1 -1 3]\n","tags":["somma 1"]}]},{"id":"l-rimuovi-prima-occorrenza","title":"Rimuovere la prima occorrenza di v","group":"lista","kind":"L_rem_val","statement":"Scrivi il codice in linguaggio C della funzione void test(plist* p, int v) che rimuove da una lista doppiamente concatenata di interi \"p\" la prima occorrenza del valore \"v\" presente nella lista. Ricordati di deallocare l'elemento rimosso. Se la lista è vuota, oppure se nessun elemento ha valore \"v\" la funzione non fa nulla.","fn":"void test(plist* p, int v)","starter":"#include <stdio.h>  /* ora puoi usare NULL */\n\n/* scrivi qui la definizione del tipo \"elist\" (elemento della lista)\n   che e' una struttura con i campi \"info\" (intero), \"prev\" (puntatore\n   all'elemento precedente) e \"next\" (puntatore al prossimo elemento). */\n\ntypedef struct elem {\n      ...\n      ...\n    } elist;\n\n/* scrivi qui la definizione del tipo \"plist\" che e' un riferimento\n   ad un oggetto di tipo \"elist\" */\n\ntypedef ...  plist;\n\n/* Scrivi qui eventuali funzioni di appoggio. */\n\n\n/* Scrivi il codice in linguaggio C della funzione void test(plist* p, int\n   v) che rimuove da una lista doppiamente concatenata di interi \"p\" la\n   prima occorrenza del valore \"v\" presente nella lista. Ricordati di\n   deallocare l'elemento rimosso. Se la lista è vuota, oppure se nessun\n   elemento ha valore \"v\" la funzione non fa nulla. */\n\nvoid test(plist* p, int v){\n\n}\n","solution":"void test(plist* p, int v){\n  elist* c = *p;\n  while (c != NULL && c->info != v)           /* cerco la prima occorrenza */\n    c = c->next;\n  if (c == NULL)                              /* lista vuota o v non presente */\n    return;\n  if (c->prev != NULL)\n    c->prev->next = c->next;                  /* il precedente salta c */\n  else\n    *p = c->next;                             /* c era la testa */\n  if (c->next != NULL)\n    c->next->prev = c->prev;                  /* il successivo punta al precedente */\n  free(c);\n}","solutionFull":"typedef struct elem {\n  int info;\n  struct elem* prev;\n  struct elem* next;\n} elist;\n\ntypedef elist* plist;\n\nvoid test(plist* p, int v){\n  elist* c = *p;\n  while (c != NULL && c->info != v)           /* cerco la prima occorrenza */\n    c = c->next;\n  if (c == NULL)                              /* lista vuota o v non presente */\n    return;\n  if (c->prev != NULL)\n    c->prev->next = c->next;                  /* il precedente salta c */\n  else\n    *p = c->next;                             /* c era la testa */\n  if (c->next != NULL)\n    c->next->prev = c->prev;                  /* il successivo punta al precedente */\n  free(c);\n}","explain":"È lo schema di rimozione di base. (1) Cerca c: la prima cella con info == v. (2) Se c è NULL non c'è nulla da fare. (3) Scollega c: il suo precedente deve puntare al suo successivo (se non c'è precedente cambia la testa *p) e il suo successivo deve puntare al suo precedente (se esiste). (4) free(c).","hints":["Cerca il puntatore c alla prima cella con info == v.","Se c è la testa devi cambiare *p.","Se c ha un successivo, il suo prev va aggiornato.","Alla fine free(c)."],"pitfalls":["Non aggiornare *p","Non aggiornare prev del successivo","Dimenticare free(c)","Rimuovere tutte le occorrenze invece della prima","Usare p (plist*) senza *: p->info non esiste"],"topics":["c-liste","c-rimozione","c-puntatori","c-casi-limite"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p, 3);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[]\nliberati: 0\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {3};\nplist p = L_make(v, 1);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p, 3);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[]\nliberati: 1\n","tags":["un solo elemento"]},{"n":3,"code":"int v[] = {1, 2, 3};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p, 3);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 2]\nliberati: 1\n","tags":["ultimo"]},{"n":4,"code":"int v[] = {1, 2, 3};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p, 1);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[2 3]\nliberati: 1\n","tags":["primo"]},{"n":5,"code":"int v[] = {1, 2, 3};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p, 2);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 3]\nliberati: 1\n","tags":["in mezzo"]},{"n":6,"code":"int v[] = {1, 2, 3};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p, 9);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 2 3]\nliberati: 0\n","tags":["non presente"]},{"n":7,"code":"int v[] = {2, 2, 2};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p, 2);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[2 2]\nliberati: 1\n","tags":["duplicati: solo il primo"]},{"n":8,"code":"int v[] = {1, 3, 2, 3};\nplist p = L_make(v, 4);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p, 3);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 2 3]\nliberati: 1\n","tags":["duplicato in mezzo"]},{"n":9,"code":"int v[] = {5};\nplist p = L_make(v, 1);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p, 7);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[5]\nliberati: 0\n","tags":["un elemento, non presente"]},{"n":10,"code":"int v[] = {-1, -2};\nplist p = L_make(v, 2);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p, -2);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[-1]\nliberati: 1\n","tags":["negativi"]}]},{"id":"l-rimuovi-maggiore-successivo","title":"Rimuovere il primo elemento maggiore del successivo","group":"lista","kind":"L_rem","statement":"Scrivi il codice in linguaggio C della funzione void test(plist* p) che rimuove da una lista doppiamente concatenata di interi \"p\" il primo elemento trovato che abbia valore strettamente maggiore dell'elemento successivo. Ricordati di deallocare l'elemento rimosso. L'ultimo elemento non viene mai rimosso. Se la lista è vuota, se ha un solo elemento, oppure se tutti gli elementi hanno valore minore o uguale del successivo, la funzione non fa nulla.","fn":"void test(plist* p)","starter":"#include <stdio.h>  /* ora puoi usare NULL */\n\n/* scrivi qui la definizione del tipo \"elist\" (elemento della lista)\n   che e' una struttura con i campi \"info\" (intero), \"prev\" (puntatore\n   all'elemento precedente) e \"next\" (puntatore al prossimo elemento). */\n\ntypedef struct elem {\n      ...\n      ...\n    } elist;\n\n/* scrivi qui la definizione del tipo \"plist\" che e' un riferimento\n   ad un oggetto di tipo \"elist\" */\n\ntypedef ...  plist;\n\n/* Scrivi qui eventuali funzioni di appoggio. */\n\n\n/* Scrivi il codice in linguaggio C della funzione void test(plist* p) che\n   rimuove da una lista doppiamente concatenata di interi \"p\" il primo\n   elemento trovato che abbia valore strettamente maggiore dell'elemento\n   successivo. Ricordati di deallocare l'elemento rimosso. L'ultimo\n   elemento non viene mai rimosso. Se la lista è vuota, se ha un solo\n   elemento, oppure se tutti gli elementi hanno valore minore o uguale del\n   successivo, la funzione non fa nulla. */\n\nvoid test(plist* p){\n\n}\n","solution":"void test(plist* p){\n  elist* c = *p;\n  /* cerco il primo c che ha un successivo e vale più del successivo */\n  while (c != NULL && c->next != NULL && c->info <= c->next->info)\n    c = c->next;\n  if (c == NULL || c->next == NULL)           /* nessuno trovato (l'ultimo non si rimuove) */\n    return;\n  if (c->prev != NULL)\n    c->prev->next = c->next;\n  else\n    *p = c->next;\n  c->next->prev = c->prev;                    /* c->next esiste di sicuro */\n  free(c);\n}","solutionFull":"typedef struct elem {\n  int info;\n  struct elem* prev;\n  struct elem* next;\n} elist;\n\ntypedef elist* plist;\n\nvoid test(plist* p){\n  elist* c = *p;\n  /* cerco il primo c che ha un successivo e vale più del successivo */\n  while (c != NULL && c->next != NULL && c->info <= c->next->info)\n    c = c->next;\n  if (c == NULL || c->next == NULL)           /* nessuno trovato (l'ultimo non si rimuove) */\n    return;\n  if (c->prev != NULL)\n    c->prev->next = c->next;\n  else\n    *p = c->next;\n  c->next->prev = c->prev;                    /* c->next esiste di sicuro */\n  free(c);\n}","explain":"Scorri finché c ha un successivo e c->info <= c->next->info. Se ti fermi con c->next == NULL non hai trovato nulla (l'ultimo non si può rimuovere). Altrimenti c > successivo: scollegalo (qui c->next esiste certamente, quindi puoi aggiornare c->next->prev senza controlli) e libera.","hints":["Cerca la prima posizione c con c->info > c->next->info.","Controlla c->next != NULL prima di leggere c->next->info.","Poi scollega c con lo schema solito e free."],"pitfalls":["Dereferenziare c->next quando è NULL","Rimuovere l'ultimo elemento","Usare >= invece di >"],"topics":["c-liste","c-rimozione","c-casi-limite"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[]\nliberati: 0\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {5};\nplist p = L_make(v, 1);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[5]\nliberati: 0\n","tags":["un solo elemento"]},{"n":3,"code":"int v[] = {1, 2, 3};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 2 3]\nliberati: 0\n","tags":["crescente: nulla"]},{"n":4,"code":"int v[] = {3, 2, 1};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[2 1]\nliberati: 1\n","tags":["decrescente: vale il primo"]},{"n":5,"code":"int v[] = {1, 3, 2};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 2]\nliberati: 1\n","tags":["in mezzo"]},{"n":6,"code":"int v[] = {1, 2, 2};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 2 2]\nliberati: 0\n","tags":["uguali: nulla"]},{"n":7,"code":"int v[] = {2, 1, 3, 2};\nplist p = L_make(v, 4);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 3 2]\nliberati: 1\n","tags":["due candidati: vale il primo"]},{"n":8,"code":"int v[] = {5, 4};\nplist p = L_make(v, 2);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[4]\nliberati: 1\n","tags":["due elementi"]},{"n":9,"code":"int v[] = {1, 2, 3, 2};\nplist p = L_make(v, 4);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[1 2 2]\nliberati: 1\n","tags":["il penultimo"]},{"n":10,"code":"int v[] = {4, 4, 3};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[4 3]\nliberati: 1\n","tags":["uguali poi minore"]},{"n":11,"code":"int v[] = {0, -1, -2};\nplist p = L_make(v, 3);\nint f0 = __frees();   /* free() eseguite finora (funzione del simulatore) */\ntest(&p);\nL_print(p);\nprintf(\"liberati: %d\\n\", __frees() - f0);","expected":"[-1 -2]\nliberati: 1\n","tags":["negativi"]}]}]}</script>
<script type="text/plain" id="cinterp-src">/* cinterp.js - interprete di un sottoinsieme di C (C99) per il browser e per Node.
   Memoria a byte con layout "da gcc x86_64": int=4, long=8, puntatori=8.
   Rileva: NULL deref, accessi fuori dai limiti dell'heap, use-after-free, double free,
   uso di variabili locali scadute, letture di memoria non inizializzata, cicli infiniti. */
(function (root, factory) {

})(typeof self !== 'undefined' ? self : this, function () {

class CError extends Error {
  constructor(kind, msg, line) { super(msg); this.kind = kind; this.line = line || 0; }
}
class ExitSignal { constructor(code) { this.code = code; } }

/* ---------------------------------------------------------------- tipi */
const T = {
  void: { k: 'void', size: 1, nm: 'void' },
  char: { k: 'int', size: 1, uns: false, nm: 'char' },
  uchar: { k: 'int', size: 1, uns: true, nm: 'unsigned char' },
  short: { k: 'int', size: 2, uns: false, nm: 'short' },
  ushort: { k: 'int', size: 2, uns: true, nm: 'unsigned short' },
  int: { k: 'int', size: 4, uns: false, nm: 'int' },
  uint: { k: 'int', size: 4, uns: true, nm: 'unsigned int' },
  long: { k: 'int', size: 8, uns: false, nm: 'long' },
  ulong: { k: 'int', size: 8, uns: true, nm: 'unsigned long' },
  bool: { k: 'int', size: 1, uns: true, nm: '_Bool', isBool: true },
  float: { k: 'float', size: 4, nm: 'float' },
  double: { k: 'float', size: 8, nm: 'double' },
};
const ptrTo = (t) => ({ k: 'ptr', to: t, size: 8 });
const arrOf = (t, n) => ({ k: 'arr', of: t, n, size: (n == null ? 0 : n * t.size) });
const T_VOIDP = ptrTo(T.void);
const T_CHARP = ptrTo(T.char);

function alignOf(t) {
  switch (t.k) {
    case 'arr': return alignOf(t.of);
    case 'struct': return t.align || 1;
    case 'void': return 1;
    default: return Math.min(t.size, 8);
  }
}
function typeStr(t) {
  switch (t.k) {
    case 'ptr': return typeStr(t.to) + '*';
    case 'arr': return typeStr(t.of) + '[' + (t.n == null ? '' : t.n) + ']';
    case 'struct': return t.alias ? t.alias : (t.isUnion ? 'union ' : 'struct ') + (t.tag && t.tag[0] !== '#' ? t.tag : '<anonima>');
    case 'func': return typeStr(t.ret) + '(funzione)';
    default: return t.nm || t.k;
  }
}
const isInt = (t) => t.k === 'int';
const isFlt = (t) => t.k === 'float';
const isPtr = (t) => t.k === 'ptr';
const isArith = (t) => t.k === 'int' || t.k === 'float';
const isScalar = (t) => t.k === 'int' || t.k === 'float' || t.k === 'ptr';

function promote(t) { return (t.k === 'int' && (t.size < 4)) ? T.int : t; }
function usual(a, b) {
  if (a.k === 'float' || b.k === 'float') {
    if ((a.k === 'float' && a.size === 8) || (b.k === 'float' && b.size === 8)) return T.double;
    return T.float;
  }
  a = promote(a); b = promote(b);
  if (a.size === 8 || b.size === 8) {
    const u = (a.size === 8 && a.uns) || (b.size === 8 && b.uns);
    return u ? T.ulong : T.long;
  }
  return (a.uns || b.uns) ? T.uint : T.int;
}

/* ------------------------------------------------------ preprocessore */
function preprocess(src, predefined) {
  // 1) commenti e continuazioni di riga
  let out = '', i = 0; const n = src.length; let pend = 0;
  while (i < n) {
    const c = src[i], d = src[i + 1];
    if (c === '/' && d === '*') {
      let j = src.indexOf('*/', i + 2); if (j < 0) j = n;
      const seg = src.slice(i, j + 2);
      out += ' ' + (seg.match(/\n/g) || []).join('');
      i = j + 2; continue;
    }
    if (c === '/' && d === '/') { while (i < n && src[i] !== '\n') i++; continue; }
    if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < n && src[j] !== c && src[j] !== '\n') { if (src[j] === '\\') j++; j++; }
      out += src.slice(i, j + 1); i = j + 1; continue;
    }
    if (c === '\\' && (d === '\n' || (d === '\r' && src[i + 2] === '\n'))) { pend++; i += (d === '\r' ? 3 : 2); continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n' && pend) { out += '\n' + '\n'.repeat(pend); pend = 0; i++; continue; }
    out += c; i++;
  }
  const lines = out.split('\n');
  const macros = new Map(predefined || []);
  const includes = [];
  const stack = []; // {active, taken, parent}
  const active = () => stack.length === 0 || stack[stack.length - 1].active;
  const evalCond = (expr) => {
    let e = expr.replace(/defined\s*\(\s*(\w+)\s*\)|defined\s+(\w+)/g, (_, a, b) => (macros.has(a || b) ? '1' : '0'));
    e = e.replace(/[A-Za-z_]\w*/g, (id) => {
      const m = macros.get(id);
      return (m && !m.params && /^\s*-?\d+\s*$/.test(m.body)) ? m.body : '0';
    });
    if (!/^[\d\s()!<>=&|+\-*/%]*$/.test(e)) return false;
    try { return !!Function('"use strict";return (' + (e.trim() || '0') + ')')(); } catch (x) { return false; }
  };
  for (let li = 0; li < lines.length; li++) {
    const m = /^\s*#\s*(\w*)\s*(.*)$/.exec(lines[li]);
    if (!m) { if (!active()) lines[li] = ''; continue; }
    const dir = m[1], rest = m[2].trim();
    lines[li] = '';
    switch (dir) {
      case 'ifdef': { const a = active(); const v = macros.has(rest.split(/\s+/)[0]); stack.push({ active: a && v, taken: v, parent: a }); break; }
      case 'ifndef': { const a = active(); const v = !macros.has(rest.split(/\s+/)[0]); stack.push({ active: a && v, taken: v, parent: a }); break; }
      case 'if': { const a = active(); const v = a ? evalCond(rest) : false; stack.push({ active: a && v, taken: v, parent: a }); break; }
      case 'elif': { const s = stack[stack.length - 1]; if (s) { if (s.taken) s.active = false; else { const v = s.parent ? evalCond(rest) : false; s.active = s.parent && v; s.taken = v; } } break; }
      case 'else': { const s = stack[stack.length - 1]; if (s) { s.active = s.parent && !s.taken; s.taken = true; } break; }
      case 'endif': stack.pop(); break;
      case 'include': if (active()) { const mm = /[<"]([^>"]+)[>"]/.exec(rest); if (mm) includes.push({ name: mm[1], line: li + 1 }); } break;
