=\"fig-guide\" x1=\"34\" y1=\"48\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"48\" x2=\"174.57142857142858\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"174.57142857142858\" y=\"66\">Ω(n)<\/text><rect class=\"fig-bar fig-y\" x=\"174.57142857142858\" y=\"72\" width=\"375.42857142857144\" height=\"12\" rx=\"6\"/><path class=\"fig-y\" d=\"M548 69 L558 78 L548 87 Z\"/><circle class=\"fig-end in fig-y\" cx=\"174.57142857142858\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"86\" x2=\"174.57142857142858\" y2=\"112\"/><g class=\"fig-mark bad\"><circle cx=\"34\" cy=\"40\" r=\"9\"/><text x=\"34\" y=\"44\" text-anchor=\"middle\">✕<\/text><\/g><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p><div class=\"ex-ambig\"><b>⚠ Lettura ambigua.<\/b> Nel testo copiato «2n» può significare 2·n (fattore costante, la lettura usata qui) oppure 2ⁿ. se nel tuo quiz era 2ⁿ: O(2ⁿ) contiene anche T(n) = 1, che non è Ω(n): la risposta resta <b>Falso<\/b>.<\/div>","topics":["asy-ol"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[11,24,33,35,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q117"],"ambig":true,"alt":{"answer":false,"why":"se nel tuo quiz era 2ⁿ: O(2ⁿ) contiene anche T(n) = 1, che non è Ω(n): la risposta resta <b>Falso<\/b>."}},{"id":"vf-m1","type":"vf","text":"Un algoritmo che appartiene ad Ω(n) appartiene sempre ad Ω(2n)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">Ω(n) = gli algoritmi che crescono almeno come n. Ω(2n) = gli algoritmi che crescono almeno come n.<\/p><p>Sono la stessa classe: Ω(n) ⊆ Ω(2n) (le costanti moltiplicative non contano).<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Ω(n) copre le crescite da n (incluso) a infinito. Ω(2n) copre le crescite da n (incluso) a infinito.\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. Ω(n) copre le crescite da n (incluso) a infinito. Ω(2n) copre le crescite da n (incluso) a infinito.<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"174.57142857142858\" y=\"28\">Ω(n)<\/t riore: dice «non cresce più di n», non «cresce almeno n». Controesempio: T(n) = 1 (costante) sta in O(2n) ma <b>non<\/b> in Ω(2n).<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. O(2n) copre le crescite da 1 (incluso) a n (incluso). Ω(2n) copre le crescite da n (incluso) a infinito.\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. O(2n) copre le crescite da 1 (incluso) a n (incluso). Ω(2n) copre le crescite da n (incluso) a infinito.<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"52 ⁿ): la risposta resta <b>Falso<\/b>."}},{"id":"ps-m0","type":"vf","text":"La funzione doppio_ciclo(A) nel caso peggiore ha complessità O(n)?","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">Il programma ha complessità Θ(n²) nel caso peggiore.<\/p><p>I due cicli for vanno entrambi da 0 a n−1 e il corpo (un confronto ed eventualmente un’assegnazione) costa Θ(1). Il ciclo esterno fa n iterazioni e per ognuna il ciclo interno ne fa altre n: il corpo viene eseguito <b>n · n = n²<\/b> volte. Non ci sono return anticipati né break, quindi il numero di iterazioni non dipende dai valori di A: caso migliore, medio e peggiore coincidono. Quindi: Θ(n²) ⊆ O(n)? No.<\/p><p class=\"ex-r\"><b>Cicli annidati<\/b>: si moltiplicano le iterazioni (n · n = n²); cicli in sequenza si sommano (n + n = Θ(n)). Slide 050 p.31–33.<\/p>","topics":["alg-loops"],"prof":true,"freq":1,"slides":[["050-complessita-algoritmi",[31,32,33]]],"eso":1,"code":"doppio_ciclo(A)\n   doppione = false\n   for i=0 to A.length-1\n      for j=0 to A.length-1\n         if (A[i]==A[j])\n            doppione = true\n   return doppione","codeLang":"pseudo","src":["esonero"]},{"id":"ps-q014","type":"vf","text":"La funzione doppio_ciclo(A) nel caso peggiore ha complessità Ω(n²)?","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">Il programma ha complessità Θ(n²) nel caso peggiore.<\/p><p>I due cicli for vanno entrambi da 0 a n−1 e il corpo (un confronto ed eventualmente un’assegnazione) costa Θ(1). Il ciclo esterno fa n iterazioni e per ognuna il ciclo interno ne fa altre n: il corpo viene eseguito <b>n · n = n²<\/b> volte. Non ci sono return anticipati né break, quindi il numero di iterazioni non dipende dai valori di A: caso migliore, medio e peggiore coincidono. Quindi: Θ(n²) ⊆ Ω(n²)? Sì.<\/p><p class=\"ex-r\"><b>Cicli annidati<\/b>: si moltiplicano le iterazioni (n · n = n²); cicli in sequenza si sommano (n + n = Θ(n)). Slide 050 p.31–33.<\/p>","topics":["alg-loops"],"prof":true,"freq":1,"slides":[["050-complessita-algoritmi",[31,32,33]]],"eso":1,"code":"doppio_ciclo(A)\n   doppione = false\n   for i=0 to A.length-1\n      for j=0 to A.length-1\n         if (A[i]==A[j])\n            doppione = true\n   return doppione","codeLang":"pseudo","src":["Q14"]},{"id":"ps-q062","type":"vf","text":"La funzione doppio_ciclo(A) nel caso peggiore ha complessità O(n²).","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">Il programma ha complessità Θ(n²) nel caso peggiore.<\/p><p>I due cicli for vanno entrambi da 0 a n−1 e il corpo (un confronto ed eventualmente un’assegnazione) costa Θ(1). Il ciclo esterno fa n iterazioni e per ognuna il ciclo interno ne fa altre n: il corpo viene eseguito <b>n · n = n²<\/b> volte. Non ci sono return anticipati né break, quindi il numero di iterazioni non dipende dai valori di A: caso migliore, medio e peggiore coincidono. Quindi: Θ(n²) ⊆ O(n²)? Sì.<\/p><p class=\"ex-r\"><b>Cicli annidati<\/b>: si moltiplicano le iterazioni (n · n = n²); cicli in sequenza si sommano (n + n = Θ(n)). Slide 050 p.31–33.<\/p>","topics":["alg-loops"],"prof":true,"freq":1,"slides":[["050-complessita-algoritmi",[31,32,33]]],"eso":1,"code":"doppio_ciclo(A)\n   doppione = false\n   for i=0 to A.length-1\n      for j=0 to A.length-1\n         if (A[i]==A[j])\n            doppione = true\n   return doppione","codeLang":"pseudo","src":["Q62"]},{"id":"ps-q063","type":"vf","text":"La funzione doppio_ciclo(A) nel caso peggiore ha complessità Ω(n⁴)?","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">Il programma ha complessità Θ(n²) nel caso peggiore.<\/p><p>I due cicli for vanno entrambi da 0 a n−1 e il corpo (un confronto ed eventualmente un’assegnazione) costa Θ(1). Il ciclo esterno fa n iterazioni e per ognuna il ciclo interno ne fa altre n: il corpo viene eseguito <b>n · n = n²<\/b> volte. Non ci sono return anticipati né break, quindi il numero di iterazioni non dipende dai valori di A: caso migliore, medio e peggiore coincidono. Quindi: Θ(n²) ⊆ Ω(n⁴)? No.<\/p><p class=\"ex-r\"><b>Cicli annidati<\/b>: si moltiplicano le iterazioni (n · n = n²); cicli in sequenza si sommano (n + n = Θ(n)). Slide 050 p.31–33.<\/p>","topics":["alg-loops"],"prof":true,"freq":1,"slides":[["050-complessita-algoritmi",[31,32,33]]],"eso":1,"code":"doppio_ciclo(A)\n   doppione = false\n   for i=0 to A.length-1\n      for j=0 to A.length-1\n         if (A[i]==A[j])\n            doppione = true\n   return doppione","codeLang":"pseudo","src":["Q63"]},{"id":"c-ptr-deref","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>4<\/code><\/p><p>b contiene l’indirizzo di a. L’operatore * si legge «il puntato da»: *b è la variabile a stessa. Quindi *b = *b + 1 incrementa a, che vale 4.<\/p>","topics":["c-puntatori"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[10,11]]],"eso":0,"title":"Puntatore a una variabile","code":"int main() {\n  int a = 3;\n  int* b = &a;\n  *b = *b + 1;\n  printf(\"%d\", a);\n}","codeLang":"c","options":["4","3","1000","Non compila"],"ordered":false},{"id":"c-ptr-ptr","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>4 4<\/code><\/p><p>**c è «il puntato dal puntato da c»: c punta a b, b punta ad a, quindi **c è a. Modificarlo cambia a, e *b (che è ancora a) vale lo stesso valore.<\/p>","topics":["c-puntatori"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[11,12]]],"eso":0,"title":"Puntatore a puntatore","code":"int main() {\n  int a = 3;\n  int* b = &a;\n  int** c = &b;\n  **c = **c + 1;\n  printf(\"%d %d\", a, *b);\n}","codeLang":"c","options":["4 4","3 3","4 3","3 4"],"ordered":false},{"id":"c-val-param","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>3<\/code><\/p><p>In C tutti i passaggi di parametri sono per valore: incrementa lavora su una COPIA di x. Il parametro a vale 4 solo dentro la funzione; x nel chiamante resta 3.<\/p>","topics":["c-puntatori","c-passaggio"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[13]]],"eso":0,"title":"Passaggio per valore","code":"void incrementa(int a) {\n  a = a + 1;\n}\n\nint main() {\n  int x = 3;\n  incrementa(x);\n  printf(\"%d\", x);\n}","codeLang":"c","options":["3","4","0","Non compila"],"ordered":false},{"id":"c-ptr-param","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>4<\/code><\/p><p>Si passa (per valore) l’INDIRIZZO di x. La funzione scrive nella cella puntata: (*a) è x stesso. È così che si simula il «passaggio per riferimento».<\/p>","topics":["c-puntatori","c-passaggio"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[14]]],"eso":0,"title":"Passaggio dell’indirizzo","code":"void incrementa(int* a) {\n  (*a) = (*a) + 1;\n}\n\nint main() {\n  int x = 3;\n  incrementa(&x);\n  printf(\"%d\", x);\n}","codeLang":"c","options":["4","3","1","Non compila"],"ordered":false},{"id":"c-swap-bad","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>1 2<\/code><\/p><p>scambia riceve due COPIE di x e y e scambia le copie. Per scambiare le variabili del chiamante servirebbero due puntatori (int* a, int* b).<\/p>","topics":["c-puntatori","c-passaggio"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[13,14]]],"eso":0,"title":"Scambio sbagliato","code":"void scambia(int a, int b) {\n  int t = a;\n  a = b;\n  b = t;\n}\n\nint main() {\n  int x = 1, y = 2;\n  scambia(x, y);\n  printf(\"%d %d\", x, y);\n}","codeLang":"c","options":["1 2","2 1","1 1","2 2"],"ordered":false},{"id":"c-swap-ok","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>2 1<\/code><\/p><p>Passando &x e &y la funzione lavora sulle celle originali: t = x; x = y; y = t. Il risultato è lo scambio.<\/p>","topics":["c-puntatori","c-passaggio"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[14]]],"eso":0,"title":"Scambio con puntatori","code":"void scambia(int* a, int* b) {\n  int t = *a;\n  *a = *b;\n  *b = t;\n}\n\nint main() {\n  int x = 1, y = 2;\n  scambia(&x, &y);\n  printf(\"%d %d\", x, y);\n}","codeLang":"c","options":["2 1","1 2","1 1","2 2"],"ordered":false},{"id":"c-array-param","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>0 0 0<\/code><\/p><p>Un array è l’indirizzo della sua prima cella: alla funzione viene passato (per valore) quell’indirizzo, quindi A[i] = 0 scrive nell’array originale del chiamante.<\/p>","topics":["c-array","c-passaggio"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[17,19]]],"eso":0,"title":"Un array passato a una funzione","code":"void azzera(int A[], int n) {\n  int i;\n  for (i = 0; i < n; i++)\n    A[i] = 0;\n}\n\nint main() {\n  int v[3] = {1, 2, 3};\n  azzera(v, 3);\n  printf(\"%d %d %d\", v[0], v[1], v[2]);\n}","codeLang":"c","options":["0 0 0","1 2 3","0 2 3","Non compila"],"ordered":false},{"id":"c-ptr-by-value","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>1<\/code><\/p><p>p è una COPIA di q: assegnare p = &y cambia solo la copia. q punta ancora a x. Per modificare il puntatore del chiamante servirebbe un puntatore a puntatore (int** p) e la scrittura *p = …<\/p>","topics":["c-puntatori","c-passaggio"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[13,14]]],"eso":0,"title":"Il puntatore passato è una copia","code":"void imposta(int* p) {\n  int y = 9;\n  p = &y;\n}\n\nint main() {\n  int x = 1;\n  int* q = &x;\n  imposta(q);\n  printf(\"%d\", *q);\n}","codeLang":"c","options":["1","9","0","Segmentation fault"],"ordered":false},{"id":"c-ptr-ptr-param","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>1<\/code><\/p><p>Passando &p (un int**) la funzione può scrivere nella variabile p del chiamante: *pp = NULL la azzera. È lo stesso motivo per cui rimuovere il primo elemento di una lista richiede plist* e non plist: la TESTA cambia.<\/p>","topics":["c-puntatori","c-passaggio","c-rimozione"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[14]]],"eso":0,"title":"Modificare un puntatore del chiamante","code":"void azzera(int** pp) {\n  *pp = NULL;\n}\n\nint main() {\n  int a = 5;\n  int* p = &a;\n  azzera(&p);\n  printf(\"%d\", p == NULL);\n}","codeLang":"c","options":["1","0","5","Non compila"],"ordered":false},{"id":"c-ptr-arith","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>30 30<\/code><\/p><p>Incrementare un puntatore di 2 lo fa avanzare di 2 OGGETTI (non di 2 byte): b punta a a[2] = 30.<\/p>","topics":["c-array","c-puntatori"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[17,18]]],"eso":0,"title":"Aritmetica dei puntatori","code":"int main() {\n  int a[5] = {10, 20, 30, 40, 50};\n  int* b = a;\n  b = b + 2;\n  printf(\"%d %d\", *b, a[2]);\n}","codeLang":"c","options":["30 30","20 30","30 20","12 30"],"ordered":false},{"id":"c-index-eq","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>40 40<\/code><\/p><p>x[y] è per definizione *(x+y). L’addizione è commutativa, quindi anche 3[a] = *(3+a) = a[3] = 40 (è lecito, anche se nessuno lo scrive).<\/p>","topics":["c-array","c-puntatori"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[19]]],"eso":0,"title":"x[y] equivale a *(x+y)","code":"int main() {\n  int a[5] = {10, 20, 30, 40, 50};\n  printf(\"%d %d\", *(a + 3), 3[a]);\n}","codeLang":"c","options":["40 40","30 30","40 30","Non compila"],"ordered":false},{"id":"c-ptr-diff","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>3<\/code><\/p><p>La differenza tra due puntatori allo stesso array conta quante CELLE li separano (non quanti byte): 4 − 1 = 3.<\/p>","topics":["c-array","c-puntatori"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[18]]],"eso":0,"title":"Differenza tra puntatori","code":"int main() {\n  int a[6] = {0, 1, 2, 3, 4, 5};\n  int* p = &a[4];\n  int* q = &a[1];\n  printf(\"%d\", (int)(p - q));\n}","codeLang":"c","options":["3","12","4","5"],"ordered":false},{"id":"c-sizeof-len","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>5<\/code><\/p><p>sizeof(a) è la dimensione totale dell’array (5 interi) e sizeof(a[0]) quella di un elemento: il rapporto è il numero di elementi. Funziona solo dove a è davvero un array (non dentro una funzione che lo riceve come parametro: lì è un puntatore).<\/p>","topics":["c-array"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[15,16]]],"eso":0,"title":"Quanti elementi ha l’array?","code":"int main() {\n  int a[5];\n  printf(\"%d\", (int)(sizeof(a) / sizeof(a[0])));\n}","codeLang":"c","options":["5","20","4","1"],"ordered":false},{"id":"c-calloc","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>0 7<\/code><\/p><p>calloc(5, sizeof(int)) alloca nello heap 5 interi e li azzera. Con malloc il contenuto sarebbe invece imprevedibile. Alla fine si libera con free.<\/p>","topics":["c-array","c-malloc"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[22,23]]],"eso":0,"title":"calloc inizializza a zero","code":"int main() {\n  int* a = (int*) calloc(5, sizeof(int));\n  a[2] = 7;\n  printf(\"%d %d\", a[0], a[2]);\n  free(a);\n}","codeLang":"c","options":["0 7","7 7","5 7","Valore imprevedibile e 7"],"ordered":false},{"id":"c-struct-ptr","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>5 2<\/code><\/p><p>q->x è la scrittura abbreviata di (*q).x: modifica il campo x della struct puntata, cioè p.x. Il campo y non cambia.<\/p>","topics":["c-liste","c-puntatori"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[5,9]]],"eso":0,"title":"Struct e operatore ->","code":"typedef struct {\n  int x;\n  int y;\n} punto;\n\nint main() {\n  punto p = {1, 2};\n  punto* q = &p;\n  q->x = 5;\n  printf(\"%d %d\", p.x, (*q).y);\n}","codeLang":"c","options":["5 2","1 2","5 5","Non compila"],"ordered":false},{"id":"c-int-div","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>3 3.5<\/code><\/p><p>Tra due interi / è la divisione INTERA (scarta i decimali): 7/2 = 3. Basta che UNO dei due operandi sia reale (2.0, oppure un cast come (float)somma) per avere la divisione con la virgola. È l’errore tipico nell’esercizio «media degli elementi».<\/p>","topics":["c-divisione-intera"],"prof":false,"freq":0,"slides":[],"eso":0,"title":"Divisione tra interi","code":"int main() {\n  printf(\"%d %.1f\", 7 / 2, 7 / 2.0);\n}","codeLang":"c","options":["3 3.5","3.5 3.5","4 3.5","3 3"],"ordered":false},{"id":"c-mod-neg","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>-1 1<\/code><\/p><p>In C il resto ha il segno del dividendo: −7 % 2 vale −1, non 1. Per testare «dispari» bisogna scrivere x % 2 != 0 (e non x % 2 == 1, che fallisce per i negativi).<\/p>","topics":["c-modulo"],"prof":false,"freq":0,"slides":[],"eso":0,"title":"Resto con numeri negativi","code":"int main() {\n  printf(\"%d %d\", -7 % 2, 7 % 2);\n}","codeLang":"c","options":["-1 1","1 1","-1 -1","0 1"],"ordered":false},{"id":"c-array-eq-addr","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>1 1<\/code><\/p><p>Il nome dell’array vale l’indirizzo del primo elemento: a == &a[0], e *a è a[0] = 1.<\/p>","topics":["c-array","c-puntatori"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[17]]],"eso":0,"title":"Un array è l’indirizzo della prima cella","code":"int main() {\n  int a[4] = {1, 2, 3, 4};\n  printf(\"%d %d\", a == &a[0], *a);\n}","codeLang":"c","options":["1 1","0 1","1 4","0 0"],"ordered":false},{"id":"c-ptr-step","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>4<\/code><\/p><p>a + 1 avanza di UN intero, cioè sizeof(int) = 4 byte: incrementando un puntatore si salta una porzione di memoria pari alla dimensione dell’oggetto puntato (qui castiamo a char* per misurare i byte).<\/p>","topics":["c-array","c-puntatori"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[18]]],"eso":0,"title":"Quanti byte salta p + 1?","code":"int main() {\n  int a[3] = {1, 2, 3};\n  printf(\"%d\", (int)((char*)(a + 1) - (char*)a));\n}","codeLang":"c","options":["4","1","3","8"],"ordered":false},{"id":"c-sort-off","type":"mc","text":"Che cosa stampa il seguente frammento di codice C?","answer":0,"html":"<p class=\"ex-v\">Output: <code>8<\/code><\/p><p>Il ciclo parte da i = 1 perché max è già inizializzato con A[0]; confronta ogni elemento con il massimo trovato finora. Con i = 4 ci si fermerebbe PRIMA di leggere A[4], che non esiste (indici validi 0…3).<\/p>","topics":["c-array","c-casi-limite"],"prof":false,"freq":0,"slides":[],"eso":0,"title":"Ciclo e indici","code":"int main() {\n  int A[4] = {5, 3, 8, 1};\n  int i, max = A[0];\n  for (i = 1; i < 4; i++)\n    if (A[i] > max) max = A[i];\n  printf(\"%d\", max);\n}","codeLang":"c","options":["8","5","1","4"],"ordered":false},{"id":"ps-somma","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":2,"html":"<p class=\"ex-v\">Θ(n).<\/p><p>Il ciclo for fa n iterazioni (n = A.length) e il corpo costa Θ(1): Θ(n · 1) = Θ(n). Le righe 1 e 4 costano Θ(1) e per la regola della somma non contano. (Slide 050 p.31–32, esempio FACT.)<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[31,32]]],"eso":0,"title":"Somma degli elementi","code":"SOMMA(A)\n1. s = 0\n2. for i = 0 to A.length-1\n3.    s = s + A[i]\n4. return s","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-due-occorrenze","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":4,"html":"<p class=\"ex-v\">Θ(n²).<\/p><p>La riga 4 viene eseguita (n−1) + (n−2) + … + 1 = n(n−1)/2 volte = 0,5n² − 0,5n. Il termine dominante è n²: Θ(n²). Il secondo ciclo parte da i+1 e quindi gira meno volte del primo, ma la somma è comunque quadratica. (Slide 050 p.28 e p.33.)<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[28,33]]],"eso":0,"title":"DUE_OCCORRENZE (esempio delle slide)","code":"DUE_OCCORRENZE(A)\n1. output = false\n2. for i = 0 to A.length-2\n3.    for j = i+1 to A.length-1\n4.       if (A[i] == A[j])\n5.          output = true\n6. return output","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-log","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":1,"html":"<p class=\"ex-v\">Θ(log n).<\/p><p>La variabile i vale 1, 2, 4, 8, … : raddoppia ad ogni iterazione, quindi supera n dopo circa log₂ n iterazioni. Ogni iterazione costa Θ(1): Θ(log n). (Se i aumentasse di 1 ad ogni giro sarebbe Θ(n); se raddoppia è logaritmico.)<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[31]]],"eso":0,"title":"Ciclo con raddoppio","code":"CONTA(n)\n1. c = 0\n2. i = 1\n3. while i < n\n4.    c = c + 1\n5.    i = i * 2\n6. return c","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-n-log","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":3,"html":"<p class=\"ex-v\">Θ(n log n).<\/p><p>Il ciclo esterno fa n iterazioni. Il ciclo interno (while) raddoppia j fino a n: Θ(log n) iterazioni, sempre le stesse per ogni i. Iterazioni esterne × costo di ognuna = n · log n: Θ(n log n). (Slide 050 p.31.)<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[31,33]]],"eso":0,"title":"Ciclo for con ciclo while a raddoppio","code":"ESEMPIO(n)\n1. for i = 0 to n-1\n2.    j = 1\n3.    while j < n\n4.       j = j * 2","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-cubo","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":5,"html":"<p class=\"ex-v\">Θ(n³).<\/p><p>Tre cicli annidati, ciascuno con n iterazioni, e corpo Θ(1): n · n · n = Θ(n³).<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[31,33]]],"eso":0,"title":"Tre cicli annidati","code":"TRIPLO(A)\n1. count = 0\n2. for i = 0 to A.length-1\n3.    for j = 0 to A.length-1\n4.       for k = 0 to A.length-1\n5.          count = count + 1\n6. return count","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-in-sequenza","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":2,"html":"<p class=\"ex-v\">Θ(n).<\/p><p>I due cicli NON sono annidati: sono in sequenza. I costi si sommano: Θ(n) + Θ(n) = Θ(n). Si moltiplica solo quando un ciclo è dentro l’altro. (Slide 050 p.29: «sequenza di istruzioni: somma dei tempi».)<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[29]]],"eso":0,"title":"Due cicli uno dopo l’altro","code":"DUE_CICLI(A)\n1. for i = 0 to A.length-1\n2.    A[i] = A[i] + 1\n3. for j = 0 to A.length-1\n4.    A[j] = A[j] * 2","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-inner-costante","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":2,"html":"<p class=\"ex-v\">Θ(n).<\/p><p>Il ciclo interno fa sempre 10 iterazioni, indipendentemente da n: costa Θ(1). Quindi il costo totale è n · Θ(1) = Θ(n). Un ciclo che arriva a una <b>costante<\/b> non è un ciclo «in n».<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[31,33]]],"eso":0,"title":"Ciclo interno con numero fisso di iterazioni","code":"ESEMPIO(A)\n1. for i = 0 to A.length-1\n2.    for j = 0 to 9\n3.       A[i] = A[i] + j","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-ricerca-peggiore","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":2,"html":"<p class=\"ex-v\">Θ(n).<\/p><p>Nel caso peggiore x non c’è (oppure è nell’ultima posizione): il ciclo gira tutte le n volte, quindi Θ(n). Il caso migliore (x in A[0]) costerebbe Θ(1): è per questo che si studia il caso peggiore. (Slide 050 p.10–12.)<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[10,12]]],"eso":0,"title":"Ricerca lineare (caso peggiore)","code":"RICERCA(A, x)\n1. for i = 0 to A.length-1\n2.    if (A[i] == x)\n3.       return i\n4. return -1","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-ricerca-migliore","type":"mc","text":"Qual è la complessità nel caso migliore della seguente procedura?","answer":0,"html":"<p class=\"ex-v\">Θ(1).<\/p><p>Nel caso migliore x si trova subito in A[0]: l’algoritmo esegue un numero costante di operazioni, Θ(1), qualunque sia n. Il caso migliore dà solo un valore teorico ed è poco informativo (slide 050 p.12).<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops","alg-caso"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[10,12]]],"eso":0,"title":"Ricerca lineare (caso migliore)","code":"RICERCA(A, x)\n1. for i = 0 to A.length-1\n2.    if (A[i] == x)\n3.       return i\n4. return -1","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-passo-2","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":2,"html":"<p class=\"ex-v\">Θ(n).<\/p><p>i cresce di 2 ad ogni giro: servono n/2 iterazioni. Le costanti moltiplicative non contano: n/2 ∈ Θ(n). Solo quando i viene <b>moltiplicato<\/b> per una costante (i = i * 2) il ciclo diventa logaritmico.<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[31]]],"eso":0,"title":"Ciclo while con incremento costante","code":"ESEMPIO(n)\n1. i = 0\n2. while i < n\n3.    i = i + 2","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-fact","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":2,"html":"<p class=\"ex-v\">Θ(n).<\/p><p>Numero di iterazioni del for: Θ(n); costo di una singola iterazione: Θ(1); costo totale del ciclo Θ(n · 1) = Θ(n); la procedura costa Θ(n). (Slide 050 p.32.)<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[32]]],"eso":0,"title":"FACT (fattoriale iterativo)","code":"FACT(n)\n1. f = 1\n2. for k = 2 to n\n3.    f = f * k\n4. return f","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-sum-of-fact","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":4,"html":"<p class=\"ex-v\">Θ(n²).<\/p><p>La chiamata FACT(m) costa Θ(m), non Θ(n): bisogna mettere in relazione la dimensione m passata alla funzione con n. Il corpo del ciclo costa Θ(1) + Θ(m) = Θ(m). Il costo totale è 0 + 1 + 2 + … + n = n(n+1)/2 = Θ(n²). (Slide 050 p.34–35.)<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[34,35]]],"eso":0,"title":"SUM_OF_FACT (chiamata a funzione dentro un ciclo)","code":"SUM_OF_FACT(n)\n1. sum = 0\n2. for m = 0 to n\n3.    sum = sum + FACT(m)\n4. return sum\n\nFACT(n)\n1. f = 1\n2. for k = 2 to n\n3.    f = f * k\n4. return f","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-triangolare","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":4,"html":"<p class=\"ex-v\">Θ(n²).<\/p><p>Il ciclo interno fa n−i iterazioni: in tutto n + (n−1) + … + 1 = n(n+1)/2. Metà dei contributi vale almeno n/2: la somma è Θ(n²). Anche se il ciclo interno «parte più avanti», il totale resta quadratico. (Slide 050 p.33.)<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[33]]],"eso":0,"title":"Cicli annidati dipendenti","code":"ESEMPIO(A)\n1. for i = 0 to A.length-1\n2.    for j = i to A.length-1\n3.       A[j] = A[j] + 1","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-quadrato-limite","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":5,"html":"<p class=\"ex-v\">Θ(n³).<\/p><p>Il ciclo interno fa i² iterazioni, quindi in tutto 1² + 2² + … + n² = n(n+1)(2n+1)/6 = Θ(n³). Attenzione: non basta «due cicli = n²»; bisogna sommare le iterazioni effettive del ciclo interno.<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[31,33]]],"eso":0,"title":"Il limite del ciclo interno dipende da i²","code":"ESEMPIO(n)\n1. for i = 1 to n\n2.    for j = 1 to i*i\n3.       count = count + 1","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-n-log-dip","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":3,"html":"<p class=\"ex-v\">Θ(n log n).<\/p><p>Per ogni i il while fa circa log₂ i iterazioni. In tutto Σ log₂ i per i = 1…n = log₂(n!) = Θ(n log n). (È la stessa crescita di «n iterazioni × log n»: il termine log i è ≤ log n e per metà dei valori di i è almeno log n − 1.)<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[31,33]]],"eso":0,"title":"Ciclo interno a raddoppio con limite i","code":"ESEMPIO(n)\n1. for i = 1 to n\n2.    j = 1\n3.    while j <= i\n4.       j = j * 2","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-selection-conf","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":4,"html":"<p class=\"ex-v\">Θ(n²).<\/p><p>I cicli non dipendono dai valori di A: la riga 4 viene eseguita (n−1) + (n−2) + … + 1 = n(n−1)/2 volte in <b>ogni<\/b> caso. Quindi caso migliore, medio e peggiore coincidono: Θ(n²). (Slide 060 p.9–10.)<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops","alg-sort"],"prof":false,"freq":0,"slides":[["060-ordinamento",[9,10]]],"eso":0,"title":"SELECTION_SORT: conteggio dei confronti","code":"SELECTION_SORT(A)\n1. for i = 0 to A.length-2\n2.   min = i\n3.   for j = i + 1 to A.length-1\n4.      if A[j] < A[min]\n5.        min = j\n6.   temp = A[i]\n7.   A[i] = A[min]\n8.   A[min] = temp","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-insertion-peggiore","type":"mc","text":"Qual è la complessità nel caso peggiore della seguente procedura?","answer":4,"html":"<p class=\"ex-v\">Θ(n²).<\/p><p>Nel caso peggiore (array ordinato in modo <b>decrescente<\/b>) ogni elemento key va spostato fino al primo posto: il while fa j iterazioni, in tutto 1 + 2 + … + (n−1) = n(n−1)/2 = Θ(n²). (Slide 060 p.19.)<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops","alg-sort"],"prof":false,"freq":0,"slides":[["060-ordinamento",[19]]],"eso":0,"title":"INSERTION_SORT con input decrescente","code":"INSERTION_SORT(A)\n1. for j = 1 to A.length-1\n2.      key = A[j]\n3.      i = j-1\n4.      while i>-1 and A[i]>key\n5.           A[i+1] = A[i]\n6.           i = i-1\n7.      A[i+1] = key","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ps-insertion-migliore","type":"mc","text":"Qual è la complessità nel caso migliore della seguente procedura?","answer":2,"html":"<p class=\"ex-v\">Θ(n).<\/p><p>Se A è già ordinato in modo non decrescente la condizione A[i] > key è subito falsa: il while non esegue nessuna iterazione. Resta il ciclo for esterno, con corpo Θ(1): Θ(n). (Slide 060 p.20.)<\/p><p class=\"ex-r\"><b>Metodo<\/b>: conta quante volte viene eseguita la riga più “profonda”. Cicli annidati → si moltiplicano le iterazioni; cicli in sequenza → si sommano; una variabile che si raddoppia → logaritmo; un ciclo che va fino a una costante → Θ(1).<\/p>","topics":["alg-loops","alg-sort","alg-caso"],"prof":false,"freq":0,"slides":[["060-ordinamento",[20]]],"eso":0,"title":"INSERTION_SORT con input già ordinato","code":"INSERTION_SORT(A)\n1. for j = 1 to A.length-1\n2.      key = A[j]\n3.      i = j-1\n4.      while i>-1 and A[i]>key\n5.           A[i+1] = A[i]\n6.           i = i-1\n7.      A[i+1] = key","codeLang":"pseudo","options":["Θ(1)","Θ(log n)","Θ(n)","Θ(n log n)","Θ(n²)","Θ(n³)"],"ordered":true},{"id":"ds-pila-seq","type":"mc","text":"Una pila inizialmente vuota subisce la sequenza: PUSH(5), PUSH(8), POP, PUSH(2), PUSH(7), POP, POP. Quali valori restituiscono, nell’ordine, le tre POP?","answer":0,"html":"<p class=\"ex-v\">8, 7, 2<\/p><p>Pila = LIFO: la POP restituisce l’ultimo elemento inserito ancora presente. Passo passo: [5] → [5,8] → POP=8 → [5] → [5,2] → [5,2,7] → POP=7 → [5,2] → POP=2. (Con una coda FIFO si otterrebbe invece 5, 8, 2.)<\/p>","topics":["ds-pila"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[16,21,23]]],"eso":0,"options":["8, 7, 2","5, 8, 2","8, 2, 7","5, 2, 7"],"ordered":false},{"id":"ds-coda-seq","type":"mc","text":"Una coda inizialmente vuota subisce la sequenza: ENQUEUE(5), ENQUEUE(8), DEQUEUE, ENQUEUE(2), ENQUEUE(7), DEQUEUE, DEQUEUE. Quali valori restituiscono, nell’ordine, le tre DEQUEUE?","answer":0,"html":"<p class=\"ex-v\">5, 8, 2<\/p><p>Coda = FIFO: la DEQUEUE restituisce l’elemento più VECCHIO. [5] → [5,8] → DEQUEUE=5 → [8] → [8,2] → [8,2,7] → DEQUEUE=8 → [2,7] → DEQUEUE=2. (Con una pila LIFO si otterrebbe invece 8, 7, 2.)<\/p>","topics":["ds-coda"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[35,37]]],"eso":0,"options":["5, 8, 2","8, 7, 2","5, 2, 7","8, 5, 2"],"ordered":false},{"id":"ds-pila-contenuto","type":"mc","text":"Una pila inizialmente vuota subisce: PUSH(3), PUSH(1), PUSH(4), POP, PUSH(9), POP, PUSH(6). Qual è il contenuto finale della pila (dal fondo all’elemento affiorante) e quanto vale SIZE?","answer":0,"html":"<p class=\"ex-v\">[3, 1, 6], SIZE = 3<\/p><p>Le due POP tolgono 4 e poi 9 (ogni volta l’ultimo inserito). Restano 3, 1 e infine 6 sopra: fondo → cima = 3, 1, 6. Con la realizzazione ad array: p.top = 2, SIZE = p.top + 1 = 3.<\/p>","topics":["ds-pila"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[21,23,24]]],"eso":0,"options":["[3, 1, 6], SIZE = 3","[3, 1, 4, 9, 6], SIZE = 5","[3, 1, 4], SIZE = 3","[6, 1, 3], SIZE = 3"],"ordered":false},{"id":"ds-coda-circolare","type":"mc","text":"Una coda è realizzata con array circolare di 6 celle (c.head = c.tail = 0 all’inizio, funzioni ENQUEUE e DEQUEUE delle slide). Si eseguono 5 ENQUEUE, poi 3 DEQUEUE, poi 3 ENQUEUE. Quanto valgono c.head e c.tail?","answer":0,"html":"<p class=\"ex-v\">c.head = 3, c.tail = 2<\/p><p>Dopo 5 ENQUEUE: head = 0, tail = 5. Dopo 3 DEQUEUE: head = 3. Le 3 ENQUEUE successive scrivono nelle celle 5, 0, 1 e tail, arrivato all’ultima cella, torna a 0 e poi avanza: tail = 2. Gli indici non superano mai 5 perché l’array è circolare.<\/p>","topics":["ds-coda"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[39,40,42]]],"eso":0,"options":["c.head = 3, c.tail = 2","c.head = 3, c.tail = 8","c.head = 0, c.tail = 2","c.head = 2, c.tail = 3"],"ordered":false},{"id":"ds-coda-capacita","type":"mc","text":"Una coda circolare è realizzata con array di 4 celle (head = tail = 0). Si eseguono 4 ENQUEUE consecutivi su coda vuota. Che cosa succede?","answer":0,"html":"<p class=\"ex-v\">Il quarto ENQUEUE segnala overflow: la coda contiene al massimo 3 elementi<\/p><p>Se la coda contenesse 4 elementi (tutte le celle), c.tail tornerebbe uguale a c.head e non si distinguerebbe più dalla coda vuota. Perciò con n celle la coda può contenere al massimo n−1 elementi.<\/p>","topics":["ds-coda"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[41,42]]],"eso":0,"options":["Il quarto ENQUEUE segnala overflow: la coda contiene al massimo 3 elementi","Tutti e quattro vanno a buon fine","Il primo ENQUEUE segnala overflow","Il quarto ENQUEUE sovrascrive il primo elemento"],"ordered":false},{"id":"ds-ammort-costo9","type":"mc","text":"Una pila “telescopica” parte con un array di 4 celle e raddoppia l’array (copiando gli elementi) quando è piena (PUSH delle slide). Quanto costa, in operazioni elementari (copie + inserimento), la 9ª PUSH?","answer":0,"html":"<p class=\"ex-v\">9<\/p><p>Le prime 4 PUSH costano 1 ciascuna. La 5ª trova l’array pieno: copia 4 elementi e inserisce (4+1 = 5). Le PUSH 6, 7, 8 costano 1. La 9ª trova l’array (da 8) pieno: copia 8 elementi e inserisce (8+1 = 9). I costi alti sono rari e distanziati sempre di più.<\/p>","topics":["ds-ammort","ds-pila"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[27,28,29,30]]],"eso":0,"options":["9","1","8","16"],"ordered":false},{"id":"ds-ammort-totale","type":"mc","text":"Nella stessa pila telescopica (array iniziale di 4 celle, costo = copie + inserimento), quanto costano in totale le prime 16 PUSH?","answer":0,"html":"<p class=\"ex-v\">28<\/p><p>Costi: 4×1 (PUSH 1–4) + 5 (5ª) + 3×1 (6–8) + 9 (9ª) + 7×1 (10–16) = 28. Cioè meno di 2 operazioni per PUSH: una sequenza di n inserimenti costa Θ(n), quindi il costo ammortizzato di una PUSH è Θ(1), anche se una singola PUSH può costare Θ(n).<\/p>","topics":["ds-ammort","ds-pila"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[31,32,33]]],"eso":0,"options":["28","16","32","64"],"ordered":false},{"id":"ds-ammort-classe","type":"mc","text":"Qual è il costo ammortizzato di una PUSH sulla pila con raddoppio dell’array?","answer":0,"html":"<p class=\"ex-v\">Θ(1)<\/p><p>Il raddoppio avviene di rado: n inserimenti costano in totale Θ(n), quindi in media Θ(1) ciascuno. Il costo del caso peggiore di una SINGOLA push resta Θ(n).<\/p>","topics":["ds-ammort"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[33]]],"eso":0,"options":["Θ(1)","Θ(n)","Θ(log n)","Θ(n²)"],"ordered":false},{"id":"ds-lista-array-visita","type":"mc","text":"Lista realizzata con tre array (l.next, l.info, l.prev) come nelle slide, creata con NEW_LIST(5). Si eseguono INSERT(l,7), INSERT(l,9), INSERT(l,4) (inserimento in testa). Scorrendo la lista da l.head con l.next, quali valori si incontrano e quanto vale l.head?","answer":0,"html":"<p class=\"ex-v\">4, 9, 7 — l.head = 2<\/p><p>NEW_LIST mette tutte le posizioni nella lista libera (l.free = 0). Ogni INSERT prende la prima posizione libera (0, poi 1, poi 2) e la mette in TESTA: dopo i tre inserimenti l.head = 2 (il valore 4), che punta a 1 (valore 9) che punta a 0 (valore 7). La prossima posizione libera è l.free = 3.<\/p>","topics":["ds-lista-array"],"prof":false,"freq":0,"slides":[["080-liste-tramite-array",[8,9,10,12]]],"eso":0,"options":["4, 9, 7 — l.head = 2","7, 9, 4 — l.head = 0","4, 9, 7 — l.head = 0","7, 9, 4 — l.head = 2"],"ordered":false},{"id":"alg-insertion-trace","type":"mc","text":"Insertion Sort su A = [5, 2, 4, 6, 1, 3]. Qual è il contenuto di A dopo che il ciclo esterno ha elaborato j = 1, j = 2 e j = 3?","answer":0,"html":"<p class=\"ex-v\">[2, 4, 5, 6, 1, 3]<\/p><p>Insertion sort mantiene ordinato il prefisso A[0..j]: j=1 inserisce 2 → [2,5,4,6,1,3]; j=2 inserisce 4 → [2,4,5,6,1,3]; j=3 inserisce 6 (già al posto giusto) → [2,4,5,6,1,3]. La parte a destra non è ancora toccata.<\/p>","topics":["alg-sort"],"prof":false,"freq":0,"slides":[["060-ordinamento",[16,17]]],"eso":0,"options":["[2, 4, 5, 6, 1, 3]","[1, 2, 3, 6, 5, 4]","[2, 4, 6, 5, 1, 3]","[1, 2, 4, 5, 6, 3]"],"ordered":false},{"id":"alg-selection-trace","type":"mc","text":"Selection Sort su A = [5, 2, 4, 6, 1, 3]. Qual è il contenuto di A dopo 3 iterazioni del ciclo esterno (i = 0, 1, 2)?","answer":0,"html":"<p class=\"ex-v\">[1, 2, 3, 6, 5, 4]<\/p><p>Ad ogni iterazione si trova il minimo in A[i..n−1] e lo si SCAMBIA con A[i]: i=0: minimo 1 → [1,2,4,6,5,3]; i=1: minimo 2 già al posto → invariato; i=2: minimo 3 scambiato con 4 → [1,2,3,6,5,4]. Dopo k iterazioni i primi k elementi sono definitivi, il resto no.<\/p>","topics":["alg-sort"],"prof":false,"freq":0,"slides":[["060-ordinamento",[7,8]]],"eso":0,"options":["[1, 2, 3, 6, 5, 4]","[2, 4, 5, 6, 1, 3]","[1, 2, 3, 4, 5, 6]","[1, 2, 4, 6, 5, 3]"],"ordered":false},{"id":"alg-selection-conf","type":"mc","text":"Con un array di n = 10 elementi, quante volte viene eseguita la riga “if A[j] < A[min]” del SELECTION_SORT?","answer":0,"html":"<p class=\"ex-v\">45<\/p><p>Il ciclo interno fa (n−1) + (n−2) + … + 1 = n(n−1)/2 confronti: 9+8+…+1 = 45, qualunque sia il contenuto dell’array. È l’origine di Θ(n²).<\/p>","topics":["alg-sort","alg-loops"],"prof":false,"freq":0,"slides":[["060-ordinamento",[9,10]]],"eso":0,"options":["45","100","90","10"],"ordered":false},{"id":"alg-insertion-confronti","type":"mc","text":"Insertion Sort su un array di 10 elementi GIÀ ORDINATO (caso migliore): quante volte viene valutato il confronto A[i] > key?","answer":0,"html":"<p class=\"ex-v\">9<\/p><p>Per ogni j da 1 a 9 il confronto è valutato una sola volta (subito falso): 9 confronti = n−1, cioè Θ(n). Nel caso peggiore (array decrescente) sarebbero invece 45 = n(n−1)/2.<\/p>","topics":["alg-sort","alg-caso"],"prof":false,"freq":0,"slides":[["060-ordinamento",[19,20]]],"eso":0,"options":["9","45","10","1"],"ordered":false},{"id":"m-alg-corretto","type":"mc","text":"Quando un algoritmo si dice corretto per un problema computazionale?","answer":0,"html":"<p class=\"ex-v\">Quando per ogni istanza termina e produce un output corretto<\/p><p>Definizione delle slide: l’algoritmo è corretto se, per OGNI istanza, (1) termina e (2) produce un output y corretto, cioè tale che tra input x e output y valga la relazione specificata dal problema.<\/p>","topics":["alg-def"],"prof":false,"freq":0,"slides":[["020-definizioni-di-base",[14]]],"eso":0,"options":["Quando per ogni istanza termina e produce un output corretto","Quando ha complessità polinomiale","Quando usa meno memoria possibile","Quando funziona su almeno un’istanza di ogni dimensione"],"ordered":false},{"id":"m-ram-costo","type":"mc","text":"Nel modello Random Access Machine (RAM), qual è il costo di ogni operazione elementare (trasferimento, somma, moltiplicazione…)?","answer":0,"html":"<p class=\"ex-v\">Unitario (costante)<\/p><p>Nella RAM ogni operazione ha costo unitario. È per questo che per stimare T(n) basta contare quante volte si eseguono le righe di pseudocodice, ciascuna di costo Θ(1).<\/p>","topics":["alg-def"],"prof":false,"freq":0,"slides":[["020-definizioni-di-base",[16]],["050-complessita-algoritmi",[20]]],"eso":0,"options":["Unitario (costante)","Proporzionale alla dimensione dei numeri coinvolti","Proporzionale a n","Dipende dall’hardware utilizzato"],"ordered":false},{"id":"m-perche-peggiore","type":"mc","text":"Perché in generale si studia il tempo di calcolo nel caso peggiore?","answer":0,"html":"<p class=\"ex-v\">Perché dà una garanzia valida per qualunque input: si preferisce un errore per eccesso a uno per difetto<\/p><p>Il caso migliore non dà nessuna garanzia e ha interesse solo teorico; il caso peggiore è un limite superiore valido per ogni input. (Spesso il caso medio è più vicino al peggiore che al migliore.)<\/p>","topics":["alg-caso"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[10,12]]],"eso":0,"options":["Perché dà una garanzia valida per qualunque input: si preferisce un errore per eccesso a uno per difetto","Perché è il caso che si verifica più spesso","Perché è il più facile da calcolare in tutti gli algoritmi","Perché coincide sempre con il caso medio"],"ordered":false},{"id":"m-if-costo","type":"mc","text":"Per un if-then-else, come si ottiene un limite superiore O-grande al tempo di esecuzione senza sapere se la condizione è vera?","answer":0,"html":"<p class=\"ex-v\">Costo della condizione + il costo MAGGIORE tra parte-then e parte-else<\/p><p>Per il limite superiore (O) si considera il ramo più costoso; per il limite inferiore (Ω) si considererebbe il ramo meno costoso.<\/p>","topics":["alg-loops"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[30]]],"eso":0,"options":["Costo della condizione + il costo MAGGIORE tra parte-then e parte-else","Costo della condizione + il costo MINORE tra parte-then e parte-else","Somma dei costi di then ed else","Prodotto dei costi di then ed else"],"ordered":false},{"id":"m-greedy","type":"mc","text":"Quale tecnica algoritmica sta alla base del Selection Sort?","answer":0,"html":"<p class=\"ex-v\">Greedy: a ogni passo si sceglie il minimo tra gli elementi rimasti<\/p><p>Selection sort = greedy (scelta localmente ottima: il minimo). Insertion sort = incrementale. Exhaustive sort = tecnica esaustiva (brute-force).<\/p>","topics":["alg-sort"],"prof":false,"freq":0,"slides":[["060-ordinamento",[6,14,24]]],"eso":0,"options":["Greedy: a ogni passo si sceglie il minimo tra gli elementi rimasti","Incrementale: si inserisce un elemento alla volta in una sequenza già ordinata","Esaustiva: si generano tutte le permutazioni","Divide et impera"],"ordered":false},{"id":"m-exhaustive","type":"mc","text":"Qual è la complessità nel caso peggiore dell’EXHAUSTIVE_SORT (genera tutte le permutazioni e verifica se sono ordinate)?","answer":0,"html":"<p class=\"ex-v\">Θ(n × n!)<\/p><p>Nel caso peggiore si generano tutte le n! permutazioni e per ognuna IS_ORDERED costa Θ(n): Θ(n × n!). Nel caso migliore (array già ordinato) invece Θ(n).<\/p>","topics":["alg-sort"],"prof":false,"freq":0,"slides":[["060-ordinamento",[27,28,31,33]]],"eso":0,"options":["Θ(n × n!)","Θ(n²)","Θ(n!)","Θ(2ⁿ)"],"ordered":false},{"id":"m-adt-comp","type":"mc","text":"Da che cosa è costituito un tipo astratto di dato (ADT)?","answer":0,"html":"<p class=\"ex-v\">Domini, costanti e una collezione di operazioni<\/p><p>Un ADT è una descrizione indipendente dalla realizzazione: i domini interessati (di interesse e di supporto), un insieme di costanti e le operazioni. La realizzazione (array, puntatori…) è un’altra cosa, e uno stesso ADT può averne diverse.<\/p>","topics":["ds-adt"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[4,8]]],"eso":0,"options":["Domini, costanti e una collezione di operazioni","Da un array e da un puntatore","Dal codice C che lo implementa","Da una lista di funzioni con la loro complessità"],"ordered":false},{"id":"m-lifo","type":"mc","text":"Quale coppia di strategie realizzano, rispettivamente, pila e coda?","answer":0,"html":"<p class=\"ex-v\">Pila: LIFO — Coda: FIFO<\/p><p>Pila (stack) = last-in first-out: esce l’ultimo inserito. Coda (queue) = first-in first-out: esce il più vecchio.<\/p>","topics":["ds-pila","ds-coda"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[16,35]]],"eso":0,"options":["Pila: LIFO — Coda: FIFO","Pila: FIFO — Coda: LIFO","Entrambe LIFO","Entrambe FIFO"],"ordered":false},{"id":"m-pila-top-vuota","type":"mc","text":"Nella realizzazione della pila con array delle slide (p.A e p.top), quanto vale p.top quando la pila è vuota e come si calcola SIZE(p)?","answer":0,"html":"<p class=\"ex-v\">p.top = −1 e SIZE(p) = p.top + 1<\/p><p>p.top è l’indice dell’elemento affiorante: con la pila vuota non c’è nessun elemento e vale −1. Con p.top = 3 ci sono 4 elementi (indici 0…3): SIZE = p.top + 1.<\/p>","topics":["ds-pila"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[20,24]]],"eso":0,"options":["p.top = −1 e SIZE(p) = p.top + 1","p.top = 0 e SIZE(p) = p.top","p.top = −1 e SIZE(p) = p.top","p.top = 0 e SIZE(p) = p.top − 1"],"ordered":false},{"id":"m-lista-doppia","type":"mc","text":"Quale realizzazione delle liste consente di scorrere la lista in modo efficiente sia in avanti sia all’indietro?","answer":0,"html":"<p class=\"ex-v\">Lista doppiamente concatenata<\/p><p>In una lista doppiamente concatenata NEXT e PREV sono entrambe Θ(1). La lista semplicemente concatenata consente lo scorrimento in avanti ma non, in modo efficiente, all’indietro.<\/p>","topics":["ds-lista"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[11,12,13]]],"eso":0,"options":["Lista doppiamente concatenata","Lista semplicemente concatenata","Nessuna: è impossibile","Solo l’array senza puntatori"],"ordered":false},{"id":"m-c-stack-heap","type":"mc","text":"Dove vengono allocate le celle di un array dichiarato come “int a[5];” dentro una funzione, e dove quelle create con calloc?","answer":0,"html":"<p class=\"ex-v\">a[5] nello stack, calloc nello heap<\/p><p>La dichiarazione statica alloca le celle direttamente sullo stack (numero di celle non modificabile). calloc/malloc allocano nello heap, e permettono di scegliere (e cambiare con realloc) la dimensione a tempo di esecuzione.<\/p>","topics":["c-array","c-malloc"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[21,22,23]]],"eso":0,"options":["a[5] nello stack, calloc nello heap","Entrambe nello heap","Entrambe nello stack","a[5] nello heap, calloc nello stack"],"ordered":false},{"id":"m-c-null","type":"mc","text":"Che cos’è NULL in C?","answer":0,"html":"<p class=\"ex-v\">Un valore convenzionale (0) per un puntatore che non contiene alcun indirizzo significativo<\/p><p>NULL vale 0, che non è un indirizzo legittimo per l’utente: è il valore convenzionale per «questo puntatore non punta a niente». Dereferenziare NULL provoca un errore (segmentation fault).<\/p>","topics":["c-puntatori"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[7,8]]],"eso":0,"options":["Un valore convenzionale (0) per un puntatore che non contiene alcun indirizzo significativo","Un intero che indica la fine di una stringa","L’indirizzo del primo elemento di un array","Il valore di una variabile non inizializzata"],"ordered":false},{"id":"m-c-senza-senso","type":"mc","text":"Quale di queste espressioni NON ha senso in C (a e b sono due variabili intere)?","answer":0,"html":"<p class=\"ex-v\">&(a+b)<\/p><p>L’operatore & si applica a una variabile (che ha un indirizzo): a+b è solo un valore, non ha un left-value, quindi non se ne può prendere l’indirizzo.<\/p>","topics":["c-puntatori"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[10]]],"eso":0,"options":["&(a+b)","&a","*(&a)","&b"],"ordered":false},{"id":"m-c-testa-lista","type":"mc","text":"Perché una funzione che può rimuovere il PRIMO elemento di una lista riceve plist* (puntatore alla testa) invece di plist?","answer":0,"html":"<p class=\"ex-v\">Perché la testa della lista può cambiare e il chiamante deve vedere il nuovo valore della sua variabile<\/p><p>Il passaggio è sempre per valore: con plist la funzione modifica una copia della testa e il chiamante continuerebbe a puntare all’elemento già liberato. Con plist* (puntatore al puntatore) si scrive *p = (*p)->next e si cambia la variabile del chiamante.<\/p>","topics":["c-rimozione","c-liste","c-puntatori"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[13,14]]],"eso":0,"options":["Perché la testa della lista può cambiare e il chiamante deve vedere il nuovo valore della sua variabile","Perché plist è un tipo troppo grande per essere copiato","Perché con plist non si può leggere il campo info","Perché così non serve chiamare free"],"ordered":false},{"id":"m-c-rimozione-mezzo","type":"mc","text":"In una lista doppiamente concatenata, per rimuovere un elemento e che sta in mezzo (con e->prev e e->next entrambi diversi da NULL) quali assegnazioni servono prima di free(e)?","answer":0,"html":"<p class=\"ex-v\">e->prev->next = e->next;  e->next->prev = e->prev;<\/p><p>Bisogna «scavalcare» e: il precedente deve puntare al successivo (prev->next = next) e il successivo deve puntare al precedente (next->prev = prev). Se e è il primo (prev == NULL) cambia la testa; se è l’ultimo (next == NULL) non esiste next->prev: vanno gestiti a parte.<\/p>","topics":["c-rimozione","c-liste"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[13]]],"eso":0,"options":["e->prev->next = e->next;  e->next->prev = e->prev;","e->next = e->prev;  e->prev = e->next;","e->prev->next = e;  e->next->prev = e;","e = NULL;"],"ordered":false},{"id":"m-c-leak","type":"mc","text":"Se togli un elemento da una lista allocata con malloc ma dimentichi di chiamare free su quell’elemento, che cosa succede?","answer":0,"html":"<p class=\"ex-v\">Perdita di memoria (memory leak): il blocco resta allocato ma irraggiungibile<\/p><p>C non ha un garbage collector: la memoria allocata con malloc/calloc va liberata a mano con free. Il programma può funzionare lo stesso, ma spreca memoria (nei test del prof è richiesto di deallocare).<\/p>","topics":["c-rimozione","c-malloc"],"prof":false,"freq":0,"slides":[],"eso":0,"options":["Perdita di memoria (memory leak): il blocco resta allocato ma irraggiungibile","Errore di compilazione","Il programma va sempre in segmentation fault","Il sistema libera automaticamente la memoria"],"ordered":false},{"id":"m-c-uso-dopo-free","type":"mc","text":"Cosa vuol dire usare un puntatore dopo aver chiamato free sul blocco che puntava?","answer":0,"html":"<p class=\"ex-v\">Comportamento indefinito: il blocco non è più tuo (dangling pointer)<\/p><p>Dopo free(p) la memoria è restituita al sistema. Leggere o scrivere *p è un errore (uso dopo free): può sembrare funzionare o fare danni. Per questo si legge e si salva e->next PRIMA di fare free(e).<\/p>","topics":["c-rimozione","c-malloc"],"prof":false,"freq":0,"slides":[],"eso":0,"options":["Comportamento indefinito: il blocco non è più tuo (dangling pointer)","È sicuro finché non si chiama malloc","Restituisce sempre 0","Il compilatore lo impedisce"],"ordered":false},{"id":"v-ram-illimitata","type":"vf","text":"Nel modello RAM i valori in input, output e memoria sono supposti illimitati.","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>Sì: è una delle caratteristiche (e limitazioni) della RAM indicate nelle slide. Per questo il modello può essere irragionevole, per esempio per FACT(n), dove f cresce moltissimo.<\/p>","topics":["alg-def"],"prof":false,"freq":0,"slides":[["020-definizioni-di-base",[16]],["050-complessita-algoritmi",[37,39]]],"eso":0},{"id":"v-theta1-sempre-meglio","type":"vf","text":"Un algoritmo Θ(1) è sempre più veloce in pratica di un algoritmo Θ(n).","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p>L’analisi asintotica trascura le costanti e descrive il comportamento per n grande. Un algoritmo Θ(1) con costante enorme (le slide fanno l’esempio di 10.000 anni) può essere peggiore di uno Θ(n) per input piccoli.<\/p>","topics":["alg-caso","asy-ct"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[42,43]]],"eso":0},{"id":"v-input-piccoli","type":"vf","text":"Se sappiamo che n è limitato da una costante, un algoritmo asintoticamente inefficiente può essere comunque accettabile.","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>Se n ≤ costante, il tempo totale è comunque limitato da una costante (le slide 050 p.42).<\/p>","topics":["alg-caso"],"prof":false,"freq":0,"slides":[["050-complessita-algoritmi",[42]]],"eso":0},{"id":"v-selection-theta-sempre","type":"vf","text":"Il Selection Sort ha complessità Θ(n²) anche se l’array in input è già ordinato.","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>I valori dell’input non cambiano il numero di iterazioni dei due cicli: la riga 4 viene eseguita n(n−1)/2 volte in ogni caso. Caso migliore, medio e peggiore coincidono.<\/p>","topics":["alg-sort"],"prof":false,"freq":0,"slides":[["060-ordinamento",[9,10]]],"eso":0},{"id":"v-insertion-migliore","type":"vf","text":"L’Insertion Sort su un array già ordinato ha complessità Θ(n).","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>Se A è già ordinato il while non esegue nessuna iterazione: restano le n−1 iterazioni del for, ciascuna Θ(1).<\/p>","topics":["alg-sort"],"prof":false,"freq":0,"slides":[["060-ordinamento",[20]]],"eso":0},{"id":"v-exhaustive-migliore","type":"vf","text":"L’EXHAUSTIVE_SORT nel caso migliore ha complessità Θ(n).","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>Nel caso migliore la prima permutazione generata è già ordinata: bastano n+1 chiamate ricorsive e una verifica IS_ORDERED di costo Θ(n): (n+1) + Θ(n) = Θ(n).<\/p>","topics":["alg-sort"],"prof":false,"freq":0,"slides":[["060-ordinamento",[31]]],"eso":0},{"id":"v-stabile","type":"vf","text":"Selection Sort e Insertion Sort (nelle versioni delle slide) sono entrambi algoritmi di ordinamento stabili.","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>Un algoritmo è stabile se non cambia l’ordine reciproco degli elementi con lo stesso valore. Le slide indicano «stabile: sì» per tutti e tre gli algoritmi visti (tabella a p.33).<\/p>","topics":["alg-sort"],"prof":false,"freq":0,"slides":[["060-ordinamento",[12,22,33]]],"eso":0},{"id":"v-pila-theta1","type":"vf","text":"Nella pila realizzata con array di dimensione fissa, tutte le operazioni (NEW_STACK, IS_EMPTY, PUSH, POP, TOP, SIZE, EMPTY) hanno complessità Θ(1).","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>Ogni operazione modifica solo p.top o legge/scrive una cella: tempo costante (slide p.24).<\/p>","topics":["ds-pila"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[22,23,24]]],"eso":0},{"id":"v-pila-overflow","type":"vf","text":"Una PUSH su una pila di dimensione fissa già piena produce un errore di «overflow», e una POP su pila vuota un errore di «underflow».","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>PUSH controlla p.top == p.A.length − 1 (overflow); POP controlla p.top == −1 (underflow). La gestione «telescopica» elimina l’overflow raddoppiando l’array.<\/p>","topics":["ds-pila"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[18,23]]],"eso":0},{"id":"v-ammortizzata","type":"vf","text":"Con la gestione telescopica (raddoppio dell’array), una singola PUSH può costare Θ(n) nel caso peggiore, ma il costo ammortizzato di una PUSH è Θ(1).","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>Il raddoppio costa Θ(n) (copia di n elementi) ma accade raramente: una sequenza di n inserimenti costa in totale Θ(n), quindi in media Θ(1) ciascuno.<\/p>","topics":["ds-ammort"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[26,33]]],"eso":0},{"id":"v-coda-n","type":"vf","text":"Una coda realizzata con array circolare di n celle (head/tail come nelle slide) può contenere fino a n elementi.","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p>Al massimo n−1: se contenesse n elementi, c.tail raggiungerebbe c.head e la coda piena sarebbe indistinguibile dalla coda vuota (head == tail).<\/p>","topics":["ds-coda"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[41]]],"eso":0},{"id":"v-lista-singola-prev","type":"vf","text":"In una lista semplicemente concatenata lo scorrimento in avanti è efficiente, ma non lo è lo scorrimento all’indietro.","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>Ogni elemento conosce solo il successivo: per trovare il precedente bisogna ripartire dalla testa (Θ(n)). Con la doppia concatenazione PREV è Θ(1).<\/p>","topics":["ds-lista"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[11,12,13]]],"eso":0},{"id":"v-lista-array-vuota","type":"vf","text":"In una lista realizzata con array (l.next, l.info, l.prev), quando la lista è vuota tutte le posizioni appartengono alla lista libera l.free.","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>NEW_LIST collega tutte le posizioni nella lista l.free (l.free = 0, l.head = −1). Un inserimento sposta una posizione dalla lista libera alla lista l; una cancellazione fa il contrario.<\/p>","topics":["ds-lista-array"],"prof":false,"freq":0,"slides":[["080-liste-tramite-array",[7,8,9]]],"eso":0},{"id":"v-adt-realizzazioni","type":"vf","text":"Uno stesso tipo astratto di dato può avere diverse realizzazioni, con efficienza diversa per le diverse operazioni.","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>Per esempio la lista può essere realizzata con array o con oggetti e puntatori, semplicemente o doppiamente concatenata: cambiano memoria usata e costo delle operazioni.<\/p>","topics":["ds-adt"],"prof":false,"freq":0,"slides":[["070-tipi-astratti-di-dato",[8,9,15]]],"eso":0},{"id":"v-array-modificabile","type":"vf","text":"Dopo “int a[5];” è lecito scrivere “a = a + 1;” per far puntare a alla seconda cella.","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p>Con l’allocazione statica né il numero delle celle né il valore di a possono essere modificati. Per spostarsi si usa un puntatore separato: int* b = a; b = b + 1;<\/p>","topics":["c-array"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[21]]],"eso":0},{"id":"v-accesso-costante","type":"vf","text":"Accedere a a[9999] richiede più tempo che accedere ad a[0].","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p>a[i] è *(a+i): un’addizione e un accesso alla memoria. Il tempo è costante (Θ(1)) qualunque sia l’indice.<\/p>","topics":["c-array"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[19,20]]],"eso":0},{"id":"v-puntatori-alias","type":"vf","text":"Se p e q contengono lo stesso indirizzo di un intero, l’istruzione *p = 5; cambia anche il valore di *q.","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>p e q sono due «nomi» della stessa cella: leggere o scrivere attraverso uno dei due si vede dall’altro.<\/p>","topics":["c-puntatori"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[4,11]]],"eso":0},{"id":"v-null-segv","type":"vf","text":"Leggere o scrivere attraverso un puntatore NULL (per esempio *p con p == NULL) è un errore che normalmente fa terminare il programma (segmentation fault).","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>NULL non è un indirizzo utilizzabile. Nelle funzioni sulle liste serve sempre controllare p != NULL prima di scrivere p->info o p->next.<\/p>","topics":["c-puntatori","c-casi-limite"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[7]]],"eso":0},{"id":"v-param-valore","type":"vf","text":"In C il passaggio di parametri a una funzione avviene sempre per valore.","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p>Anche quando si passa &x la funzione riceve per valore una copia dell’indirizzo: scrivendo nella cella puntata modifica la variabile originale, ma il puntatore in sé è una copia.<\/p>","topics":["c-puntatori","c-passaggio"],"prof":false,"freq":0,"slides":[["c020-array-e-puntatori",[13,14]]],"eso":0}],"exercises":[{"id":"a-tutti-positivi","title":"Tutti gli elementi maggiori di zero","group":"array","kind":"A_out","statement":"Scrivi la funzione in linguaggio C void test(int* A, int len, int* out) che accetta in input un array di interi A, la sua lunghezza \"len\" e un puntatore ad intero \"out\", il cui valore non è noto a priori. La funzione assegna all'intero puntato da \"out\" il valore 1 (true) se tutti gli elementi dell'array hanno un valore maggiore di zero. Altrimenti la funzione assegna all'intero puntato da \"out\" il valore 0 (false).","fn":"void test(int* A, int len, int* out)","starter":"/* Scrivi la funzione in linguaggio C void test(int* A, int len, int* out)\n   che accetta in input un array di interi A, la sua lunghezza \"len\" e un\n   puntatore ad intero \"out\", il cui valore non è noto a priori. La\n   funzione assegna all'intero puntato da \"out\" il valore 1 (true) se tutti\n   gli elementi dell'array hanno un valore maggiore di zero. Altrimenti la\n   funzione assegna all'intero puntato da \"out\" il valore 0 (false). */\n\nvoid test(int* A, int len, int* out){\n\n\n\n\n\n\n}\n","solution":"void test(int* A, int len, int* out){\n  int i;\n  *out = 1;                 /* all'inizio assumo che siano tutti > 0 */\n  for (i = 0; i < len; i++) {\n    if (A[i] <= 0) {        /* trovato un controesempio */\n      *out = 0;\n      return;\n    }\n  }\n}","solutionFull":"void test(int* A, int len, int* out){\n  int i;\n  *out = 1;                 /* all'inizio assumo che siano tutti > 0 */\n  for (i = 0; i < len; i++) {\n    if (A[i] <= 0) {        /* trovato un controesempio */\n      *out = 0;\n      return;\n    }\n  }\n}","explain":"È un \"per ogni\": parti da vero (1) e appena trovi UN elemento che viola la condizione (A[i] <= 0) metti 0 e puoi fermarti. Il valore va scritto con *out = ... (non out = ...), perché out è un puntatore.","hints":["Parti dal presupposto che la risposta sia 1 e cerca un controesempio.","Scrivi sempre *out = ... (con l'asterisco): out è l'indirizzo di una variabile del chiamante.","Non scrivere il risultato dentro il ciclo ad ogni iterazione: conta solo se ESISTE un elemento <= 0."],"pitfalls":["Controllare solo A[0] o solo l'ultimo elemento","Scrivere out = 1 invece di *out = 1","Usare < 0 invece di <= 0 (lo zero non è maggiore di zero)"],"topics":["c-puntatori","c-array"],"prof":true,"eso":1,"prelude":"","tests":[{"n":1,"code":"int A[] = {2, 0, 1};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["prof","zero in mezzo"]},{"n":2,"code":"int A[] = {1, 2, 3};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["tipico vero"]},{"n":3,"code":"int A[] = {5};\nint result = -1;\ntest(A, 1, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["un elemento"]},{"n":4,"code":"int A[] = {1, -1, 1};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != -1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["negativo in mezzo"]},{"n":5,"code":"int A[] = {3, 4, -5};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != -5 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["negativo in fondo"]},{"n":6,"code":"int A[] = {0};\nint result = -1;\ntest(A, 1, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["zero"]},{"n":7,"code":"int A[] = {-2, 7, 7};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != -2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 7 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 7 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["negativo all'inizio"]},{"n":8,"code":"int A[] = {10, 20, 30, 0};\nint result = -1;\ntest(A, 4, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 10 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 20 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 30 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["zero in fondo"]},{"n":9,"code":"int A[1] = {0};   /* array vuoto: len = 0 */\nint result = -1;\ntest(A, 0, &result);\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["array vuoto"]}]},{"id":"a-elemento-maggiore-somma","title":"Un elemento maggiore della somma degli altri","group":"array","kind":"A_out","statement":"Scrivi la funzione in linguaggio C void test(int* A, int len, int* out) che accetta in input un array di interi A, la sua lunghezza \"len\" e un puntatore ad intero \"out\", il cui valore non è noto a priori. La funzione assegna all'intero puntato da \"out\" il valore 1 (true) se esiste un elemento nell'array il cui valore è maggiore della somma degli altri elementi dell'array. Altrimenti la funzione assegna all'intero puntato da \"out\" il valore 0 (false). Se l'array è vuoto la funzione assegna all'intero puntato da \"out\" il valore 1.","fn":"void test(int* A, int len, int* out)","starter":"/* Scrivi la funzione in linguaggio C void test(int* A, int len, int* out)\n   che accetta in input un array di interi A, la sua lunghezza \"len\" e un\n   puntatore ad intero \"out\", il cui valore non è noto a priori. La\n   funzione assegna all'intero puntato da \"out\" il valore 1 (true) se\n   esiste un elemento nell'array il cui valore è maggiore della somma degli\n   altri elementi dell'array. Altrimenti la funzione assegna all'intero\n   puntato da \"out\" il valore 0 (false). Se l'array è vuoto la funzione\n   assegna all'intero puntato da \"out\" il valore 1. */\n\nvoid test(int* A, int len, int* out){\n\n\n\n\n\n\n}\n","solution":"void test(int* A, int len, int* out){\n  int i, somma = 0;\n  if (len == 0) {           /* caso particolare richiesto dal testo */\n    *out = 1;\n    return;\n  }\n  for (i = 0; i < len; i++)\n    somma = somma + A[i];   /* somma di TUTTI gli elementi */\n  *out = 0;\n  for (i = 0; i < len; i++) {\n    /* somma degli altri = somma totale - A[i] */\n    if (A[i] > somma - A[i]) {\n      *out = 1;\n      return;\n    }\n  }\n}","solutionFull":"void test(int* A, int len, int* out){\n  int i, somma = 0;\n  if (len == 0) {           /* caso particolare richiesto dal testo */\n    *out = 1;\n    return;\n  }\n  for (i = 0; i < len; i++)\n    somma = somma + A[i];   /* somma di TUTTI gli elementi */\n  *out = 0;\n  for (i = 0; i < len; i++) {\n    /* somma degli altri = somma totale - A[i] */\n    if (A[i] > somma - A[i]) {\n      *out = 1;\n      return;\n    }\n  }\n}","explain":"Calcola prima la somma totale S. La somma \"degli altri\" rispetto ad A[i] è S - A[i], quindi non serve un secondo ciclo annidato: A[i] è speciale se A[i] > S - A[i]. Ricorda il caso array vuoto, che il testo vuole a 1.","hints":["Calcola la somma totale una volta sola.","La somma degli altri elementi è somma - A[i].","Gestisci a parte len == 0: il testo vuole *out = 1."],"pitfalls":["Usare >= invece di > (se è uguale all
