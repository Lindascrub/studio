"/><line class=\"fig-guide\" x1=\"315.14285714285717\" y1=\"48\" x2=\"315.14285714285717\" y2=\"112\"/><line class=\"fig-guide\" x1=\"315.14285714285717\" y1=\"48\" x2=\"315.14285714285717\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"34\" y=\"66\">O(n³)<\/text><rect class=\"fig-bar fig-y\" x=\"34\" y=\"72\" width=\"351.42857142857144\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"34\" cy=\"78\" r=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"385.42857142857144\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"86\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"385.42857142857144\" y1=\"86\" x2=\"385.42857142857144\" y2=\"112\"/><g class=\"fig-mark good\"><circle cx=\"315.14285714285717\" cy=\"78\" r=\"9\"/><text x=\"315.14285714285717\" y=\"82\" text-anchor=\"middle\">✓<\/text><\/g><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-esiste","asy-theta"],"prof":true,"freq":2,"slides":[["040-notazione-asintotica",[11,24,40,42,44,45,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q36","Q108"]},{"id":"vf-q037","type":"vf","text":"L'insieme degli algoritmi che hanno complessità Θ(n) contiene l'insieme degli algoritmi che hanno complessità O(n)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">O(n) = gli algoritmi che crescono al più come n. Θ(n) = gli algoritmi che crescono esattamente come n.<\/p><p>«Θ(n) contiene O(n)» significa O(n) ⊆ Θ(n). Θ richiede limite superiore <b>e<\/b> inferiore, O dà solo il superiore. Controesempio: T(n) = 1 (costante) sta in O(n) ma <b>non<\/b> in Θ(n).<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. O(n) copre le crescite da 1 (incluso) a n (incluso). Θ(n) copre le crescite da n (incluso) a n (incluso).\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. O(n) copre le crescite da 1 (incluso) a n (incluso). Θ(n) copre le crescite da n (incluso) a n (incluso).<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"34\" y=\"28\">O(n)<\/text><rect class=\"fig-bar fig-x\" x=\"34\" y=\"34\" width=\"140.57142857142858\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-x\" cx=\"34\" cy=\"40\" r=\"6\"/><circle class=\"fig-end in fig-x\" cx=\"174.57142857142858\" cy=\"40\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"48\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"48\" x2=\"174.57142857142858\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"174.57142857142858\" y=\"66\">Θ(n)<\/text><rect class=\"fig-bar fig-y\" x=\"174.57142857142858\" y=\"72\" width=\"2\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"174.57142857142858\" cy=\"78\" r=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"174.57142857142858\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"86\" x2=\"174.57142857142858\" y2=\"112\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"86\" x2=\"174.57142857142858\" y2=\"112\"/><g class=\"fig-mark bad\"><circle cx=\"34\" cy=\"40\" r=\"9\"/><text x=\"34\" y=\"44\" text-anchor=\"middle\">✕<\/text><\/g><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-insiemi","asy-theta"],"prof":true,"freq":2,"slides":[["040-notazione-asintotica",[11,24,40,42,44,45,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q37","esonero"]},{"id":"vf-q038","type":"vf","text":"Un algoritmo che appartiene ad O(1) appartiene sempre anche ad Ω(1)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">O(1) = gli algoritmi che crescono al più come 1. Ω(1) = gli algoritmi che crescono almeno come 1.<\/p><p>Ogni algoritmo esegue almeno un’operazione, cioè T(n) ≥ 1: quindi sta sempre in Ω(1) (qualunque costante). Ecco perché da O(…) si arriva sempre a Ω(1).<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. O(1) copre le crescite da 1 (incluso) a 1 (incluso). Ω(1) copre le crescite da 1 (incluso) a infinito.\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. O(1) copre le crescite da 1 (incluso) a 1 (incluso). Ω(1) copre le crescite da 1 (incluso) a infinito.<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"34\" y=\"28\">O(1)<\/text><rect class=\"fig-bar fig-x\" x=\"34\" y=\"34\" width=\"2\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-x\" cx=\"34\" cy=\"40\" r=\"6\"/><circle class=\"fig-end in fig-x\" cx=\"34\" cy=\"40\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"48\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"34\" y1=\"48\" x2=\"34\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"34\" y=\"66\">Ω(1)<\/text><rect class=\"fig-bar fig-y\" x=\"34\" y=\"72\" width=\"516\" height=\"12\" rx=\"6\"/><path class=\"fig-y\" d=\"M548 69 L558 78 L548 87 Z\"/><circle class=\"fig-end in fig-y\" cx=\"34\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"86\" x2=\"34\" y2=\"112\"/><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Pavimento<\/b>: ogni algoritmo esegue almeno un’operazione, quindi T(n) ≥ 1 e <u>ogni<\/u> algoritmo sta in Ω(1) (e in Ω(5), Ω(100)… sono la stessa classe).<\/p>","topics":["asy-ol","asy-ct"],"prof":true,"freq":2,"slides":[["040-notazione-asintotica",[11,24,33,35,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q38","Q82"]},{"id":"vf-q039","type":"vf","text":"Un algoritmo che appartiene a o(n²) appartiene sempre anche ad O(n)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">o(n²) = gli algoritmi che crescono strettamente meno di n². O(n) = gli algoritmi che crescono al più come n.<\/p><p>o(n²) contiene funzioni che crescono quasi come n², più di n. Controesempio: T(n) = n log n sta in o(n²) ma non in O(n).<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. o(n²) copre le crescite da 1 (incluso) a n² (escluso). O(n) copre le crescite da 1 (incluso) a n (incluso).\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. o(n²) copre le crescite da 1 (incluso) a n² (escluso). O(n) copre le crescite da 1 (incluso) a n (incluso).<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"34\" y=\"28\">o(n²)<\/text><rect class=\"fig-bar fig-x\" x=\"34\" y=\"34\" width=\"281.14285714285717\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-x\" cx=\"34\" cy=\"40\" r=\"6\"/><circle class=\"fig-end out fig-xs\" cx=\"315.14285714285717\" cy=\"40\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"48\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"315.14285714285717\" y1=\"48\" x2=\"315.14285714285717\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"34\" y=\"66\">O(n)<\/text><rect class=\"fig-bar fig-y\" x=\"34\" y=\"72\" width=\"140.57142857142858\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"34\" cy=\"78\" r=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"174.57142857142858\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"86\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"86\" x2=\"174.57142857142858\" y2=\"112\"/><g class=\"fig-mark bad\"><circle cx=\"244.8571428571429\" cy=\"40\" r=\"9\"/><text x=\"244.8571428571429\" y=\"44\" text-anchor=\"middle\">✕<\/text><\/g><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-o"],"prof":true,"freq":2,"slides":[["040-notazione-asintotica",[11,24,46,47,49]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q39","Q101"]},{"id":"vf-q040","type":"vf","text":"Un algoritmo che appartiene a Ω(n) appartiene sempre anche ad o(n²)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">Ω(n) = gli algoritmi che crescono almeno come n. o(n²) = gli algoritmi che crescono strettamente meno di n².<\/p><p>Ω non pone un tetto alla crescita. Controesempio: T(n) = n² sta in Ω(n) ma non in o(n²).<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Ω(n) copre le crescite da n (incluso) a infinito. o(n²) copre le crescite da 1 (incluso) a n² (escluso).\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. Ω(n) copre le crescite da n (incluso) a infinito. o(n²) copre le crescite da 1 (incluso) a n² (escluso).<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"174.57142857142858\" y=\"28\">Ω(n)<\/text><rect class=\"fig-bar fig-x\" x=\"174.57142857142858\" y=\"34\" width=\"375.42857142857144\" height=\"12\" rx=\"6\"/><path class=\"fig-x\" d=\"M548 31 L558 40 L548 49 Z\"/><circle class=\"fig-end in fig-x\" cx=\"174.57142857142858\" cy=\"40\" r=\"6\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"48\" x2=\"174.57142857142858\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"34\" y=\"66\">o(n²)<\/text><rect class=\"fig-bar fig-y\" x=\"34\" y=\"72\" width=\"281.14285714285717\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"34\" cy=\"78\" r=\"6\"/><circle class=\"fig-end out fig-ys\" cx=\"315.14285714285717\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"86\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"315.14285714285717\" y1=\"86\" x2=\"315.14285714285717\" y2=\"112\"/><g class=\"fig-mark bad\"><circle cx=\"315.14285714285717\" cy=\"40\" r=\"9\"/><text x=\"315.14285714285717\" y=\"44\" text-anchor=\"middle\">✕<\/text><\/g><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-o"],"prof":true,"freq":2,"slides":[["040-notazione-asintotica",[33,35,46,47,49]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q40","esonero"]},{"id":"vf-q043","type":"vf","text":"Un algoritmo che, nel caso peggiore, esegue n² operazioni ha complessità O(2n)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">T(n) = n²<\/p><p>Per la regola della somma conta solo il termine che cresce di più (slide 040 p.23–27): il termine dominante di n² è <b>n²<\/b>, quindi T(n) ∈ Θ(n²). T ∈ O(n) ⇔ n² cresce al più come n: no.<\/p><p class=\"ex-r\"><b>Termine dominante<\/b>: in una somma/differenza di potenze vince l’esponente più alto; i coefficienti e i termini più piccoli sono irrilevanti (n³ − n² ∈ Θ(n³), non Θ(n²)).<\/p><div class=\"ex-ambig\"><b>⚠ Lettura ambigua.<\/b> Nel testo copiato «2n» può significare 2·n (fattore costante, la lettura usata qui) oppure 2ⁿ. se invece nel tuo quiz era 2ⁿ (esponenziale): n² cresce meno di 2ⁿ, quindi n² ∈ O(2ⁿ) e la risposta sarebbe <b>Vero<\/b>.<\/div>","topics":["asy-ct"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[23,26,27]]],"eso":1,"src":["Q43"],"ambig":true,"alt":{"answer":true,"why":"se invece nel tuo quiz era 2ⁿ (esponenziale): n² cresce meno di 2ⁿ, quindi n² ∈ O(2ⁿ) e la risposta sarebbe <b>Vero<\/b>."}},{"id":"vf-q044","type":"vf","text":"Esistono algoritmi che non appartengono ad Ω(1)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">Ogni algoritmo esegue almeno un’operazione: T(n) ≥ 1.<\/p><p>Ω(1) è la stessa classe di Ω(1) (una costante è una costante): ogni algoritmo esegue almeno un’operazione, quindi T(n) ≥ 1 ∈ Ω(1). Non esistono algoritmi fuori da Ω(1).<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Ω(1) copre le crescite da 1 (incluso) a infinito. Ω(1) copre le crescite da 1 (incluso) a infinito.\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. Ω(1) copre le crescite da 1 (incluso) a infinito. Ω(1) copre le crescite da 1 (incluso) a infinito.<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"34\" y=\"28\">Ω(1)<\/text><rect class=\"fig-bar fig-x\" x=\"34\" y=\"34\" width=\"516\" height=\"12\" rx=\"6\"/><path class=\"fig-x\" d=\"M548 31 L558 40 L548 49 Z\"/><circle class=\"fig-end in fig-x\" cx=\"34\" cy=\"40\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"48\" x2=\"34\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"34\" y=\"66\">Ω(1)<\/text><rect class=\"fig-bar fig-y\" x=\"34\" y=\"72\" width=\"516\" height=\"12\" rx=\"6\"/><path class=\"fig-y\" d=\"M548 69 L558 78 L548 87 Z\"/><circle class=\"fig-end in fig-y\" cx=\"34\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"86\" x2=\"34\" y2=\"112\"/><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Pavimento<\/b>: ogni algoritmo esegue almeno un’operazione, quindi T(n) ≥ 1 e <u>ogni<\/u> algoritmo sta in Ω(1) (e in Ω(5), Ω(100)… sono la stessa classe).<\/p>","topics":["asy-ct"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[33]],["050-complessita-algoritmi",[16,17]]],"eso":1,"src":["Q44"]},{"id":"vf-q046","type":"vf","text":"Un algoritmo che, nel caso peggiore, esegue un numero di operazioni Θ(n) non può appartenere ad O(n²)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">Θ(n) = gli algoritmi che crescono esattamente come n. O(n²) = gli algoritmi che crescono al più come n².<\/p><p>Può, eccome. Sì, esistono: per esempio un algoritmo con T(n) = n sta <b>sia<\/b> in Θ(n) <b>sia<\/b> in O(n²). Nella figura i due intervalli si <b>sovrappongono<\/b>.<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Θ(n) copre le crescite da n (incluso) a n (incluso). O(n²) copre le crescite da 1 (incluso) a n² (incluso).\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. Θ(n) copre le crescite da n (incluso) a n (incluso). O(n²) copre le crescite da 1 (incluso) a n² (incluso).<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7 ritmo che, nel caso peggiore, ha complessità Θ(n²) non può contemporaneamente avere complessità O(n)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">Θ(n²) = gli algoritmi che crescono esattamente come n². O(n) = gli algoritmi che crescono al più come n.<\/p><p>Infatti non può. Un algoritmo in Θ(n²) cresce <b>esattamente<\/b> come n², che cresce più di n: non può rispettare il tetto O(n).<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Θ(n²) copre le crescite da n² (incluso) a n² (incluso). O(n) copre le crescite da 1 (incluso) a n (incluso).\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. Θ(n²) copre le crescite da n² (incluso) a n² (incluso). O(n) copre le crescite da 1 (incluso) a n (incluso).<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text> li algoritmi che crescono al più come n². Ω(n²) = gli algoritmi che crescono almeno come n².<\/p><p>Può, eccome. Sì, esistono: per esempio un algoritmo con T(n) = n² sta <b>sia<\/b> in O(n²) <b>sia<\/b> in Ω(n²). Nella figura i due intervalli si <b>sovrappongono<\/b>.<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. O(n²) copre le crescite da 1 (incluso) a n² (incluso). Ω(n²) copre le crescite da n² (incluso) a infinito.\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. O(n²) copre le crescite da 1 (incluso) a n² (incluso). Ω(n²) copre le crescite da n² (incluso) a infinito.<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y x-h\">Insertion-Sort: nel caso peggiore Θ(n²).<\/p><p>Caso peggiore (input decrescente): Θ(n²). Caso migliore (già ordinato): Θ(n). Quindi la complessità del caso peggiore è Θ(n²) e la domanda è se Θ(n²) ⊆ o(n²): no. Attenzione: o(g) significa «strettamente più lento di g»: una funzione Θ(g) <b>non<\/b> è mai in o(g).<\/p><p class=\"ex-r\"><b>Da sapere a memoria<\/b>: Selection Θ(n²) sempre · Insertion Θ(n²) peggiore, Θ(n) migliore · Merge Θ(n log n) sempre · Exhaustive Θ(n·n!).<\/p>","topics":["alg-sort","asy-def"],"prof":true,"freq":2,"slides":[["060-ordinamento",[9,10,19,20,33]],["050-complessita-algoritmi",[13,16,18]]],"eso":1,"src":["Q57","Q67"]},{"id":"vf-q059","type":"vf","text":"L'algoritmo di ordinamento Merge-Sort nel caso peggiore ha complessità o(n log n)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">Merge-Sort: nel caso peggiore Θ(n log n).<\/p><p>Θ(n log n) in tutti i casi (non è nelle slide 060: va saputo a memoria). Quindi la complessità del caso peggiore è Θ(n log n) e la domanda è se Θ(n log n) ⊆ o(n log n): no. Attenzione: o(g) significa «strettamente più lento di g»: una funzione Θ(g) <b>non<\/b> è mai in o(g).<\/p><p class=\"ex-r\"><b>Da sapere a memoria<\/b>: Selection Θ(n²) sempre · Insertion Θ(n²) peggiore, Θ(n) migliore · Merge Θ(n log n) sempre · Exhaustive Θ(n·n!).<\/p>","topics":["alg-sort","asy-def"],"prof":true,"freq":1,"slides":[["060-ordinamento",[9,10,19,20,33]],["050-complessita-algoritmi",[13,16,18]]],"eso":1,"src":["Q59"]},{"id":"vf-q064","type":"vf","text":"Un algoritmo che appartiene ad Ω(n²) non può appartenere ad O(n)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">Ω(n²) = gli algoritmi che crescono almeno come n². O(n) = gli algoritmi che crescono al più come n.<\/p><p>Infatti non può. Per stare in Ω(n²) deve crescere <b>almeno<\/b> come n², per stare in O(n) <b>al più<\/b> come n. Ma n² cresce <b>più<\/b> di n: i due requisiti sono incompatibili, gli intervalli non si toccano.<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Ω(n²) copre le crescite da n² (incluso) a infinito. O(n) copre le crescite da 1 (incluso) a n (incluso).\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. Ω(n²) copre le crescite da n² (incluso) a infinito. O(n) copre le crescite da 1 (incluso) a n (incluso).<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"315.14285714285717\" y=\"28\">Ω(n²)<\/text><rect class=\"fig-bar fig-x\" x=\"315.14285714285717\" y=\"34\" width=\"234.85714285714283\" height=\"12\" rx=\"6\"/><path class=\"fig-x\" d=\"M548 31 L558 40 L548 49 Z\"/><circle class=\"fig-end in fig-x\" cx=\"315.14285714285717\" cy=\"40\" r=\"6\"/><line class=\"fig-guide\" x1=\"315.14285714285717\" y1=\"48\" x2=\"315.14285714285717\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"34\" y=\"66\">O(n)<\/text><rect class=\"fig-bar fig-y\" x=\"34\" y=\"72\" width=\"140.57142857142858\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"34\" cy=\"78\" r=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"174.57142857142858\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"86\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"86\" x2=\"174.57142857142858\" y2=\"112\"/><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-esiste","asy-ol"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[11,24,33,35,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q64"]},{"id":"vf-q065","type":"vf","text":"Tutti gli algoritmi che, nel caso peggiore, hanno complessità Θ(n²) hanno contemporaneamente anche complessità Ω(n)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">Θ(n²) = gli algoritmi che crescono esattamente come n². Ω(n) = gli algoritmi che crescono almeno come n.<\/p><p>Θ(n²) = O(n²) ∩ Ω(n²) ⊆ Ω(n²), e Ω(n²) ⊆ Ω(n) perché n² cresce almeno come n. (Gerarchia delle classi, slide 040 p.46–47.)<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Θ(n²) copre le crescite da n² (incluso) a ass=\"fig-guide\" x1=\"174.57142857142858\" y1=\"48\" x2=\"174.57142857142858\" y2=\"112\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"48\" x2=\"174.57142857142858\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"174.57142857142858\" y=\"66\">Ω(n)<\/text><rect class=\"fig-bar fig-y\" x=\"174.57142857142858\" y=\"72\" width=\"375.42857142857144\" height=\"12\" rx=\"6\"/><path class=\"fig-y\" d=\"M548 69 L558 78 L548 87 Z\"/><circle class=\"fig-end in fig-y\" cx=\"174.57142857142858\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"86\" x2=\"174.57142857142858\" y2=\"112\"/><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-insiemi","asy-theta"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[33,35,40,42,44,45,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q66"]},{"id":"vf-q099","type":"vf","text":"L'insieme degli algoritmi che hanno complessità Θ(n) è contenuto nell'insieme degli algoritmi che hanno complessità O(n)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">Θ(n) = gli algoritmi che crescono esattamente come n. O(n) = gli algoritmi che crescono al più come n.<\/p><p>Θ(n) = O(n) ∩ Ω(n) ⊆ O(n), e O(n) ⊆ O(n) perché n cresce al più come n. (Gerarchia delle classi, slide 040 p.46–47.)<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Θ(n) copre le crescite da n (incluso) a n (incluso). O(n) copre le crescite da 1 (incluso) a n (incluso).\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. Θ(n) copre le crescite da n (incluso) a n (incluso). O(n) 12\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"48\" x2=\"174.57142857142858\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"34\" y=\"66\">O(n)<\/text><rect class=\"fig-bar fig-y\" x=\"34\" y=\"72\" width=\"140.57142857142858\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"34\" cy=\"78\" r=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"174.57142857142858\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"86\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"86\" x2=\"174.57142857142858\" y2=\"112\"/><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-insiemi","asy-theta"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[11,24,40,42,44,45,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q99"]},{"id":"vf-q069","type":"vf","text":"Un algoritmo che appartiene ad O(n) appartiene sempre anche ad o(n²)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">O(n) = gli algoritmi che crescono al più come n. o(n²) = gli algoritmi che crescono strettamente meno di n².<\/p><p>T cresce al più come n, e n cresce <b>strettamente<\/b> meno di n²: T/n² → 0, cioè T ∈ o(n²).<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. O(n) copre le crescite da 1 (incluso) a n (incluso). o(n²) copre le crescite da 1 (incluso) a n² (escluso).\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. O(n) copre le crescite da 1 (incluso) a n (incluso). o(n²) copre le crescite da 1 (incluso) a n² (escluso).<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"34\" y=\"28\">O(n)<\/text><rect class=\"fig-bar fig-x\" x=\"34\" y=\"34\" width=\"140.57142857142858\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-x\" cx=\"34\" cy=\"40\" r=\"6\"/><circle class=\"fig-end in fig-x\" cx=\"174.57142857142858\" cy=\"40\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"48\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"48\" x2=\"174.57142857142858\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"34\" y=\"66\">o(n²)<\/text><rect class=\"fig-bar fig-y\" x=\"34\" y=\"72\" width=\"281.14285714285717\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"34\" cy=\"78\" r=\"6\"/><circle class=\"fig-end out fig-ys\" cx=\"315.14285714285717\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"86\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"315.14285714285717\" y1=\"86\" x2=\"315.14285714285717\" y2=\"112\"/><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-o"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[11,24,46,47,49]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q69"]},{"id":"vf-q075","type":"vf","text":"Un algoritmo che, nel caso peggiore, esegue un numero di operazioni n² + n³ appartiene ad O(n²)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">T(n) = n² + n³<\/p><p>Per la regola della somma conta solo il termine che cresce di più (slide 040 p.23–27): il termine dominante di n² + n³ è <b>n³<\/b>, quindi T(n) ∈ Θ(n³). T ∈ O(n²) ⇔ n³ cresce al più come n²: no.<\/p><p class=\"ex-r\"><b>Termine dominante<\/b>: in una somma/differenza di potenze vince l’esponente più alto; i coefficienti e i termini più piccoli sono irrilevanti (n³ − n² ∈ Θ(n³), non Θ(n²)).<\/p>","topics":["asy-ct"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[23,26,27]]],"eso":1,"src":["Q75"]},{"id":"vf-q076","type":"vf","text":"Un algoritmo che, nel caso peggiore, esegue un numero di operazioni n² + n³ appartiene ad Ω(n³)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">T(n) = n² + n³<\/p><p>Per la regola della somma conta solo il termine che cresce di più (slide 040 p.23–27): il termine dominante di n² + n³ è <b>n³<\/b>, quindi T(n) ∈ Θ(n³). T ∈ Ω(n³) ⇔ n³ cresce almeno come n³: sì.<\/p><p class=\"ex-r\"><b>Termine dominante<\/b>: in una somma/differenza di potenze vince l’esponente più alto; i coefficienti e i termini più piccoli sono irrilevanti (n³ − n² ∈ Θ(n³), non Θ(n²)).<\/p>","topics":["asy-ct"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[23,26,27]]],"eso":1,"src":["Q76"]},{"id":"vf-q078","type":"vf","text":"Un algoritmo che, nel caso peggiore, ha complessità O(n⁴) non può contemporaneamente avere complessità Θ(n²)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">O(n⁴) = gli algoritmi che crescono al più come n⁴. Θ(n²) = gli algoritmi che crescono esattamente come n².<\/p><p>Può, eccome. Sì, esistono: per esempio un algoritmo con T(n) = n² sta <b>sia<\/b> in O(n⁴) <b>sia<\/b> in Θ(n²). Nella figura i due intervalli si <b>sovrappongono<\/b>.<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. O(n⁴) copre le crescite da 1 (incluso) a n⁴ (incluso). Θ(n²) copre le crescite da n² (incluso) a n² (incluso).\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. O(n⁴) copre le crescite da 1 (incluso) a n⁴ (incluso). Θ(n²) copre le crescite da n² (incluso) a n² (incluso).<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"95.5\" y1=\"108\" x2=\"95.5\" y2=\"116\"/><text class=\"fig-lbl\" x=\"95.5\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"157\" y1=\"108\" x2=\"157\" y2=\"116\"/><text class=\"fig-lbl\" x=\"157\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"218.5\" y1=\"108\" x2=\"218.5\" y2=\"116\"/><text class=\"fig-lbl\" x=\"218.5\" y=\"131\" text-anchor=\ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-esiste","asy-theta"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[11,24,40,42,44,45,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q78"]},{"id":"vf-q079","type":"vf","text":"Un algoritmo non può avere contemporaneamente complessità Θ(n²) e O(n³)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">Θ(n²) = gli algoritmi che crescono esattamente come n². O(n³) = gli algoritmi che crescono al più come n³.<\/p><p>Può, eccome. Sì, esistono: per esempio un algoritmo con T(n) = n² sta <b>sia<\/b> in Θ(n²) <b>sia<\/b> in O(n³). Nella figura i due intervalli si <b>sovrappongono<\/b>.<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Θ(n²) copre le crescite da n² (incluso) a n² (incluso). O(n³) copre le crescite da 1 (incluso) a n³ (incluso).\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. Θ(n²) copre le crescite da n² (incluso) a n² (incluso). O(n³) copre le crescite da 1 (incluso) a n³ (incluso).<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"315.14285714285717\" y=\"28\">Θ(n²)<\/text><rect class=\"fig-bar fig-x\" x=\"315.14285714285717\" y=\"34\" width=\"2\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-x\" cx=\"315.14285714285717\" cy=\"40\" r=\"6\"/><circle class=\"fig-end in fig-x\" cx=\"315.14285714285717\" cy=\"40\" r=\"6\"/><line class=\"fig-guide\" x1=\"315.14285714285717\" y1=\"48\" x2=\"315.14285714285717\" y2=\"112\"/><line class=\"fig-guide\" x1=\"315.14285714285717\" y1=\"48\" x2=\"315.14285714285717\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"34\" y=\"66\">O(n³)<\/text><rect class=\"fig-bar fig-y\" x=\"34\" y=\"72\" width=\"351.42857142857144\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"34\" cy=\"78\" r=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"385.42857142857144\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"86\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"385.42857142857144\" y1=\"86\" x2=\"385.42857142857144\" y2=\"112\"/><g class=\"fig-mark good\"><circle cx=\"315.14285714285717\" cy=\"78\" r=\"9\"/><text x=\"315.14285714285717\" y=\"82\" text-anchor=\"middle\">✓<\/text><\/g><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-esiste","asy-theta"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[11,24,40,42,44,45,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q79"]},{"id":"vf-q081","type":"vf","text":"L'algoritmo di ordinamento Selection-Sort nel caso peggiore ha complessità Ω(n)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">Selection-Sort: nel caso peggiore Θ(n²).<\/p><p>Θ(n²) in tutti i casi: i cicli non dipendono dai valori. Quindi la complessità del caso peggiore è Θ(n²) e la domanda è se Θ(n²) ⊆ Ω(n): sì (n² cresce almeno come n).<\/p><p class=\"ex-r\"><b>Da sapere a memoria<\/b>: Selection Θ(n²) sempre · Insertion Θ(n²) peggiore, Θ(n) migliore · Merge Θ(n log n) sempre · Exhaustive Θ(n·n!).<\/p>","topics":["alg-sort","asy-def"],"prof":true,"freq":2,"slides":[["060-ordinamento",[9,10,19,20,33]],["050-complessita-algoritmi",[13,16,18]]],"eso":1,"src":["Q81","Q122"]},{"id":"vf-q087","type":"vf","text":"Un algoritmo che appartiene a Θ(n) appartiene sempre anche ad Ω(1)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">Θ(n) = gli algoritmi che crescono esattamente come n. Ω(1) = gli algoritmi che crescono almeno come 1.<\/p><p>Θ(n) = O(n) ∩ Ω(n) ⊆ Ω(n), e Ω(n) ⊆ Ω(1) perché n cresce almeno come 1. (Gerarchia delle classi, slide 040 p.46–47.)<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Θ(n) copre le crescite da n (incluso) a n (incluso). Ω(1) copre le crescite da 1 (incluso) a infinito.\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. Θ(n) copre le crescite da n (incluso) a n (incluso). Ω(1) copre le crescite da 1 (incluso) a infinito.<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"174.57142857142858\" y=\"28\">Θ(n)<\/text><rect class=\"fig-bar fig-x\" x=\"174.57142857142858\" y=\"34\" width=\"2\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-x\" cx=\"174.57142857142858\" cy=\"40\" r=\"6\"/><circle class=\"fig-end in fig-x\" cx=\"174.57142857142858\" cy=\"40\" r=\"6\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"48\" x2=\"174.57142857142858\" y2=\"112\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"48\" x2=\"174.57142857142858\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"34\" y=\"66\">Ω(1)<\/text><rect class=\"fig-bar fig-y\" x=\"34\" y=\"72\" width=\"516\" height=\"12\" rx=\"6\"/><path class=\"fig-y\" d=\"M548 69 L558 78 L548 87 Z\"/><circle class=\"fig-end in fig-y\" cx=\"34\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"86\" x2=\"34\" y2=\"112\"/><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Pavimento<\/b>: ogni algoritmo esegue almeno un’operazione, quindi T(n) ≥ 1 e <u>ogni<\/u> algoritmo sta in Ω(1) (e in Ω(5), Ω(100)… sono la stessa classe).<\/p>","topics":["asy-theta","asy-ct"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[33,35,40,42,44,45,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q87"]},{"id":"vf-q089","type":"vf","text":"Un algoritmo che, nel caso peggiore, esegue n² + n³ operazioni appartiene ad O(n⁴)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">T(n) = n² + n³<\/p><p>Per la regola della somma conta solo il termine che cresce di più (slide 040 p.23–27): il termine dominante di n² + n³ è <b>n³<\/b>, quindi T(n) ∈ Θ(n³). T ∈ O(n⁴) ⇔ n³ cresce al più come n⁴: sì.<\/p><p class=\"ex-r\"><b>Termine dominante<\/b>: in una somma/differenza di potenze vince l’esponente più alto; i coefficienti e i termini più piccoli sono irrilevanti (n³ − n² ∈ Θ(n³), non Θ(n²)).<\/p>","topics":["asy-ct"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[23,26,27]]],"eso":1,"src":["Q89"]},{"id":"vf-q092","type":"vf","text":"Un algoritmo che appartiene ad O(n²) appartiene sempre anche ad Ω(n²)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">O(n²) = gli algoritmi che crescono al più come n². Ω(n²) = gli algoritmi che crescono almeno come n².<\/p><p>O è <b>solo<\/b> un limite superiore: dice «non cresce più di n²», non «cresce almeno n²». Controesempio: T(n) = 1 (costante) sta in O(n²) ma <b>non<\/b> in Ω(n²).<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. O(n²) copre le crescite da 1 (incluso) a n² (incluso). Ω(n²) copre le crescite da n² (incluso) a infinito.\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. O(n²) copre le crescite da 1 (incluso) a n² (incluso). Ω(n²) copre le crescite da n² (incluso) a infinito.<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"34\" y=\"28\">O(n²)<\/text><rect class=\"fig-bar fig-x\" x=\"34\" y=\"34\" width=\"281.14285714285717\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-x\" cx=\"34\" cy=\"40\" r=\"6\"/><circle class=\"fig-end in fig-x\" cx=\"315.14285714285717\" cy=\"40\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"48\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"315.14285714285717\" y1=\"48\" x2=\"315.14285714285717\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"315.14285714285717\" y=\"66\">Ω(n²)<\/text><rect class=\"fig-bar fig-y\" x=\"315.14285714285717\" y=\"72\" width=\"234.85714285714283\" height=\"12\" rx=\"6\"/><path class=\"fig-y\" d=\"M548 69 L558 78 L548 87 Z\"/><circle class=\"fig-end in fig-y\" cx=\"315.14285714285717\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"315.14285714285717\" y1=\"86\" x2=\"315.14285714285717\" y2=\"112\"/><g class=\"fig-mark bad\"><circle cx=\"34\" cy=\"40\" r=\"9\"/><text x=\"34\" y=\"44\" text-anchor=\"middle\">✕<\/text><\/g><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-ol"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[11,24,33,35,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q92"]},{"id":"vf-q093","type":"vf","text":"Un algoritmo che appartiene ad Ω(log n) appartiene sempre ad Ω(n)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">Ω(log n) = gli algoritmi che crescono almeno come log n. Ω(n) = gli algoritmi che crescono almeno come n.<\/p><p>log n cresce <b>meno<\/b> di n. Controesempio: T(n) = log n sta in Ω(log n) ma <b>non<\/b> in Ω(n) (non cresce abbastanza).<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Ω(log n) copre le crescite da log n (incluso) a infinito. Ω(n) copre le crescite da n (incluso) a infinito.\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. Ω(log n) copre le crescite da log n (incluso) a infinito. Ω(n) copre le crescite da n (incluso) a infinito.<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"104.28571428571429\" y=\"28\">Ω(log n)<\/text><rect class=\"fig-bar fig-x\" x=\"104.28571428571429\" y=\"34\" width=\"445.7142857142857\" height=\"12\" rx=\"6\"/><path class=\"fig-x\" d=\"M548 31 L558 40 L548 49 Z\"/><circle class=\"fig-end in fig-x\" cx=\"104.28571428571429\" cy=\"40\" r=\"6\"/><line class=\"fig-guide\" x1=\"104.28571428571429\" y1=\"48\" x2=\"104.28571428571429\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"174.57142857142858\" y=\"66\">Ω(n)<\/text><rect class=\"fig-bar fig-y\" x=\"174.57142857142858\" y=\"72\" width=\"375.42857142857144\" height=\"12\" rx=\"6\"/><path class=\"fig-y\" d=\"M548 69 L558 78 L548 87 Z\"/><circle class=\"fig-end in fig-y\" cx=\"174.57142857142858\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"86\" x2=\"174.57142857142858\" y2=\"112\"/><g class=\"fig-mark bad\"><circle cx=\"104.28571428571429\" cy=\"40\" r=\"9\"/><text x=\"104.28571428571429\" y=\"44\" text-anchor=\"middle\">✕<\/text><\/g><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-incl"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[33,35,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q93"]},{"id":"vf-q094","type":"vf","text":"Nessun algoritmo può appartenere ad O(1) perché non potrebbe nemmeno leggere l'input che è grande n","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p>O(1) significa «il numero di operazioni è limitato da una costante, qualunque sia n». Moltissimi algoritmi non hanno bisogno di leggere tutto l’input: restituire A[0], inserire/togliere in cima a una pila implementata con array, leggere A.length… sono tutti O(1). Il tempo di calcolo si misura contando le operazioni <b>eseguite<\/b>, non quanti dati esistono.<\/p><p class=\"ex-r\"><b>Costante ≠ «piccolo input»<\/b>: O(1) non dipende da n, ma questo non vieta all’algoritmo di esistere.<\/p>","topics":["asy-def","asy-ct"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q94"]},{"id":"vf-q095","type":"vf","text":"Nessun algoritmo che ha più di 20 righe può appartenere ad O(20)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p>O(20) è la stessa classe di O(1): le costanti non contano. Inoltre il numero di <b>righe di codice<\/b> non è il numero di operazioni <b>eseguite<\/b>: 30 istruzioni semplici in fila (senza cicli) eseguono al più 30 operazioni, cioè un numero costante, quindi Θ(1). Al contrario, un programma di 3 righe con un ciclo fino a n è Θ(n).<\/p><p class=\"ex-r\"><b>Lunghezza del codice ≠ complessità<\/b>: contano i cicli e le chiamate ripetute, non quante righe ci sono.<\/p>","topics":["asy-def","asy-ct"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q95"]},{"id":"vf-q096","type":"vf","text":"Un algoritmo che appartiene ad Ω(2n) appartiene sempre ad Ω(n)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">Ω(2n) = gli algoritmi che crescono almeno come n. Ω(n) = gli algoritmi che crescono almeno come n.<\/p><p>Sono la stessa classe: Ω(2n) ⊆ Ω(n) (le costanti moltiplicative non contano).<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Ω(2n) copre le crescite da n (incluso) a infinito. Ω(n) copre le crescite da n (incluso) a infinito.\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. Ω(2n) copre le crescite da n (incluso) a infinito. Ω(n) copre le crescite da n (incluso) a infinito.<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"174.57142857142858\" y=\"28\">Ω(2n)<\/text><rect class=\"fig-bar fig-x\" x=\"174.57142857142858\" y=\"34\" width=\"375.42857142857144\" height=\"12\" rx=\"6\"/><path class=\"fig-x\" d=\"M548 31 L558 40 L548 49 Z\"/><circle class=\"fig-end in fig-x\" cx=\"174.57142857142858\" cy=\"40\" r=\"6\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"48\" x2=\"174.57142857142858\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"174.57142857142858\" y=\"66\">Ω(n)<\/text><rect class=\"fig-bar fig-y\" x=\"174.57142857142858\" y=\"72\" width=\"375.42857142857144\" height=\"12\" rx=\"6\"/><path class=\"fig-y\" d=\"M548 69 L558 78 L548 87 Z\"/><circle class=\"fig-end in fig-y\" cx=\"174.57142857142858\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"86\" x2=\"174.57142857142858\" y2=\"112\"/><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Costanti<\/b>: nelle notazioni asintotiche i fattori costanti non contano: Θ(2n) = Θ(n) = Θ(100n).<\/p><div class=\"ex-ambig\"><b>⚠ Lettura ambigua.<\/b> Nel testo copiato «2n» può significare 2·n (fattore costante, la lettura usata qui) oppure 2ⁿ. se nel tuo quiz era 2ⁿ: Ω(2ⁿ) ⊆ Ω(n) perché 2ⁿ cresce più di n: la risposta resta <b>Vero<\/b>.<\/div>","topics":["asy-incl"],"prof":true,"freq":2,"slides":[["040-notazione-asintotica",[33,35,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q96","Q116"],"ambig":true,"alt":{"answer":true,"why":"se nel tuo quiz era 2ⁿ: Ω(2ⁿ) ⊆ Ω(n) perché 2ⁿ cresce più di n: la risposta resta <b>Vero<\/b>."}},{"id":"vf-q097","type":"vf","text":"Potrebbe esistere un algoritmo che appartiene ad Ω(n) e ad O(n³)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">Ω(n) = gli algoritmi che crescono almeno come n. O(n³) = gli algoritmi che crescono al più come n³.<\/p><p>Sì, esistono: per esempio un algoritmo con T(n) = n sta <b>sia<\/b> in Ω(n) <b>sia<\/b> in O(n³). Nella figura i due intervalli si <b>sovrappongono<\/b>.<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Ω(n) copre le crescite da n (incluso) a infinito. O(n³) copre le crescite da 1 (incluso) a n³ (incluso).\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. Ω(n) copre le crescite da n (incluso) a infinito. O(n³) copre le crescite da 1 (incluso) a n³ (incluso).<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.57142857142858\" y=\"131\" text-anchor=\"middle\">n<\/text><line class=\"fig-tick\" x1=\"244.8571428571429\" y1=\"108\" x2=\"244.8571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"244.8571428571429\" y=\"131\" text-anchor=\"middle\">n log n<\/text><line class=\"fig-tick\" x1=\"315.14285714285717\" y1=\"108\" x2=\"315.14285714285717\" y2=\"116\"/><text class=\"fig-lbl\" x=\"315.14285714285717\" y=\"131\" text-anchor=\"middle\">n²<\/text><line class=\"fig-tick\" x1=\"385.42857142857144\" y1=\"108\" x2=\"385.42857142857144\" y2=\"116\"/><text class=\"fig-lbl\" x=\"385.42857142857144\" y=\"131\" text-anchor=\"middle\">n³<\/text><line class=\"fig-tick\" x1=\"455.7142857142858\" y1=\"108\" x2=\"455.7142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"455.7142857142858\" y=\"131\" text-anchor=\"middle\">2ⁿ<\/text><line class=\"fig-tick\" x1=\"526\" y1=\"108\" x2=\"526\" y2=\"116\"/><text class=\"fig-lbl\" x=\"526\" y=\"131\" text-anchor=\"middle\">n!<\/text><text class=\"fig-name fig-xt\" x=\"174.57142857142858\" y=\"28\">Ω(n)<\/text><rect class=\"fig-bar fig-x\" x=\"174.57142857142858\" y=\"34\" width=\"375.42857142857144\" height=\"12\" rx=\"6\"/><path class=\"fig-x\" d=\"M548 31 L558 40 L548 49 Z\"/><circle class=\"fig-end in fig-x\" cx=\"174.57142857142858\" cy=\"40\" r=\"6\"/><line class=\"fig-guide\" x1=\"174.57142857142858\" y1=\"48\" x2=\"174.57142857142858\" y2=\"112\"/><text class=\"fig-name fig-yt\" x=\"34\" y=\"66\">O(n³)<\/text><rect class=\"fig-bar fig-y\" x=\"34\" y=\"72\" width=\"351.42857142857144\" height=\"12\" rx=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"34\" cy=\"78\" r=\"6\"/><circle class=\"fig-end in fig-y\" cx=\"385.42857142857144\" cy=\"78\" r=\"6\"/><line class=\"fig-guide\" x1=\"34\" y1=\"86\" x2=\"34\" y2=\"112\"/><line class=\"fig-guide\" x1=\"385.42857142857144\" y1=\"86\" x2=\"385.42857142857144\" y2=\"112\"/><g class=\"fig-mark good\"><circle cx=\"174.57142857142858\" cy=\"78\" r=\"9\"/><text x=\"174.57142857142858\" y=\"82\" text-anchor=\"middle\">✓<\/text><\/g><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-esiste","asy-ol"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[11,24,33,35,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q97"]},{"id":"vf-q105","type":"vf","text":"L'algoritmo di ordinamento Merge-Sort nel caso peggiore ha complessità o(n²)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">Merge-Sort: nel caso peggiore Θ(n log n).<\/p><p>Θ(n log n) in tutti i casi (non è nelle slide 060: va saputo a memoria). Quindi la complessità del caso peggiore è Θ(n log n) e la domanda è se Θ(n log n) ⊆ o(n²): sì (n log n cresce strettamente meno di n²).<\/p><p class=\"ex-r\"><b>Da sapere a memoria<\/b>: Selection Θ(n²) sempre · Insertion Θ(n²) peggiore, Θ(n) migliore · Merge Θ(n log n) sempre · Exhaustive Θ(n·n!).<\/p>","topics":["alg-sort","asy-def"],"prof":true,"freq":1,"slides":[["060-ordinamento",[9,10,19,20,33]],["050-complessita-algoritmi",[13,16,18]]],"eso":1,"src":["Q105"]},{"id":"vf-q107","type":"vf","text":"Un algoritmo che, nel caso peggiore, esegue n² + n³ operazioni appartiene ad Ω(n²)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">T(n) = n² + n³<\/p><p>Per la regola della somma conta solo il termine che cresce di più (slide 040 p.23–27): il termine dominante di n² + n³ è <b>n³<\/b>, quindi T(n) ∈ Θ(n³). T ∈ Ω(n²) ⇔ n³ cresce almeno come n²: sì.<\/p><p class=\"ex-r\"><b>Termine dominante<\/b>: in una somma/differenza di potenze vince l’esponente più alto; i coefficienti e i termini più piccoli sono irrilevanti (n³ − n² ∈ Θ(n³), non Θ(n²)).<\/p>","topics":["asy-ct"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[23,26,27]]],"eso":1,"src":["Q107"]},{"id":"vf-q110","type":"vf","text":"Possono esistere algoritmi che hanno complessità Ω(n³) e O(n²)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">Ω(n³) = gli algoritmi che crescono almeno come n³. O(n²) = gli algoritmi che crescono al più come n².<\/p><p>Per stare in Ω(n³) deve crescere <b>almeno<\/b> come n³, per stare in O(n²) <b>al più<\/b> come n². Ma n³ cresce <b>più<\/b> di n²: i due requisiti sono incompatibili, gli intervalli non si toccano.<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. Ω(n³) copre le crescite da n³ (incluso) a infinito. O(n²) copre le crescite da 1 (incluso) a n² (incluso).\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. Ω(n³) copre le crescite da n³ (incluso) a infinito. O(n²) copre le crescite da 1 (incluso) a n² (incluso).<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1= n tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-esiste","asy-ol"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[11,24,33,35,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q110"]},{"id":"vf-q112","type":"vf","text":"Un algoritmo che appartiene ad O(n²) potrebbe, dipendentemente dai casi, appartenere anche ad O(n log n)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">O(n²) = gli algoritmi che crescono al più come n². O(n log n) = gli algoritmi che crescono al più come n log n.<\/p><p>Sì, esistono: per esempio un algoritmo con T(n) = 1 (costante) sta <b>sia<\/b> in O(n²) <b>sia<\/b> in O(n log n). Nella figura i due intervalli si <b>sovrappongono<\/b>.<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. O(n²) copre le crescite da 1 (incluso) a n² (incluso). O(n log n) copre le crescite da 1 (incluso) a n log n (incluso).\" xmlns=\"http://www.w3.org/2000/svg\"><title>Scala delle crescite. O(n²) copre le crescite da 1 (incluso) a n² (incluso). O(n log n) copre le crescite da 1 (incluso) a n log n (incluso).<\/title><line class=\"fig-axis\" x1=\"22\" y1=\"112\" x2=\"554\" y2=\"112\"/><line class=\"fig-tick\" x1=\"34\" y1=\"108\" x2=\"34\" y2=\"116\"/><text class=\"fig-lbl\" x=\"34\" y=\"131\" text-anchor=\"middle\">1<\/text><line class=\"fig-tick\" x1=\"104.28571428571429\" y1=\"108\" x2=\"104.28571428571429\" y2=\"116\"/><text class=\"fig-lbl\" x=\"104.28571428571429\" y=\"131\" text-anchor=\"middle\">log n<\/text><line class=\"fig-tick\" x1=\"174.57142857142858\" y1=\"108\" x2=\"174.57142857142858\" y2=\"116\"/><text class=\"fig-lbl\" x=\"174.571 " y=\"82\" text-anchor=\"middle\">✓<\/text><\/g><\/svg><p class=\"figcap\">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.<\/p><\/div><p class=\"ex-r\"><b>Regola d’oro<\/b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni<\/u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno<\/u>.<\/p>","topics":["asy-esiste","asy-incl"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[11,24,46,47]],["050-complessita-algoritmi",[13,15,16,18]]],"eso":1,"src":["Q112"]},{"id":"vf-q115","type":"vf","text":"Un algoritmo che, nel caso peggiore, esegue n operazioni appartiene ad O(n log n)","answer":true,"html":"<p class=\"ex-v\">Vero.<\/p><p class=\"ex-h\">T(n) = n<\/p><p>Per la regola della somma conta solo il termine che cresce di più (slide 040 p.23–27): il termine dominante di n è <b>n<\/b>, quindi T(n) ∈ Θ(n). T ∈ O(n log n) ⇔ n cresce al più come n log n: sì.<\/p><p class=\"ex-r\"><b>Termine dominante<\/b>: in una somma/differenza di potenze vince l’esponente più alto; i coefficienti e i termini più piccoli sono irrilevanti (n³ − n² ∈ Θ(n³), non Θ(n²)).<\/p>","topics":["asy-ct"],"prof":true,"freq":1,"slides":[["040-notazione-asintotica",[23,26,27]]],"eso":1,"src":["Q115"]},{"id":"vf-q117","type":"vf","text":"Un algoritmo che appartiene ad O(2n) appartiene sempre ad Ω(n)","answer":false,"html":"<p class=\"ex-v\">Falso.<\/p><p class=\"ex-h\">O(2n) = gli algoritmi che crescono al più come n. Ω(n) = gli algoritmi che crescono almeno come n.<\/p><p>O è <b>solo<\/b> un limite superiore: dice «non cresce più di n», non «cresce almeno n». Controesempio: T(n) = 1 (costante) sta in O(2n) ma <b>non<\/b> in Ω(n).<\/p><div class=\"figwrap\"><svg class=\"fig\" viewBox=\"0 0 560 142\" role=\"img\" aria-label=\"Scala delle crescite. O(2n) copre le crescite da 1 (incluso) a n (incluso). Ω(n) copre le crescite da n (incluso) a infinito.\" xmlns=\"h
