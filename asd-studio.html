<!doctype html><html><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Palestra ASD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Palestra ASD — impaginazione: barra in alto con le sezioni (in basso su telefono), colonna centrale di lettura,
   righe-righello per gli argomenti (la scala delle crescite 1 < log n < n < n² … come motivo ricorrente). */
:root {
  --bg: #eef1ec;
  --surface: #fbfcfa;
  --surface-2: #e4e9e1;
  --ink: #141f1a;
  --ink-2: #384740;
  --muted: #5f6e66;
  --line: #cdd6ca;
  --accent: #2a49d3;
  --accent-ink: #ffffff;
  --accent-soft: #dce3fa;
  --good: #1d7443;
  --good-soft: #d9eee1;
  --warn: #8e5a06;
  --warn-soft: #f5e6c3;
  --bad: #b2362b;
  --bad-soft: #f5dad6;
  --fig-x: #2a49d3;
  --fig-y: #c4690a;
  --code-bg: #e3e9e0;
  --code-ink: #16241d;
  --code-kw: #2a49d3;
  --code-str: #1d7443;
  --code-num: #a1530a;
  --code-com: #66766d;
  --blue: #2a49d3; --blue-soft: #dce3fa;
  --violet: #7a3fd1; --violet-soft: #ebe1fa;
  --teal: #08706b; --teal-soft: #d3eeea;
  --orange: #a94705; --orange-soft: #fae3cf;
  --pink: #b02560; --pink-soft: #f8dbe6;
  --tk-kw: #7a3fd1; --tk-ty: #08706b; --tk-fn: #2a49d3; --tk-str: #17703a; --tk-num: #a14a08; --tk-com: #5c6b63; --tk-pp: #a42f79; --tk-cst: #b03a2e;
  --shadow: 0 1px 0 rgba(20, 31, 26, .05), 0 6px 18px -10px rgba(20, 31, 26, .25);
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1411;
    --surface: #161d19;
    --surface-2: #1f2823;
    --ink: #e5ece7;
    --ink-2: #c3cfc8;
    --muted: #92a199;
    --line: #2a352f;
    --accent: #8fa5ff;
    --accent-ink: #0c1230;
    --accent-soft: #1f2748;
    --good: #5fcf8f;
    --good-soft: #15291e;
    --warn: #e5b04e;
    --warn-soft: #2d2410;
    --bad: #ff8d80;
    --bad-soft: #321a17;
    --fig-x: #8fa5ff;
    --fig-y: #f0a24a;
    --code-bg: #0c120f;
    --code-ink: #dce8e0;
    --code-kw: #9fb2ff;
    --code-str: #7fdca4;
    --code-num: #f0b36a;
    --code-com: #7e8f85;
    --blue: #8fa5ff; --blue-soft: #1f2748;
    --violet: #c2a0ff; --violet-soft: #2a2047;
    --teal: #5fd6c9; --teal-soft: #11302d;
    --orange: #f5a35c; --orange-soft: #3a2412;
    --pink: #ff93bb; --pink-soft: #3b1828;
    --tk-kw: #c9a6ff; --tk-ty: #5fd6c9; --tk-fn: #93b3ff; --tk-str: #92dfa2; --tk-num: #f3b676; --tk-com: #84948b; --tk-pp: #f0a0d4; --tk-cst: #ff9d8e;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1411;
  --surface: #161d19;
  --surface-2: #1f2823;
  --ink: #e5ece7;
  --ink-2: #c3cfc8;
  --muted: #92a199;
  --line: #2a352f;
  --accent: #8fa5ff;
  --accent-ink: #0c1230;
  --accent-soft: #1f2748;
  --good: #5fcf8f;
  --good-soft: #15291e;
  --warn: #e5b04e;
  --warn-soft: #2d2410;
  --bad: #ff8d80;
  --bad-soft: #321a17;
  --fig-x: #8fa5ff;
  --fig-y: #f0a24a;
  --code-bg: #0c120f;
  --code-ink: #dce8e0;
  --code-kw: #9fb2ff;
  --code-str: #7fdca4;
  --code-num: #f0b36a;
  --code-com: #7e8f85;
  --blue: #8fa5ff; --blue-soft: #1f2748;
  --violet: #c2a0ff; --violet-soft: #2a2047;
  --teal: #5fd6c9; --teal-soft: #11302d;
  --orange: #f5a35c; --orange-soft: #3a2412;
  --pink: #ff93bb; --pink-soft: #3b1828;
  --tk-kw: #c9a6ff; --tk-ty: #5fd6c9; --tk-fn: #93b3ff; --tk-str: #92dfa2; --tk-num: #f3b676; --tk-com: #84948b; --tk-pp: #f0a0d4; --tk-cst: #ff9d8e;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15.5px/1.55 var(--f-body);
  padding-bottom: 8px;
}
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(26px, 4.2vw, 36px); font-weight: 700; }
h2 { font-size: clamp(20px, 2.6vw, 24px); font-weight: 700; }
h3 { font-size: 17px; font-weight: 650; }
p { margin: 0 0 .7em; }
a { color: var(--accent); }
code, kbd { font-family: var(--f-mono); font-size: .9em; background: var(--code-bg); padding: .08em .35em; border-radius: 4px; }
b, strong { font-weight: 650; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 0; min-width: 0; }

/* ---------- struttura ---------- */
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; }
body[data-tab="codice"] .wrap { max-width: min(1680px, 100%); }
@media (min-width: 1100px) { body[data-tab="codice"] .wrap { padding-inline: 28px; } }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; pointer-events: none;
  background: linear-gradient(90deg, var(--blue) 0 25%, var(--orange) 25% 50%, var(--teal) 50% 75%, var(--pink) 75% 100%); }
.top-in { display: flex; align-items: center; gap: 14px; min-height: 54px; }
.brand { display: flex; align-items: center; gap: 9px; font: 700 18px var(--f-display); color: var(--ink); text-decoration: none; letter-spacing: -.02em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; flex: none; }
.tabs { display: flex; gap: 2px; margin-left: 10px; }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer; padding: 8px 12px; border-radius: 8px;
  font-weight: 560; color: var(--ink-2); display: flex; align-items: center; gap: 7px; position: relative;
}
.tab svg { width: 18px; height: 18px; flex: none; color: var(--tc, var(--ink-2)); }
.tab[data-tab="studia"] { --tc: var(--blue); --tcs: var(--blue-soft); }
.tab[data-tab="quiz"] { --tc: var(--violet); --tcs: var(--violet-soft); }
.tab[data-tab="codice"] { --tc: var(--teal); --tcs: var(--teal-soft); }
.tab[data-tab="argomenti"] { --tc: var(--orange); --tcs: var(--orange-soft); }
.tab[data-tab="esoneri"] { --tc: var(--pink); --tcs: var(--pink-soft); }
.tab[data-tab="progressi"] { --tc: var(--good); --tcs: var(--good-soft); }
.tab:hover { background: var(--surface-2); }
.tab[aria-current="page"] { color: var(--tc, var(--accent)); background: var(--tcs, var(--accent-soft)); }
.top-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.icon-btn { appearance: none; border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 9px; cursor: pointer; display: grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; }
.sync { white-space: nowrap; appearance: none; border: 1px solid var(--line); background: var(--surface); height: 36px; border-radius: 9px; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 0 11px; font-size: 13px; color: var(--ink-2); }
.sync:hover { background: var(--surface-2); }
.sync i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: block; flex: none; }
.sync.saved i { background: var(--good); } .sync.error i { background: var(--bad); }
.timer { font: 600 14px var(--f-mono); padding: 5px 10px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); cursor: pointer; border: 0; }
.timer.low { background: var(--bad-soft); color: var(--bad); }

main { padding-block: 22px 56px; min-height: 70vh; }
.page-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.page-head p { color: var(--ink-2); max-width: 62ch; margin: 0; }
.eyebrow { font: 600 12px var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.sec { margin-top: 30px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }

/* ---------- elementi base ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.card.flat { box-shadow: none; }
.card.lift { box-shadow: var(--shadow); }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  padding: 9px 15px; border-radius: 9px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; line-height: 1.2;
  text-decoration: none; justify-content: center;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.btn.sm { padding: 6px 11px; font-size: 14px; border-radius: 8px; }
.btn.lg { padding: 13px 22px; font-size: 16px; }
.btn svg { width: 17px; height: 17px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); border: 0; white-space: nowrap; }
button.chip { cursor: pointer; }
button.chip:hover { background: var(--accent-soft); color: var(--accent); }
.chip.prof { background: var(--violet-soft); color: var(--violet); font-weight: 600; }
.chip.g-array { background: var(--teal-soft); color: var(--teal); font-weight: 600; }
.chip.g-lista { background: var(--orange-soft); color: var(--orange); font-weight: 600; }
.pill { font-size: 12px; font-weight: 650; padding: 2px 10px; border-radius: 99px; white-space: nowrap; letter-spacing: .01em; }
.pill.weak { background: var(--bad-soft); color: var(--bad); }
.pill.mid { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.new { background: var(--surface-2); color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { appearance: none; background: var(--surface); border: 0; padding: 6px 12px; cursor: pointer; font-weight: 560; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
input[type="text"], input[type="number"], select, textarea.plain {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%;
}
.empty { text-align: center; padding: 30px 18px; color: var(--ink-2); }

/* ---------- righello (precisione per argomento) ---------- */
.ruler { position: relative; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: visible; }
.ruler::after {
  content: ""; position: absolute; inset: 0; border-radius: 99px; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 calc(20% - 1px), color-mix(in srgb, var(--bg) 70%, transparent) calc(20% - 1px) 20%);
}
.ruler i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--muted); }
.ruler.weak i { background: var(--bad); }
.ruler.mid i { background: var(--warn); }
.ruler.good i { background: var(--good); }
.ruler b { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--surface); border: 3px solid var(--muted); z-index: 1; }
.ruler.weak b { border-color: var(--bad); }
.ruler.mid b { border-color: var(--warn); }
.ruler.good b { border-color: var(--good); }
.ruler.new b { display: none; }

/* ---------- classifica argomenti ---------- */
.topic-list { display: flex; flex-direction: column; gap: 10px; }
.trow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.trow .rank { font: 700 22px var(--f-display); color: var(--muted); text-align: right; padding-top: 1px; }
.trow .rank { color: var(--ac, var(--muted)); }
.trow { background: color-mix(in srgb, var(--ac, var(--accent)) 5%, var(--surface)); }
.trow .btn.primary { background: var(--ac, var(--accent)); border-color: var(--ac, var(--accent)); }
.trow .area-dot + * { color: var(--ink-2); }
.trow .tbody { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.trow .ttitle { display: flex; gap: 8px 10px; align-items: baseline; flex-wrap: wrap; }
.trow .ttitle h3 { font-size: 17px; }
.trow .why { color: var(--ink-2); font-size: 14px; }
.trow .tact { display: flex; gap: 8px; flex-wrap: wrap; justify-self: end; align-self: center; }
.area-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--muted); }
.area-a { background: var(--blue); } .area-b { background: var(--orange); } .area-c { background: var(--teal); } .area-d { background: var(--pink); }

/* ---------- riepilogo in cima ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.stat .v { font: 700 28px var(--f-display); letter-spacing: -.02em; }
.stat:nth-child(4n+1) { --sc: var(--blue); } .stat:nth-child(4n+2) { --sc: var(--violet); } .stat:nth-child(4n+3) { --sc: var(--teal); } .stat:nth-child(4n+4) { --sc: var(--orange); }
.stat { background: color-mix(in srgb, var(--sc, var(--accent)) 8%, var(--surface)); border-color: color-mix(in srgb, var(--sc, var(--accent)) 26%, var(--line)); }
.stat .v { color: var(--sc, var(--ink)); }
.stat .l { font-size: 13px; color: var(--muted); }
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; align-items: center; background: color-mix(in srgb, var(--blue) 7%, var(--surface)); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); }
.hero h1 { margin-bottom: 8px; }
.hero p { color: var(--ink-2); }
.hero .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.axis-art { width: 100%; max-width: 360px; justify-self: center; }
.axis-art text { fill: var(--muted); font: 600 11px var(--f-mono); }
.axis-art .ax { stroke: var(--ink-2); stroke-width: 1.5; }
.axis-art .tk { stroke: var(--ink-2); stroke-width: 1.5; }
.axis-art .b1 { fill: var(--fig-x); opacity: .85; }
.axis-art .b2 { fill: var(--fig-y); opacity: .85; }

/* ---------- elenco modalità quiz ---------- */
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mode { display: flex; flex-direction: column; gap: 6px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-align: left; cursor: pointer; min-width: 0; }
.mode:nth-child(5n+1) { --mc: var(--blue); } .mode:nth-child(5n+2) { --mc: var(--violet); } .mode:nth-child(5n+3) { --mc: var(--teal); } .mode:nth-child(5n+4) { --mc: var(--orange); } .mode:nth-child(5n+5) { --mc: var(--pink); }
.mode { background: color-mix(in srgb, var(--mc, var(--accent)) 7%, var(--surface)); }
.mode:hover:not(:disabled) { border-color: var(--mc, var(--accent)); background: color-mix(in srgb, var(--mc, var(--accent)) 13%, var(--surface)); }
.mode h3 { color: color-mix(in srgb, var(--mc, var(--ink)) 80%, var(--ink)); }
.mode:disabled { opacity: .55; cursor: not-allowed; }
.mode:disabled:hover { border-color: var(--line); }
.mode h3 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.mode p { margin: 0; color: var(--ink-2); font-size: 14px; }
.mode.rec { border-color: var(--accent); background: linear-gradient(0deg, var(--surface), var(--surface)), var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }

/* ---------- sessione quiz ---------- */
.qbar { display: flex; gap: 4px; margin-bottom: 14px; }
.qbar i { flex: 1 1 0; height: 6px; border-radius: 3px; background: var(--surface-2); min-width: 0; }
.qbar i.cur { background: var(--accent); }
.qbar i.ok { background: var(--good); }
.qbar i.ko { background: var(--bad); }
.qmeta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.qtext { font-size: 18px; line-height: 1.45; margin-bottom: 14px; font-weight: 520; max-width: 70ch; text-wrap: pretty; }
.qcard { padding: 22px; }
.opts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.opt { appearance: none; text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font: 650 12.5px var(--f-mono); color: var(--ink-2); }
.opt .t { min-width: 0; overflow-wrap: anywhere; padding-top: 1px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--surface); }
.opt:disabled { cursor: default; }
.vf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.vf .opt { justify-content: center; align-items: center; font-weight: 650; font-size: 17px; padding: 15px; }
.idk { margin-top: 10px; }
.verdict { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 10px; font-weight: 650; margin-top: 16px; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.ko { background: var(--bad-soft); color: var(--bad); }
.verdict svg { width: 22px; height: 22px; flex: none; }
.expl { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 14px; max-width: 74ch; }
.expl .ex-v { font-weight: 650; font-size: 16px; }
.expl .ex-h { color: var(--ink-2); }
.expl .ex-r { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 14.5px; }

.edhint { margin: 8px 0 12px; }
.edbox { min-width: 0; }

.edgrip i { display: block; width: 44px; height: 4px; border-radius: 4px; background: var(--line); box-shadow: 0 0 0 1px color-mix(in srgb, var(--muted) 45%, transparent) inset; }
.edgrip:hover, .edgrip.drag, .edgrip:focus-visible { background: var(--teal-soft); color: var(--teal); }

.splitter i { display: block; width: 4px; border-radius: 4px; background: var(--line); margin: 4px 0; }

.ex-split.side .editor { height: var(--edh, clamp(420px, calc(100vh - 250px), 900px)); }
.ex-side { position: sticky; top: calc(66px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 90px); overflow: auto; }
.statement { font-size: 15.5px; }

/* soluzione affiancata al codice dello studente */
.dcmp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 6px 0 10px; }
.dcol { min-width: 0; }
.dtitle { font: 600 12px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.dbody { background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 6px 0; font: 12.5px/1.55 var(--f-mono); overflow: auto; max-height: 420px; }
.dl { display: flex; gap: 8px; padding: 0 8px 0 0; min-width: min-content; }
.dl .dn { flex: none; width: 26px; text-align: right; color: var(--muted); user-select: none; }
.dl .dt { white-space: pre; }
.dl.diff { background: color-mix(in srgb, var(--warn) 20%, transparent); box-shadow: inset 3px 0 0 var(--warn); }
.dl.same { box-shadow: inset 3px 0 0 var(--good); }
.dl.neutral { color: var(--ink-2); }
@media (max-width: 720px) { .dcmp { grid-template-columns: 1fr; } }
