/* ---- 60-exam.js ---- */
/* ===== esoneri (prove intermedie) e appello: prove a tempo, teoria + codice sotto un solo timer ===== */
let EXAM = null;          /* prova in corso: {kind:'eso'|'teoria'|'codice', title, items, ids, ...} */
let EXAM_REPORT = null;   /* correzione dell'ultima prova consegnata */
let examTick = 0;

/* Le prove intermedie sono cinque (slide 010-intro, p.20). Ho il materiale solo della prima:
   quando il prof carica gli altri quiz li aggiungo con eso = 2, 3… e la pagina li attiva da sola. */
const ESONERI = [1, 2, 3, 4, 5];
const EXAM_CFG = {
  eso: { min: 90, nT: 8, nC: 2, mine: false },   /* come la prova di cui mi hai parlato: 8 di teoria + 2 di codice (1 array, 1 lista) in 90 minuti */
  tMin: 30, tN: 12, cMin: 40,                    /* appello: teoria 30 min, programmazione 40 min (slide 010-intro, p.18) */
};

const esoItems = (n) => BANK.items.filter((i) => i.eso === n);
const esoExercises = (n) => BANK.exercises.filter((e) => e.eso === n);
const esoReady = (n) => esoItems(n).length > 0 || esoExercises(n).length > 0;
function areaOfItem(it) { return TOPIC.get(it.topics[0]).area; }

/* teoria di un esonero: stesse proporzioni di argomenti delle domande del prof di quell'esonero */
function theoryEso(n, count, mine) {
  const base = esoItems(n);
  if (!base.length || count <= 0) return [];
  const cnt = {}; base.forEach((i) => { const a = areaOfItem(i); cnt[a] = (cnt[a] || 0) + 1; });
  const raw = Object.keys(cnt).map((a) => ({ a, x: count * cnt[a] / base.length }));
  raw.forEach((r) => { r.k = Math.floor(r.x); });
  let left = count - raw.reduce((s, r) => s + r.k, 0);
  raw.sort((p, q) => (q.x - q.k) - (p.x - p.k));
  for (let i = 0; left > 0; i = (i + 1) % raw.length, left--) raw[i].k++;
  const own = mine ? BANK.items.filter((i) => i.eso === 0) : [];
  const w = (i) => itemWeight(i) * (i.eso === n ? 2 : 1);
  const out = [], used = new Set();
  raw.forEach(({ a, k }) => {
    const pool = base.concat(own).filter((i) => areaOfItem(i) === a);
    sampleWeighted(pool, w, Math.min(k, pool.length)).forEach((i) => { used.add(i.id); out.push(i); });
  });
  if (out.length < count) {
    const rest = base.concat(own).filter((i) => !used.has(i.id));
    sampleWeighted(rest, w, count - out.length).forEach((i) => out.push(i));
  }
  return shuffle(out).slice(0, count);
}
/* teoria dell'appello: soprattutto notazione asintotica, poi complessita' e ordinamento, poi strutture dati e C */
function theorySet(n) {
  const share = { asy: 0.5, alg: 0.25, ds: 0.15, c: 0.1 };
  const out = [], used = new Set();
  for (const a in share) {
    const k = Math.max(1, Math.round(n * share[a]));
    const pool = BANK.items.filter((i) => areaOfItem(i) === a && !used.has(i.id));
    sampleWeighted(pool, itemWeight, Math.min(k, pool.length)).forEach((i) => { used.add(i.id); out.push(i); });
  }
  while (out.length < n) { const rest = BANK.items.filter((i) => !used.has(i.id)); if (!rest.length) break; const it = sampleWeighted(rest, itemWeight, 1)[0]; used.add(it.id); out.push(it); }
  return shuffle(out).slice(0, n);
}
/* codice: il primo esercizio su array, il secondo su liste, poi alternati. Meglio quelli non ancora superati. */
function pickCode(pool, count) {
  const used = new Set(), out = [], order = ['array', 'lista'];
  const w = (e) => 1 + (e.prof ? 1 : 0) + e.topics.reduce((a, t) => a + stat(t).priority, 0);
  for (let k = 0; k < count; k++) {
    let cand = pool.filter((e) => e.group === order[k % 2] && !used.has(e.id));
    if (!cand.length) cand = pool.filter((e) => !used.has(e.id));
    if (!cand.length) break;
    const fresh = cand.filter((e) => !(P.x[e.id] && P.x[e.id].pass));
    const e = sampleWeighted(fresh.length ? fresh : cand, w, 1)[0];
    used.add(e.id); out.push(e);
  }
  return out;
}

function startExam(kind, eso) {
  let title, minutes, items = [], ids = [];
  if (kind === 'eso') {
    const c = EXAM_CFG.eso;
    title = 'Esonero ' + eso; minutes = c.min;
    items = theoryEso(eso, c.nT, c.mine);
    ids = pickCode(esoExercises(eso), c.nC).map((e) => e.id);
  } else if (kind === 'teoria') { title = 'Appello · teoria'; minutes = EXAM_CFG.tMin; items = theorySet(EXAM_CFG.tN); }
  else { title = 'Appello · programmazione'; minutes = EXAM_CFG.cMin; ids = pickCode(BANK.exercises, 2).map((e) => e.id); }
  if (!items.length && !ids.length) { toast('Non ci sono domande per questa prova'); return; }
  const now = Date.now();
  EXAM = { kind, eso, title, minutes, start: now, end: now + minutes * 60000, items, perms: [], answers: [], flags: new Set(), i: 0, ids, last: {}, ask: false, askAbort: false };
  /* in prova si parte dal codice iniziale, non da una bozza di quando ti stavi allenando */
  ids.forEach((id) => { DR[id] = { c: EXER.get(id).starter, t: now }; });
  if (ids.length) touchDraft();
  EXAM_REPORT = null; CODE.view = 'list'; CODE.run = null; CODE.an = null;
  clearInterval(examTick); examTick = setInterval(examTickFn, 1000);
  updateTimer();
  go('esoneri');
}
function examTickFn() {
  if (!EXAM) { clearInterval(examTick); return; }
  if (Date.now() >= EXAM.end) { submitExam(true); return; }
  updateTimer();
  const bar = $('#tbar-fill'); if (bar) bar.style.width = (100 * (EXAM.end - Date.now()) / (EXAM.minutes * 60000)) + '%';
  const t = $('#exam-left'); if (t) t.textContent = 'Tempo ' + fmtTime(EXAM.end - Date.now());
}
function updateTimer() {
  const t = $('#timer');
  if (!t) return;
  if (!EXAM) { t.hidden = true; return; }
  const left = EXAM.end - Date.now();
  t.hidden = false; t.textContent = fmtTime(left);
  t.classList.toggle('low', left < Math.max(5, Math.round(EXAM.minutes * 0.1)) * 60000);
  t.setAttribute('aria-label', 'Tempo rimasto: ' + fmtTime(left));
}
function abortExam() { EXAM = null; clearInterval(examTick); updateTimer(); CODE.view = 'list'; rerender(); }

/* dall'editor di un esercizio: torna alla prova e chiede se consegnare */
function askSubmitExam() { if (!EXAM) return; saveCurDraft(); EXAM.ask = true; go('esoneri'); }

async function submitExam(auto) {
  if (!EXAM) return;
  const ex = EXAM; EXAM = null; clearInterval(examTick); updateTimer();
  if (ex.ids.length && EDITORS.cur && CODE.view === 'ex' && CODE.exId && ex.ids.includes(CODE.exId)) { DR[CODE.exId] = { c: EDITORS.cur.get(), t: Date.now() }; touchDraft(); }
  const R = { title: ex.title, kind: ex.kind, eso: ex.eso, auto, start: ex.start, end: Date.now(), minutes: ex.minutes, theory: null, ids: ex.ids, rows: ex.ids.length ? [] : null, done: false };
  if (ex.items.length) {
    const res = ex.items.map((q, i) => {
      const p = ex.answers[i];
      const ok = p !== undefined && p === q.answer;
      recordAnswer(q.id, ok);
      return { id: q.id, ok, pick: p === undefined ? 'idk' : p, ms: 0 };
    });
    const tp = {}; res.forEach((r, i) => ex.items[i].topics.forEach((t) => { const a = tp[t] || (tp[t] = [0, 0]); a[0]++; if (r.ok) a[1]++; }));
    recordSession({ t: Date.now(), mode: ex.kind === 'eso' ? 'eso' + ex.eso : 'esame', n: res.length, c: res.filter((r) => r.ok).length, tp });
    R.theory = { items: ex.items, res };
  }
  EXAM_REPORT = R; CODE.view = 'list';
  go('esoneri');
  const look = () => { if (CUR_TAB === 'esoneri') rerender(); };
  const rows = [];
  for (const id of ex.ids) {
    const e = EXER.get(id);
    const code = DR[id] ? DR[id].c : e.starter;
    const run = await runTests(e, code);
    if (!run.compile) recordRun(id, run.passed, run.total);
    rows.push({ e, run, code });
    R.rows = rows.slice(); look();
  }
  R.done = true; look();
}

/* ---------- la prova in corso ---------- */

function renderExamMenu(root) {

  const grid = h('div', { class: 'eso-grid' });

function renderExamReport(root) {
  const R = EXAM_REPORT, T = R.theory, rows = R.rows || [];
  root.append(h('div', { class: 'page-head' }, h('span', { class: 'eyebrow' }, R.title + ' · simulazione'), h('h1', null, R.done ? 'Correzione' : 'Sto correggendo…'),
    h('p', null, `${R.auto ? 'Tempo scaduto. ' : ''}Tempo usato: ${fmtTime(R.end - R.start)} su ${R.minutes} minuti.`)));

  const answered = T ? T.items.map((q, i) => ({ q, r: T.res[i] })) : [];
  const tOk = answered.filter((x) => x.r.ok).length;
  const wrongQ = answered.filter((x) => !x.r.ok);
  const full = rows.filter((x) => !x.run.compile && x.run.passed === x.run.total).length;
  const pass = rows.reduce((a, x) => a + (x.run.compile ? 0 : x.run.passed), 0);
  const tot = rows.reduce((a, x) => a + (x.run.compile ? x.e.tests.length : x.run.total), 0);
  const boxes = [];
  if (T) boxes.push(h('div', { id: 'rep-teoria' }, h('div', { class: 'eyebrow' }, 'Teoria'), h('div', { class: 'sum-score num' }, `${tOk}/${T.items.length}`),
    h('p', { class: 'muted' }, `${pct(tOk / T.items.length)} giuste · le domande senza risposta contano sbagliate`)));
  if (R.ids.length) boxes.push(h('div', { id: 'rep-codice' }, h('div', { class: 'eyebrow' }, 'Codice'), h('div', { class: 'sum-score num' }, R.done ? `${full}/${R.ids.length}` : '…'),
    h('p', { class: 'muted' }, R.done ? `esercizi con tutti i test superati · test passati ${pass} su ${tot}` : `corretti ${rows.length} su ${R.ids.length}`)));
  root.append(h('div', { class: 'card lift' + (boxes.length > 1 ? ' grid g2' : '') }, ...boxes));

  /* dove si sono persi punti */
  const lost = {};
  wrongQ.forEach((x) => x.q.topics.forEach((t) => { lost[t] = (lost[t] || 0) + 1; }));
  rows.forEach((x) => { if (x.run.compile || x.run.passed < x.run.total) x.e.topics.forEach((t) => { lost[t] = (lost[t] || 0) + 1; }); });
  const bad = Object.keys(lost).sort((a, b) => lost[b] - lost[a]).slice(0, 6);
  if (R.done && bad.length) root.append(h('div', { class: 'card flat', style: 'margin-top:14px' }, h('h3', null, 'Dove hai perso punti'),
    h('div', { class: 'chips', style: 'margin-top:10px' }, bad.map((t) => h('button', { class: 'chip', type: 'button', onclick: () => go('argomenti', { topic: t }) }, TOPIC.get(t).title)))));

  const acts = h('div', { class: 'row', style: 'margin:16px 0' });
  if (wrongQ.length) acts.append(h('button', { class: 'btn primary', type: 'button', onclick: () => { EXAM_REPORT = null; startSession('retry', 'Rifai gli errori', shuffle(wrongQ.map((x) => x.q))); } }, 'Rifai le ' + wrongQ.length + ' domande sbagliate'));
  acts.append(h('button', { class: 'btn', type: 'button', id: 'exam-again', onclick: () => { EXAM_REPORT = null; rerender(); } }, 'Nuova simulazione'),
    h('button', { class: 'btn ghost', type: 'button', onclick: () => go('studia') }, 'Torna a cosa studiare'));
  root.append(acts);

  if (T) {
    root.append(h('h2', { style: 'margin:22px 0 10px' }, 'Domande di teoria'));
    root.append(reviewNode(answered));
  }
  if (R.ids.length) {
    root.append(h('h2', { style: 'margin:26px 0 10px' }, 'Esercizi di codice'));
    rows.forEach(({ e, run, code }, k) => {
      const all = !run.compile && run.passed === run.total;
      const c = h('div', { class: 'card', style: 'margin-bottom:14px' }, h('div', { class: 'row', style: 'justify-content:space-between' }, h('h3', null, `Esercizio ${k + 1}: ${e.title}`), h('span', { class: 'pill ' + (all ? 'good' : 'weak') }, run.compile ? 'Non compila' : (all ? 'Tutti i test superati' : `${run.passed} su ${run.total}`))));
      const box = h('div', { style: 'margin-top:12px' }); paintResults(e, run, box, analyse(e, code, run)); c.append(box);
      c.append(h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'btn sm', type: 'button', onclick: () => openExercise(e.id) }, 'Riapri l’esercizio (con aiuti e soluzione)')));
      root.append(c);
    });
    if (!R.done) root.append(h('p', { class: 'muted', role: 'status' }, 'Sto eseguendo i test sull’esercizio successivo…'));
  }
}

function sparkline(points) {
  const W = 560, H = 86, L = 28, R = 10, T = 8, B = 18;
  const n = points.length;
  const x = (i) => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1));
  const y = (v) => T + (1 - v) * (H - T - B);
  let s = `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Percentuale di risposte giuste nelle ultime ${n} sessioni">`;
  [0, 0.5, 1].forEach((v) => { s += `<line class="gr" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="2" y="${y(v) + 4}">${Math.round(v * 100)}</text>`; });
  s += `<polyline class="ln" points="${points.map((p, i) => x(i) + ',' + y(p)).join(' ')}"/>`;
  points.forEach((p, i) => { s += `<circle class="dt" cx="${x(i)}" cy="${y(p)}" r="3.6"/>`; });
  return s + '</svg>';
}

      h('div', { class: 'stat' }, h('div', { class: 'v num' }, String(O.wrong.length)), h('div', { class: 'l' }, 'Da rifare')),
      h('div', { class: 'stat' }, h('div', { class: 'v num' }, `${O.exPass}/${BANK.exercises.length}`), h('div', { class: 'l' }, 'Esercizi di C superati'))));
    const q = h('div', { class: 'row', style: 'margin-top:14px' });
    if (O.wrong.length) q.append(h('button', { class: 'btn', type: 'button', onclick: () => startMode('wrong') }, `Rifai gli sbagliati (${O.wrong.length})`));
    q.append(h('button', { class: 'btn', type: 'button', onclick: () => go('esoneri') }, 'Simula un esonero'));
    q.append(h('button', { class: 'btn ghost', type: 'button', onclick: () => go('codice') }, 'Esercizi di C'));
    root.append(q);
  }

  const sec = h('section', { class: 'sec' });
  sec.append(h('div', { class: 'sec-head' }, h('h2', null, first ? 'Gli argomenti della materia' : 'Classifica: cosa studiare'),
    h('span', { class: 'muted small' }, first ? 'Ordinati per quanto contano nei quiz. Si riordinano appena rispondi.' : 'Più in alto = più urgente. Conta quanto sbagli, quanto non hai provato e quanto l’argomento esce nei quiz.')));
  const list = h('div', { class: 'topic-list' });
  const n = showAllTopics ? rk.length : Math.min(6, rk.length);
  rk.slice(0, n).forEach((t, i) => list.append(topicRow(t, i + 1)));
  sec.append(list);
  if (rk.length > 6) sec.append(h('div', { class: 'row', style: 'margin-top:14px;justify-content:center' }, h('button', { class: 'btn ghost', type: 'button', onclick: () => { showAllTopics = !showAllTopics; rerender(); } }, showAllTopics ? 'Mostra solo i primi 6' : `Mostra tutti i ${rk.length} argomenti`)));
  root.append(sec);
  root.append(h('p', { class: 'muted small', style: 'margin-top:34px' }, `Banca ${BANK.meta.version} del ${BANK.meta.built} · ${BANK.items.length} domande, ${BANK.exercises.length} esercizi, ${BANK.topics.length} argomenti. Quando il prof carica altri quiz, mandameli e li aggiungo con gli stessi argomenti: i tuoi progressi restano.`));
}

/* ===== navigazione ===== */
const TABS = [['studia', 'Studia', 'study'], ['quiz', 'Quiz', 'quiz'], ['codice', 'Codice', 'code'], ['argomenti', 'Argomenti', 'topics'], ['esoneri', 'Esoneri', 'exam'], ['progressi', 'Progressi', 'stats']];
let CUR_TAB = 'studia';
const RENDER = { studia: renderHome, quiz: renderQuiz, codice: renderCode, argomenti: renderTopics, esoneri: renderExam, progressi: renderProgress };
let hashLock = false;

function go(tab, params) {
  if (tab === 'codice' && EXAM && EXAM.ids.length && !(CODE.view === 'ex' && EXAM.ids.includes(CODE.exId))) tab = 'esoneri';
  if (tab === 'argomenti') NOTE.topic = params && params.topic ? params.topic : null;
  CUR_TAB = tab;
  hashLock = true; try { location.hash = '#' + tab; } catch (e) { /* ambiente senza hash */ }
  setTimeout(() => { hashLock = false; }, 0);
  render(); window.scrollTo({ top: 0 });
}
function render() {
  document.body.dataset.tab = CUR_TAB;
  const view = clear($('#view'));
  try { RENDER[CUR_TAB](view); }
  catch (err) {
    console.error(err);
    view.append(h('div', { class: 'card' }, h('h2', null, 'Qualcosa non ha funzionato'), h('p', null, 'Ricarica la pagina: i progressi sono salvati. Dettaglio: ' + err.message)));
  }
  $('#tabs').querySelectorAll('.tab').forEach((b) => { if (b.dataset.tab === CUR_TAB) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  updateTimer(); updateSync();
}
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function updateSync() {
  const d = $('#sync'); if (!d) return;
  d.title = sync.note; d.setAttribute('aria-label', sync.note);
  d.className = 'sync ' + sync.state;
  d.lastChild.textContent = sync.state === 'saved' ? 'Salvato' : sync.state === 'error' ? 'Non salvato' : 'Solo su questo browser';
}
onSyncChange = updateSync;

function buildShell() {
  const nav = $('#tabs');
  TABS.forEach(([id, label, ic]) => {
    const b = h('button', { class: 'tab', type: 'button', 'data-tab': id, onclick: () => { if (id === 'codice' && id === CUR_TAB && !(EXAM && EXAM.ids.length)) CODE.view = 'list'; if (id === 'quiz' && QZ && QZ.done) QZ = null; go(id); } });
    b.innerHTML = svgIcon(ic) + `<span>${label}</span>`;
    nav.append(b);
  });
  const tools = $('#tools');
  const timer = h('button', { class: 'timer', id: 'timer', type: 'button', hidden: true, onclick: () => go('esoneri') }, '');
  const sy = h('button', { class: 'sync local', id: 'sync', type: 'button', onclick: () => go('progressi') }, h('i'), h('span', null, 'Solo su questo browser'));
  const th = h('button', { class: 'icon-btn', id: 'theme-btn', type: 'button', 'aria-label': 'Cambia tema chiaro/scuro', onclick: () => { toggleTheme(); paintThemeBtn(); } });
  tools.append(timer, sy, th);
  paintThemeBtn();
}
function paintThemeBtn() { const b = $('#theme-btn'); if (b) b.innerHTML = svgIcon(currentThemeIsDark() ? 'sun' : 'moon'); }

window.addEventListener('hashchange', () => {
  if (hashLock) return;
  const t = location.hash.replace('#', '');
  if (RENDER[t] && t !== CUR_TAB) { CUR_TAB = t; if (t === 'argomenti') NOTE.topic = null; render(); window.scrollTo({ top: 0 }); }
});

(function boot() {
  const saved = lsGet(LS_T);
  if (saved === 'dark' || saved === 'light') applyTheme(saved);
  loadLocal();
  buildShell();
  const t = location.hash.replace('#', '');
  if (RENDER[t]) CUR_TAB = t;
  render();
  initCloud(() => { if (['studia', 'progressi', 'argomenti'].includes(CUR_TAB)) rerender(); });
})();


})();
</script>
</body></html>
