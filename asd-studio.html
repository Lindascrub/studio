a somma degli altri NON basta)","Dimenticare l'array vuoto","Dimenticare di sottrarre A[i] dalla somma"],"topics":["c-puntatori","c-array","c-casi-limite"],"prof":false,"eso":1,"prelude":"","tests":[{"n":1,"code":"int A[1] = {0};   /* array vuoto: len = 0 */\nint result = -1;\ntest(A, 0, &result);\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["array vuoto"]},{"n":2,"code":"int A[] = {5};\nint result = -1;\ntest(A, 1, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["un elemento"]},{"n":3,"code":"int A[] = {0};\nint result = -1;\ntest(A, 1, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["un elemento a zero"]},{"n":4,"code":"int A[] = {1, 2, 3};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["uguale alla somma (non basta)"]},{"n":5,"code":"int A[] = {10, 2, 3};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 10 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["il primo è speciale"]},{"n":6,"code":"int A[] = {3, 3};\nint result = -1;\ntest(A, 2, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["uguali"]},{"n":7,"code":"int A[] = {1, 1, 5};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["l'ultimo è speciale"]},{"n":8,"code":"int A[] = {-5, 2, 3};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != -5 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["negativi"]},{"n":9,"code":"int A[] = {0, 0, 0};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["tutti zero"]},{"n":10,"code":"int A[] = {4, 1, 2};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["elemento centrale/primo"]},{"n":11,"code":"int A[] = {2, 2, 2};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["tutti uguali"]}]},{"id":"a-ripetuto-x-volte","title":"Un valore x ripetuto esattamente x volte","group":"array","kind":"A_ret","statement":"Scrivi la funzione in linguaggio C int test(int* A, int len) che accetta in input un array A di interi e la sua lunghezza \"len\". La funzione ritorna 1 (true) se esiste un elemento x di A (con x > 0) che è ripetuto esattamente x volte. Altrimenti, la funzione ritorna 0 (false).","fn":"int test(int* A, int len)","starter":"/* Scrivi la funzione in linguaggio C int test(int* A, int len) che accetta\n   in input un array A di interi e la sua lunghezza \"len\". La funzione\n   ritorna 1 (true) se esiste un elemento x di A (con x > 0) che è ripetuto\n   esattamente x volte. Altrimenti, la funzione ritorna 0 (false). */\n\nint test(int* A, int len){\n\n\n\n\n\n\n}\n","solution":"int test(int* A, int len){\n  int i, j, conta;\n  for (i = 0; i < len; i++) {\n    if (A[i] > 0) {\n      conta = 0;                      /* quante volte compare A[i]? */\n      for (j = 0; j < len; j++)\n        if (A[j] == A[i])\n          conta++;\n      if (conta == A[i])              /* esattamente x volte */\n        return 1;\n    }\n  }\n  return 0;\n}","solutionFull":"int test(int* A, int len){\n  int i, j, conta;\n  for (i = 0; i < len; i++) {\n    if (A[i] > 0) {\n      conta = 0;                      /* quante volte compare A[i]? */\n      for (j = 0; j < len; j++)\n        if (A[j] == A[i])\n          conta++;\n      if (conta == A[i])              /* esattamente x volte */\n        return 1;\n    }\n  }\n  return 0;\n}","explain":"Per ogni elemento positivo A[i] conta quante volte compare nell'array (ciclo interno) e confronta con A[i]. Il contatore va azzerato ad ogni elemento. \"Esattamente\" significa ==, non >=.","hints":["Servono due cicli annidati: uno sceglie x, l'altro conta le occorrenze.","Azzera il contatore per ogni nuovo x.","Ignora gli elementi <= 0."],"pitfalls":["Non azzerare il contatore","Usare >= invece di ==","Considerare anche x = 0 o x negativo"],"topics":["c-array","c-casi-limite"],"prof":false,"eso":1,"prelude":"","tests":[{"n":1,"code":"int A[] = {1};\nint result = test(A, 1);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["un elemento vero"]},{"n":2,"code":"int A[] = {2, 2};\nint result = test(A, 2);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["vero"]},{"n":3,"code":"int A[] = {2};\nint result = test(A, 1);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["falso"]},{"n":4,"code":"int A[] = {3, 3, 3};\nint result = test(A, 3);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["tre volte"]},{"n":5,"code":"int A[] = {1, 2, 2};\nint result = test(A, 3);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["uno vero, uno no"]},{"n":6,"code":"int A[] = {2, 2, 2};\nint result = test(A, 3);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["troppe volte"]},{"n":7,"code":"int A[] = {0, 0};\nint result = test(A, 2);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["zero non conta"]},{"n":8,"code":"int A[] = {-1, -1};\nint result = test(A, 2);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != -1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != -1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["negativi"]},{"n":9,"code":"int A[] = {4, 3, 3, 3, 4, 4, 4};\nint result = test(A, 7);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[4] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[5] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[6] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["il secondo valore è quello giusto"]},{"n":10,"code":"int A[] = {1, 1};\nint result = test(A, 2);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["due volte l'1"]},{"n":11,"code":"int A[1] = {0};   /* array vuoto: len = 0 */\nint result = test(A, 0);\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["array vuoto"]},{"n":12,"code":"int A[] = {0, 1};\nint result = test(A, 2);\n/     somma = somma + A[i];\n  *out = (float) somma / len;   /* il cast evita la divisione intera */\n}","explain":"Somma tutti gli elementi in un int e dividi per len. Attenzione: somma / len tra due interi è una divisione INTERA (1/2 fa 0). Trasforma uno dei due in float prima di dividere: (float) somma / len.","hints":["Calcola la somma in una variabile int.","Una divisione tra due int scarta i decimali: converti con un cast.","Scrivi il risultato con *out."],"pitfalls":["*out = somma / len; (divisione intera: perde i decimali)","Dimenticare l'asterisco"],"topics":["c-puntatori","c-array","c-divisione-intera"],"prof":false,"eso":1,"prelude":"","tests":[{"n":1,"code":"int A[] = {1, 2, 3};\nfloat result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%.2f\\n\", result);","expected":"2.00\n","tags":["tipico"]},{"n":2,"code":"int A[] = {1, 2};\nfloat result = -1;\ntest(A, 2, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%.2f\\n\", result);","expected":"1.50\n","tags":["media non intera"]},{"n":3,"code":"int A[] = {5};\nfloat result = -1;\ntest(A, 1, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%.2f\\n\", result);","expected":"5.00\n","tags":["un elemento"]},{"n":4,"code":"int A[] = {-1, 1};\nfloat result = -1;\ntest(A, 2, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != -1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%.2f\\n\", result);","expected":"0.00\n","tag itorna 1 (true) se nessun elemento di A è anche un elemento di B e ritorna 0 (false) se B contiene almeno un elemento che è in A. Se A o B hanno lunghezza zero la funzione ritorna 1 (true).","fn":"int test(int* A, int lenA, int* B, int lenB)","starter":"/* Scrivi la funzione in linguaggio C int test(int* A, int lenA, int* B,\n   int lenB) che accetta in input due array A e B di interi e le loro\n   lunghezze lenA e lenB. La funzione ritorna 1 (true) se nessun elemento\n   di A è anche un elemento di B e ritorna 0 (false) se B contiene almeno\n   un elemento che è in A. Se A o B hanno lunghezza zero la funzione\n   ritorna 1 (true). */\n\nint test(int* A, int lenA, int* B, int lenB){\n\n\n\n\n\n\n}\n","solution":"int test(int* A, int lenA, int* B, int lenB){\n  int i, j;\n  for (i = 0; i < lenA; i++)\n    for (j = 0; j < lenB; j++)\n      if (A[i] == B[j])      /* un elemento in comune */\n        return 0;\n  return 1;                  /* nessun elemento in comune (anche se uno è vuoto) */\n}","solutionFull":"int test(int* A, int lenA, int* B, int lenB){\n  int i, j;\n  for (i = 0; i < lenA; i++)\n    for (j = 0; j < lenB; j++)\n      if (A[i] == B[j])      /* un elemento in comune */\n        return 0;\n  return 1;                  /* nessun elemento in comune (anche se uno è vuoto) */\n}","explain":"Confronta ogni elemento di A con ogni elemento di B (due cicli annidati, ognuno con la SUA lunghezza). Se ne trovi due uguali ritorna 0 subito; solo alla fine, dopo aver provato tutte le coppie, ritorna 1. Se uno degli array è vuoto i cicli non girano e ritorna 1.","hints":["Servono due cicli annidati: un indice per A e un indice per B.","Il ciclo su B va da 0 a lenB (non a lenA).","Ritorna 1 solo DOPO i cicli, mai dentro."],"pitfalls":["Confrontare solo A[i] con B[i] (stessa posizione)","Usare lenA per entrambi i cicli","Ritornare 1 nell'else dentro il ciclo"],"topics":["c-array","c-casi-limite"],"prof":false,"eso":1,"prelude":"","tests":[{"n":1,"code":"int A[] = {1, }\n}","explain":"È un \"esiste\": parti da 0 e appena trovi un elemento A[i] < len metti 1 e fermati. Confronta con len, non con i. \"Minore\" è stretto: A[i] == len non vale.","hints":["Parti da *out = 0 e cerca un elemento che soddisfi la condizione.","Confronta A[i] con len.","Se len è 0 il ciclo non esegue nulla: cosa deve restare in *out?"],"pitfalls":["Usare <= len","Confrontare A[i] con i","Non assegnare nulla a *out se l'array è vuoto"],"topics":["c-puntatori","c-array","c-casi-limite"],"prof":false,"eso":1,"prelude":"","tests":[{"n":1,"code":"int A[] = {3, 3, 3};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["nessuno (uguale a len)"]},{"n":2,"code":"int A[] = {3, 3, 2};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["uno in fondo"]},{"n":3,"code":"int A[] = {0};\nint result = -1;\ntest(A, 1, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["zero"]},{"n":4,"code":"int A[] = {1};\nint result = -1;\ntest(A, 1, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["uguale a len"]},{"n":5,"code":"int A[] = {5, 6, 7, 8};\nint result = -1;\ntest(A, 4, &result);\n/* controllo che non abbia modificato l'arr  due celle non adiacenti (cioè non attaccate una all'altra) di A che contengono lo stesso valore. Altrimenti, la funzione ritorna 0 (false).","fn":"int test(int* A, int len)","starter":"/* Scrivi la funzione in linguaggio C int test(int* A, int len) che accetta\n   in input un array A di interi e la sua lunghezza \"len\". La funzione\n   ritorna 1 (true) se esistono due celle non adiacenti (cioè non attaccate\n   una all'altra) di A che contengono lo stesso valore. Altrimenti, la\n   funzione ritorna 0 (false). */\n\nint test(int* A, int len){\n\n\n\n\n\n\n}\n","solution":"int test(int* A, int len){\n  int i, j;\n  for (i = 0; i < len; i++)\n    for (j = i + 2; j < len; j++)   /* j parte da i+2: salto la cella adiacente */\n      if (A[i] == A[j])\n        return 1;\n  return 0;\n}","solutionFull":"int test(int* A, int len){\n  int i, j;\n  for (i = 0; i < len; i++)\n    for (j = i + 2; j < len; j++)   /* j parte da i+2: salto la cella adiacente */\n      if (A[i] == A[j])\n        return 1;\n  return 0;\n}","explain":"Due celle i < j sono adiacenti se j == i+1. Quindi il ciclo interno parte da j = i + 2 e confronta A[i] con A[j]. Non basta confrontare solo A[i] con A[i+2]: i valori uguali possono essere a distanza qualsiasi (≥ 2).","hints":["Due cicli annidati con i < j.","Il ciclo interno non deve guardare la cella subito accanto.","Non limitarti a confrontare A[i] con A[i+2]."],"pitfalls":["Far partire j da i+1 (include le celle adiacenti)","Confrontare solo celle a distanza esatta 2","Leggere A[i+2] oltre la fine"],"topics":["c-array","c-casi-limite"],"prof":false,"eso":1,"prelude":"","tests":[{"n":1,"code":"int A[] = {1, 2, 1};\nint result = test(A, 3);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["distanza 2"]},{"n":2,"code":"int A[] = {1, 1};\nint result = test(A, 2);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["adiacenti"]},{"n":3,"code":"int A[] = {1, 1, 1};\nint result = test(A, 3);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["tre uguali"]},{"n":4,"code":"int A[] = {1, 2, 3};\nint result = test(A, 3);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["tutti diversi"]},{"n":5,"code":"int A[] = {5, 5, 6, 6};\nint result = test(A, 4);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 6 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 6 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["solo coppie adiacenti"]},{"n":6,"code":"int A[] = {7};\nint result = test(A, 1);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 7 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["un elemento"]},{"n":7,"code":"int A[1] = {0};   /* array vuoto: len = 0 */\nint result = test(A, 0);\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["array vuoto"]},{"n":8,"code":"int A[] = {1, 2, ray (anche non consecutive). Se una vale almeno 3 ritorna 0; se nessuna ci arriva ritorna 1 alla fine. Il contatore include A[i] stesso, quindi la soglia è 3.","hints":["Per ogni elemento conta le occorrenze in tutto l'array.","Il contatore include l'elemento stesso: la soglia è 3.","Le ripetizioni non devono essere consecutive."],"pitfalls":["Cercare solo tre elementi uguali consecutivi","Soglia sbagliata (> 3 invece di >= 3)","Non azzerare il contatore"],"topics":["c-array","c-casi-limite"],"prof":false,"eso":1,"prelude":"","tests":[{"n":1,"code":"int A[] = {1, 2, 3};\nint result = test(A, 3);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["tutti diversi"]},{"n":2,"code":"int A[] = {1, 1, 2};\nint result = test(A, 3);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["una coppia"]},{"n":3,"code":"int A[] = {1, 1, 1};\nint result = test(A, 3);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["tre consecutivi"]},{"n":4,"code":"int A[] = {1, 2, 1, 2};\nint result = test(A, 4);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 1 ) printf(\"Hai modificato l nt* A, int lenA, int* B, int lenB){\n  int i, j;\n  for (i = 0; i < lenA; i++)\n    for (j = 0; j < lenB; j++)\n      if (A[i] >= B[j])        /* una coppia che viola \"strettamente minore\" */\n        return 0;\n  return 1;\n}","explain":"\"Tutti con tutti\" significa controllare TUTTE le coppie (A[i], B[j]): basta una coppia con A[i] >= B[j] per rispondere 0. Se uno dei due array è vuoto non c'è nessuna coppia e la risposta è 1.","hints":["Controlla tutte le coppie con due cicli annidati.","Basta una coppia con A[i] >= B[j] per rispondere 0.","Non confrontare solo A[i] con B[i] o con B[0]."],"pitfalls":["Confrontare solo il massimo di A con B[0]","Usare > invece di >= nel controllo di violazione","Confrontare A[i] con B[i]"],"topics":["c-array","c-casi-limite"],"prof":false,"eso":1,"prelude":"","tests":[{"n":1,"code":"int A[] = {1, 2};\nint B[] = {3, 4};\nint result = test(A, 2, B, 2);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\n/* controllo che non abbia modificato l'array di input */\nif( B[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( B[1] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["vero"]},{"n":2,"code":"int A[] = {1, 5};\nint B[] = {3, 4};\nint result = test(A, 2, B, 2);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 5 ) printf(\"Hai modificato l'array di input\\n\");\n/* controllo che non abbia modificato l'array di input */\nif( B[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( B[1] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["falso"]},{"n":3,"code":"int A[] = {3};\nint B[] = {3};\nint result = test(A, 1, B, 1);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\n/* controllo che non abbia modificato l'array di input */\nif( B[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["uguali (stretto)"]},{"n":4,"code":"int A[1] = {0};   /* array vuoto: len = 0 */\nint B[] = {1};\nint result = test(A, 0, B, 1);\n/* controllo che non abbia modificato l'array di input */\nif( B[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["A vuoto"]},{"n":5,"code":"int A[] = {1};\nint B[1] = {0};   /* array vuoto: len = 0 */\nint result = test(A, 1, B, 0);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["B vuoto"]},{"n":6,"code":"int A[] = {1, 2, 3};\nint B[] = {4};\nint result = test(A, 3, B, 1);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\n/* controllo che non abbia modificato l'array di input */\nif( B[0] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["B con un solo elemento"]},{"n":7,"code":"int A[] = {1};\nint B[] = {0, 5};\nint result = test(A, 1, B, 2);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\n/* controllo che non abbia modificato l'array di input */\nif( B[0] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( B[1] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["un elemento di B è piccolo"]},{"n":8,"code":"int A[] = {1, 2};\nint B[] = {3, 0};\nint result = test(A, 2, B, 2);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\n/* controllo che non abbia modificato l'array di input */\nif( B[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( B[1] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["il piccolo è in fondo a B"]},{"n":9,"code":"int A[] = {1, 2};\nint B[] = {5, 3};\nint result = test(A, 2, B, 2);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\n/* controllo che non abbia modificato l'array di input */\nif( B[0] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nif( B[1] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["vero con B decrescente"]},{"n":10,"code":"int A[1] = {0};   /* array vuoto: len = 0 */\nint B[] = {0};\nint result = test(A, 0, B, 1);\n/* controllo che non abbia modificato l'array di input */\nif( B[0] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["A vuoto, B no"]}]},{"id":"a-multipli-val","title":"Tutti gli elementi sono multipli di val","group":"array","kind":"A_val_out","statement":"Scrivi la funzione in linguaggio C void test(int* A, int len, int val, int* out) che accetta in input un array di interi A, la sua lunghezza \"len\", un intero \"val\" e un puntatore ad intero \"out\", il cui valore non è noto a priori. La funzione assegna all'intero puntato da \"out\" il valore 1 (true) se tutti gli elementi dell'array sono multipli di \"val\". Altrimenti, la funzione assegna all'intero puntato da \"out\" il valore 0 (false).","fn":"void test(int* A, int len, int val, int* out)","starter":"/* Scrivi la funzione in linguaggio C void test(int* A, int len, int val,\n   int* out) che accetta in input un array di interi A, la sua lunghezza\n   \"len\", un intero \"val\" e un puntatore ad intero \"out\", il cui valore non\n   è noto a priori. La funzione assegna all'intero puntato da \"out\" il\n   valore 1 (true) se tutti gli elementi dell'array sono multipli di \"val\".\n   Altrimenti, la funzione assegna all'intero puntato da \"out\" il valore 0\n   (false). */\n\nvoid test(int* A, int len, int val, int* out){\n\n\n\n\n\n\n}\n","solution":"void test(int* A, int len, int val, int* out){\n  int i;\n  *out = 1;\n  for (i = 0; i < len; i++) {\n    if (A[i] % val != 0) {   /* x è multiplo di y se x % y == 0 */\n      *out = 0;\n      return;\n    }\n  }\n}","solutionFull":"void test(int* A, int len, int val, int* out){\n  int i;\n  *out = 1;\n  for (i = 0; i < len; i++) {\n    if (A[i] % val != 0) {   /* x è multiplo di y se x % y == 0 */\n      *out = 0;\n      return;\n    }\n  }\n}","explain":"Un \"per ogni\" con la condizione x % val == 0 (resto zero). Parti da 1 e metti 0 appena trovi un elemento il cui resto è diverso da zero. Zero è multiplo di ogni numero; i negativi funzionano ugualmente perché il resto è zero o non zero.","hints":["x è multiplo di y se x % y vale 0.","Parti da *out = 1 e cerca un controesempio."],"pitfalls":["Scambiare gli operandi: val % A[i]","Usare A[i] / val"],"topics":["c-puntatori","c-array","c-modulo"],"prof":false,"eso":1,"prelude":"","tests":[{"n":1,"code":"int A[] = {4, 8, 12};\nint result = -1;\ntest(A, 3, 4, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 8 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 12 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["vero"]},{"n":2,"code":"int A[] = {4, 8, 13};\nint result = -1;\ntest(A, 3, 4, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 8 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 13 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["uno no, in fondo"]},{"n":3,"code":"int A[] = {0, 0};\nint result = -1;\ntest(A, 2, 5, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["zeri"]},{"n":4,"code":"int A[1] = {0};   /* array vuoto: len = 0 */\nint result = -1;\ntest(A, 0, 3, &result);\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["array vuoto"]},{"n":5,"code":"int A[] = {7};\nint result = -1;\ntest(A, 1, 7, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 7 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["un elemento"]},{"n":6,"code":"int A[] = {-6, 9};\nint result = -1;\ntest(A, 2, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != -6 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 9 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["negativi"]},{"n":7,"code":"int A[] = {-5, 10};\nint result = -1;\ntest(A, 2, 5, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != -5 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 10 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["negativo e positivo"]},{"n":8,"code":"int A[] = {2, 4, 5};\nint result = -1;\ntest(A, 3, 2, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["uno no"]},{"n":9,"code":"int A[] = {5, 6, 7};\nint result = -1;\ntest(A, 3, 1, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 6 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 7 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["val = 1"]},{"n":10,"code":"int A[] = {10, 20, 35};\nint result = -1;\ntest(A, 3, 10, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 10 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 20 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 35 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["ultimo no"]},{"n":11,"code":"int A[] = {1};\nint result = -1;\ntest(A, 1, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["un solo elemento non multiplo"]},{"n":12,"code":"int A[] = {1};\nint result = -1;\ntest(A, 1, 4, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["un solo elemento non multiplo (altro val)"]}]},{"id":"a-pari-dispari-alternati","title":"Indici pari → valori dispari, indici dispari → valori pari","group":"array","kind":"A_out","statement":"Scrivi la funzione in linguaggio C void test(int* A, int len, int* out) che accetta in input un array di interi A, la sua lunghezza \"len\" e un puntatore ad intero \"out\", il cui valore non è noto a priori. La funzione assegna all'intero puntato da \"out\" il valore 1 (true) se le celle dell'array che hanno un indice pari contengono un valore dispari mentre le celle dell'array che hanno un indice dispari contengono un valore pari (zero è considerato un numero pari). Altrimenti la funzione assegna all'intero puntato da \"out\" il valore 0 (false).","fn":"void test(int* A, int len, int* out)","starter":"/* Scrivi la funzione in linguaggio C void test(int* A, int len, int* out)\n   che accetta in input un array di interi A, la sua lunghezza \"len\" e un\n   puntatore ad intero \"out\", il cui valore non è noto a priori. La\n   funzione assegna all'intero puntato da \"out\" il valore 1 (true) se le\n   celle dell'array che hanno un indice pari contengono un valore dispari\n   mentre le celle dell'array che hanno un indice dispari contengono un\n   valore pari (zero è considerato un numero pari). Altrimenti la funzione\n   assegna all'intero puntato da \"out\" il valore 0 (false). */\n\nvoid test(int* A, int len, int* out){\n\n\n\n\n\n\n}\n","solution":"void test(int* A, int len, int* out){\n  int i;\n  *out = 1;\n  for (i = 0; i < len; i++) {\n    if (i % 2 == 0) {                 /* indice pari: il valore deve essere dispari */\n      if (A[i] % 2 == 0) {\n        *out = 0;\n        return;\n      }\n    } else {                          /* indice dispari: il valore deve essere pari */\n      if (A[i] % 2 != 0) {\n        *out = 0;\n        return;\n      }\n    }\n  }\n}","solutionFull":"void test(int* A, int len, int* out){\n  int i;\n  *out = 1;\n  for (i = 0; i < len; i++) {\n    if (i % 2 == 0) {                 /* indice pari: il valore deve essere dispari */\n      if (A[i] % 2 == 0) {\n        *out = 0;\n        return;\n      }\n    } else {                          /* indice dispari: il valore deve essere pari */\n      if (A[i] % 2 != 0) {\n        *out = 0;\n        return;\n      }\n    }\n  }\n}","explain":"Distingui indice pari/dispari con i % 2 e controlla la parità del valore. Attenzione ai negativi: in C -3 % 2 vale -1 (non 1), quindi per riconoscere un dispari usa \"% 2 != 0\" e non \"% 2 == 1\".","hints":["Dentro il ciclo distingui i % 2 == 0 (indice pari) dal caso contrario.","Per i negativi: -3 % 2 vale -1 in C. Controlla \"!= 0\"."],"pitfalls":["Testare \"% 2 == 1\" (fallisce con i negativi)","Scambiare indice e valore","Dimenticare che 0 è pari"],"topics":["c-puntatori","c-array","c-modulo"],"prof":false,"eso":1,"prelude":"","tests":[{"n":1,"code":"int A[] = {1, 2, 3, 4};\nint result = -1;\ntest(A, 4, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["vero"]},{"n":2,"code":"int A[] = {1, 2, 3, 5};\nint result = -1;\ntest(A, 4, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["ultimo sbagliato"]},{"n":3,"code":"int A[] = {1};\nint result = -1;\ntest(A, 1, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["un elemento dispari"]},{"n":4,"code":"int A[] = {2};\nint result = -1;\ntest(A, 1, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["un elemento pari"]},{"n":5,"code":"int A[] = {0};\nint result = -1;\ntest(A, 1, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["zero in indice pari"]},{"n":6,"code":"int A[] = {3, 0};\nint result = -1;\ntest(A, 2, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["zero in indice dispari"]},{"n":7,"code":"int A[] = {1, 0, 1, 0, 1};\nint result = -1;\ntest(A, 5, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[4] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["lungo vero"]},{"n":8,"code":"int A[] = {1, 2, 3, 4, 6};\nint result = -1;\ntest(A, 5, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 4 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[4] != 6 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["sbagliato all'indice 4"]},{"n":9,"code":"int A[] = {-1, -2, -3};\nint result = -1;\ntest(A, 3, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != -1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != -2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != -3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["negativi"]},{"n":10,"code":"int A[1] = {0};   /* array vuoto: len = 0 */\nint result = -1;\ntest(A, 0, &result);\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["array vuoto"]},{"n":11,"code":"int A[] = {2, 1};\nint result = -1;\ntest(A, 2, &result);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["invertito"]}]},{"id":"a-tre-consecutivi","title":"Almeno tre occorrenze consecutive di val","group":"array","kind":"A_val_ret","statement":"Scrivi la funzione in linguaggio C int test(int* A, int len, int val) che accetta in input un array A di interi, la sua lunghezza \"len\" e un intero \"val\". La funzione ritorna 1 (true) se esistono almeno tre occorrenze consecutive di \"val\" nell'array A. Altrimenti, la funzione ritorna 0 (false).","fn":"int test(int* A, int len, int val)","starter":"/* Scrivi la funzione in linguaggio C int test(int* A, int len, int val)\n   che accetta in input un array A di interi, la sua lunghezza \"len\" e un\n   intero \"val\". La funzione ritorna 1 (true) se esistono almeno tre\n   occorrenze consecutive di \"val\" nell'array A. Altrimenti, la funzione\n   ritorna 0 (false). */\n\nint test(int* A, int len, int val){\n\n\n\n\n\n\n}\n","solution":"int test(int* A, int len, int val){\n  int i;\n  for (i = 0; i + 2 < len; i++) {        /* i+2 deve essere un indice valido */\n    if (A[i] == val && A[i+1] == val && A[i+2] == val)\n      return 1;\n  }\n  return 0;\n}","solutionFull":"int test(int* A, int len, int val){\n  int i;\n  for (i = 0; i + 2 < len; i++) {        /* i+2 deve essere un indice valido */\n    if (A[i] == val && A[i+1] == val && A[i+2] == val)\n      return 1;\n  }\n  return 0;\n}","explain":"Controlla ogni terna A[i], A[i+1], A[i+2]. Per non leggere fuori dall'array il ciclo deve fermarsi quando i+2 raggiunge len (i + 2 < len, oppure i < len - 2).","hints":["Guarda tre celle per volta: A[i], A[i+1], A[i+2].","Il ciclo non deve far leggere oltre la fine dell'array."],"pitfalls":["Ciclo fino a len (legge A[len] e A[len+1])","Contare le occorrenze totali invece di quelle consecutive"],"topics":["c-array","c-casi-limite"],"prof":false,"eso":1,"prelude":"","tests":[{"n":1,"code":"int A[] = {1, 1, 1};\nint result = test(A, 3, 1);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["esattamente tre"]},{"n":2,"code":"int A[] = {1, 1};\nint result = test(A, 2, 1);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["solo due"]},{"n":3,"code":"int A[] = {2, 1, 1, 1, 3};\nint result = test(A, 5, 1);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[4] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["in mezzo"]},{"n":4,"code":"int A[] = {1, 1, 2, 1};\nint result = test(A, 4, 1);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["interrotte"]},{"n":5,"code":"int A[] = {5, 5, 5, 5};\nint result = test(A, 4, 5);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["quattro"]},{"n":6,"code":"int A[1] = {0};   /* array vuoto: len = 0 */\nint result = test(A, 0, 1);\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["array vuoto"]},{"n":7,"code":"int A[] = {1, 1, 2, 1, 1, 1};\nint result = test(A, 6, 1);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[4] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[5] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["terna in fondo"]},{"n":8,"code":"int A[] = {3, 3, 3};\nint result = test(A, 3, 4);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["valore diverso"]},{"n":9,"code":"int A[] = {0, 0, 0};\nint result = test(A, 3, 0);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"1\n","tags":["zero"]},{"n":10,"code":"int A[] = {1, 1, 2, 1, 1};\nint result = test(A, 5, 1);\n/* controllo che non abbia modificato l'array di input */\nif( A[0] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[4] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", result);","expected":"0\n","tags":["due coppie separate"]}]},{"id":"a-trasla-sinistra","title":"Traslazione a sinistra di una posizione","group":"array","kind":"A_inplace","statement":"Scrivi la funzione in linguaggio C void test(int* A, int len) che accetta in input un array di interi A, la sua dimensione \"len\". La funzione trasla di una posizione verso sinistra tutti gli elementi di A, assegnando all'ultimo elemento il valore dell'elemento che era il primo prima della traslazione.","fn":"void test(int* A, int len)","starter":"/* Scrivi la funzione in linguaggio C void test(int* A, int len) che\n   accetta in input un array di interi A, la sua dimensione \"len\". La\n   funzione trasla di una posizione verso sinistra tutti gli elementi di A,\n   assegnando all'ultimo elemento il valore dell'elemento che era il primo\n   prima della traslazione. */\n\nvoid test(int* A, int len){\n\n\n\n\n\n\n}\n","solution":"void test(int* A, int len){\n  int i, primo;\n  if (len == 0)\n    return;\n  primo = A[0];                 /* salvo il primo: verrebbe sovrascritto */\n  for (i = 0; i < len - 1; i++)\n    A[i] = A[i + 1];            /* ogni elemento prende il valore del successivo */\n  A[len - 1] = primo;\n}","solutionFull":"void test(int* A, int len){\n  int i, primo;\n  if (len == 0)\n    return;\n  primo = A[0];                 /* salvo il primo: verrebbe sovrascritto */\n  for (i = 0; i < len - 1; i++)\n    A[i] = A[i + 1];            /* ogni elemento prende il valore del successivo */\n  A[len - 1] = primo;\n}","explain":"Salva il primo elemento in una variabile, poi copia A[i+1] in A[i] andando da sinistra a destra (così non sovrascrivi valori che ti servono ancora) e infine metti il valore salvato in ultima posizione.","hints":["Prima di spostare tutto salva A[0] in una variabile.","Il ciclo va da 0 a len-2 e copia A[i+1] in A[i].","Alla fine A[len-1] riceve il valore salvato."],"pitfalls":["Ciclare all'indietro (si sovrascrivono i valori)","Dimenticare di salvare A[0]","Leggere A[len] nell'ultimo passo"],"topics":["c-array","c-casi-limite"],"prof":false,"eso":1,"prelude":"","tests":[{"n":1,"code":"int A[] = {1, 2, 3};\ntest(A,3);\n/* controllo che abbia modificato l'array */\nif( A[0] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", 1);","expected":"1\n","tags":["tipico"]},{"n":2,"code":"int A[] = {10, 2, 30};\ntest(A,3);\n/* controllo che abbia modificato l'array */\nif( A[0] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 30 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 10 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", 1);","expected":"1\n","tags":["tipico"]},{"n":3,"code":"int A[] = {10, 10, 1010, 101};\ntest(A,4);\n/* controllo che abbia modificato l'array */\nif( A[0] != 10 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1010 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 101 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 10 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", 1);","expected":"1\n","tags":["ripetuti"]},{"n":4,"code":"int A[] = {3, 30, 10, 0};\ntest(A,4);\n/* controllo che abbia modificato l'array */\nif( A[0] != 30 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 10 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", 1);","expected":"1\n","tags":["con zero"]},{"n":5,"code":"int A[] = {5, 3, 2, 1};\ntest(A,4);\n/* controllo che abbia modificato l'array */\nif( A[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 5 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", 1);","expected":"1\n","tags":["decrescente"]},{"n":6,"code":"int A[] = {0, 0, 0, 0, 10, 7};\ntest(A,6);\n/* controllo che abbia modificato l'array */\nif( A[0] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 10 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[4] != 7 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[5] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", 1);","expected":"1\n","tags":["molti zeri"]},{"n":7,"code":"int A[] = {0, 3, 1, -1};\ntest(A,4);\n/* controllo che abbia modificato l'array */\nif( A[0] != 3 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[2] != -1 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[3] != 0 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", 1);","expected":"1\n","tags":["negativi"]},{"n":8,"code":"int A[] = {7};\ntest(A,1);\n/* controllo che abbia modificato l'array */\nif( A[0] != 7 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", 1);","expected":"1\n","tags":["un elemento"]},{"n":9,"code":"int A[] = {1, 2};\ntest(A,2);\n/* controllo che abbia modificato l'array */\nif( A[0] != 2 ) printf(\"Hai modificato l'array di input\\n\");\nif( A[1] != 1 ) printf(\"Hai modificato l'array di input\\n\");\nprintf(\"%d\\n\", 1);","expected":"1\n","tags":["due elementi"]},{"n":10,"code":"int A[1] = {0};   /* array vuoto: len = 0 */\ntest(A,0);\n/* controllo che abbia modificato l'array */\nprintf(\"%d\\n\", 1);","expected":"1\n","tags":["array vuoto (non leggere A[0])"]}]},{"id":"l-somma-minore-lunghezza","title":"Somma degli elementi minore della lunghezza","group":"lista","kind":"L_ret","statement":"Scrivi il codice in linguaggio C della funzione int test(plist p) che verifica che la somma degli elementi contenuti in una lista doppiamente concatenata di interi \"p\" sia strettamente minore della sua lunghezza. Se la lista è vuota la funzione ritorna 0 (cioè false).","fn":"int test(plist p)","starter":"#include <stdio.h>  /* ora puoi usare NULL */\n\n/* scrivi qui la definizione del tipo \"elist\" (elemento della lista)\n   che e' una struttura con i campi \"info\" (intero), \"prev\" (puntatore\n   all'elemento precedente) e \"next\" (puntatore al prossimo elemento). */\n\ntypedef struct elem {\n      ...\n      ...\n    } elist;\n\n/* scrivi qui la definizione del tipo \"plist\" che e' un riferimento\n   ad un oggetto di tipo \"elist\" */\n\ntypedef ...  plist;\n\n/* Scrivi qui eventuali funzioni di appoggio. */\n\n\n/* Scrivi il codice in linguaggio C della funzione int test(plist p) che\n   verifica che la somma degli elementi contenuti in una lista doppiamente\n   concatenata di interi \"p\" sia strettamente minore della sua lunghezza.\n   Se la lista è vuota la funzione ritorna 0 (cioè false). */\n\nint test(plist p){\n\n}\n","solution":"int test(plist p){\n  int somma = 0, lunghezza = 0;\n  if (p == NULL)                  /* lista vuota */\n    return 0;\n  while (p != NULL) {\n    somma = somma + p->info;\n    lunghezza++;\n    p = p->next;\n  }\n  return somma < lunghezza;\n}","solutionFull":"typedef struct elem {\n  int info;\n  struct elem* prev;\n  struct elem* next;\n} elist;\n\ntypedef elist* plist;\n\nint test(plist p){\n  int somma = 0, lunghezza = 0;\n  if (p == NULL)                  /* lista vuota */\n    return 0;\n  while (p != NULL) {\n    somma = somma + p->info;\n    lunghezza++;\n    p = p->next;\n  }\n  return somma < lunghezza;\n}","explain":"Una sola scansione della lista (while p != NULL) che accumula somma e lunghezza; solo alla fine confronti. La lista vuota (p == NULL) va gestita a parte perché il testo vuole 0. p è passato per valore: puoi usarlo come cursore senza rovinare la lista del chiamante.","hints":["Scorri con while (p != NULL) { ...; p = p->next; }.","Calcola somma e lunghezza nello stesso ciclo, confronta alla fine.","Gestisci p == NULL prima del ciclo."],"pitfalls":["Confrontare dentro il ciclo","Dimenticare p = p->next (ciclo infinito)","Usare <= invece di <"],"topics":["c-liste","c-casi-limite"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[]\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {0};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[0]\n","tags":["un elemento a zero"]},{"n":3,"code":"int v[] = {1};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[1]\n","tags":["somma = lunghezza"]},{"n":4,"code":"int v[] = {1, 0, 0};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[1 0 0]\n","tags":["tipico vero"]},{"n":5,"code":"int v[] = {5, 5};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[5 5]\n","tags":["tipico falso"]},{"n":6,"code":"int v[] = {-3, -4};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[-3 -4]\n","tags":["negativi"]},{"n":7,"code":"int v[] = {1, 1, 1};\nplist p = L_make(v, 3);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[1 1 1]\n","tags":["uguale (non basta)"]},{"n":8,"code":"int v[] = {2, -5, 1, 1};\nplist p = L_make(v, 4);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[2 -5 1 1]\n","tags":["somma negativa"]},{"n":9,"code":"int v[] = {3, 0, 0, 0};\nplist p = L_make(v, 4);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[3 0 0 0]\n","tags":["bordo vero"]},{"n":10,"code":"int v[] = {4, 0, 0, 0};\nplist p = L_make(v, 4);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[4 0 0 0]\n","tags":["bordo falso"]}]},{"id":"l-tutti-uguali-lunghezza","title":"Tutti gli elementi uguali alla lunghezza","group":"lista","kind":"L_ret","statement":"Scrivi il codice in linguaggio C della funzione int test(plist p) che verifica che una lista doppiamente concatenata di interi \"p\" contenga tutti elementi uguali alla sua lunghezza. Se la lista è vuota la funzione ritorna 0 (cioè false).","fn":"int test(plist p)","starter":"#include <stdio.h>  /* ora puoi usare NULL */\n\n/* scrivi qui la definizione del tipo \"elist\" (elemento della lista)\n   che e' una struttura con i campi \"info\" (intero), \"prev\" (puntatore\n   all'elemento precedente) e \"next\" (puntatore al prossimo elemento). */\n\ntypedef struct elem {\n      ...\n      ...\n    } elist;\n\n/* scrivi qui la definizione del tipo \"plist\" che e' un riferimento\n   ad un oggetto di tipo \"elist\" */\n\ntypedef ...  plist;\n\n/* Scrivi qui eventuali funzioni di appoggio. */\n\n\n/* Scrivi il codice in linguaggio C della funzione int test(plist p) che\n   verifica che una lista doppiamente concatenata di interi \"p\" contenga\n   tutti elementi uguali alla sua lunghezza. Se la lista è vuota la\n   funzione ritorna 0 (cioè false). */\n\nint test(plist p){\n\n}\n","solution":"int test(plist p){\n  int lunghezza = 0;\n  elist* c;\n  if (p == NULL)\n    return 0;\n  for (c = p; c != NULL; c = c->next)     /* prima scansione: calcolo la lunghezza */\n    lunghezza++;\n  for (c = p; c != NULL; c = c->next)     /* seconda scansione: confronto */\n    if (c->info != lunghezza)\n      return 0;\n  return 1;\n}","solutionFull":"typedef struct elem {\n  int info;\n  struct elem* prev;\n  struct elem* next;\n} elist;\n\ntypedef elist* plist;\n\nint test(plist p){\n  int lunghezza = 0;\n  elist* c;\n  if (p == NULL)\n    return 0;\n  for (c = p; c != NULL; c = c->next)     /* prima scansione: calcolo la lunghezza */\n    lunghezza++;\n  for (c = p; c != NULL; c = c->next)     /* seconda scansione: confronto */\n    if (c->info != lunghezza)\n      return 0;\n  return 1;\n}","explain":"Serve conoscere la lunghezza PRIMA di confrontare: due scansioni, la prima conta gli elementi, la seconda verifica che ognuno valga la lunghezza. Non puoi confrontare con un contatore che sta ancora crescendo.","hints":["Prima scansione: conta gli elementi.","Seconda scansione: confronta ogni info con la lunghezza."],"pitfalls":["Confrontare con un contatore parziale","Non gestire la lista vuota"],"topics":["c-liste","c-casi-limite"],"prof":false,"eso":1,"prelude":"/* ===== funzioni di supporto dei test (non fanno parte della tua soluzione) ===== */\nplist L_make(int* v, int n) {      /* costruisce la lista doppiamente concatenata <v[0], ..., v[n-1]> */\n  plist head = NULL, last = NULL;\n  int i;\n  for (i = 0; i < n; i++) {\n    elist* e = (elist*) malloc(sizeof(elist));\n    e->info = v[i];\n    e->prev = last;\n    e->next = NULL;\n    if (last != NULL) last->next = e; else head = e;\n    last = e;\n  }\n  return head;\n}\n\nvoid L_print(plist p) {            /* stampa la lista e controlla che prev e next siano coerenti */\n  elist* prev = NULL;\n  int ok = 1, n = 0;\n  printf(\"[\");\n  while (p != NULL && n < 1000) {\n    if (n > 0) printf(\" \");\n    printf(\"%d\", p->info);\n    if (p->prev != prev) ok = 0;\n    prev = p;\n    p = p->next;\n    n++;\n  }\n  printf(\"]\\n\");\n  if (n >= 1000) printf(\"ERRORE: la lista sembra circolare\\n\");\n  if (!ok) printf(\"ERRORE: i puntatori prev non sono coerenti con i puntatori next\\n\");\n}\n","tests":[{"n":1,"code":"plist p = NULL;\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[]\n","tags":["lista vuota"]},{"n":2,"code":"int v[] = {1};\nplist p = L_make(v, 1);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[1]\n","tags":["un elemento vero"]},{"n":3,"code":"int v[] = {2, 2};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"1\n[2 2]\n","tags":["vero"]},{"n":4,"code":"int v[] = {2, 3};\nplist p = L_make(v, 2);\nprintf(\"%d\\n\", test(p));\nL_print(p);   /* la lista non deve essere stata modificata */","expected":"0\n[2 3
