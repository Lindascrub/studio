    O: (g) => `gli algoritmi che crescono al più come ${g}`,
    Omega: (g) => `gli algoritmi che crescono almeno come ${g}`,
    Theta: (g) => `gli algoritmi che crescono esattamente come ${g}`,
    o: (g) => `gli algoritmi che crescono strettamente meno di ${g}`,
  };

  /* ------------------------------------------------------------------ figura */
  function figure(spec, truth, wit) {
    const cls = spec.k === 'all' ? [spec.from, spec.to] : spec.k === 'subset' ? [spec.sub, spec.sup] : (spec.k === 'may' || spec.k === 'cannot') ? [spec.a, spec.b]
      : (spec.k === 'allalgos' || spec.k === 'somenot') ? [T.C('Omega', ONE), spec.cls] : null;
    if (!cls) return '';
    const ticks = [ONE, ...['log n', 'n', 'n log n', 'n^2', 'n^3', '2^n', 'n!'].map(T.parseG)];
    cls.forEach((c) => { if (!ticks.some((t) => cmp(t, c.g) === 0)) ticks.push(c.g); });
    ticks.sort(cmp);
    const W = 560, L = 34, R = 34, n = ticks.length;
    const step = (W - L - R) / (n - 1);
    const xOf = (g) => { if (cmp(g, INF) === 0) return W - 10; const i = ticks.findIndex((t) => cmp(t, g) === 0); return L + i * step; };
    const rows = [{ y: 40, cls: cls[0], k: 'x' }, { y: 78, cls: cls[1], k: 'y' }];
    let svg = `<svg class="fig" viewBox="0 0 ${W} 142" role="img" aria-label="${esc(describe(cls))}" xmlns="http://www.w3.org/2000/svg"><title>${esc(describe(cls))}</title>`;
    const axisY = 112;
    svg += `<line class="fig-axis" x1="${L - 12}" y1="${axisY}" x2="${W - 6}" y2="${axisY}"/>`;
    ticks.forEach((t) => { const x = xOf(t); svg += `<line class="fig-tick" x1="${x}" y1="${axisY - 4}" x2="${x}" y2="${axisY + 4}"/><text class="fig-lbl" x="${x}" y="${axisY + 19}" text-anchor="middle">${esc(fmtG(t))}</text>`; });
    rows.forEach((r) => {
      const I = interval(r.cls), x1 = xOf(I.lo), x2 = xOf(I.hi), inf = cmp(I.hi, INF) === 0;
      svg += `<text class="fig-name fig-${r.k}t" x="${Math.min(x1, W - 120)}" y="${r.y - 12}">${esc(F(r.cls))}</text>`;
      if (T.isEmpty(I)) { svg += `<text class="fig-lbl" x="${x1}" y="${r.y + 9}">(insieme vuoto)</text>`; return; }
      svg += `<rect class="fig-bar fig-${r.k}" x="${x1}" y="${r.y - 6}" width="${Math.max(2, x2 - x1)}" height="12" rx="6"/>`;
      if (inf) svg += `<path class="fig-${r.k}" d="M${W - 12} ${r.y - 9} L${W - 2} ${r.y} L${W - 12} ${r.y + 9} Z"/>`;
      // estremi: pieno = incluso, vuoto = escluso
      svg += `<circle class="fig-end ${I.loIn ? 'in fig-' + r.k : 'out fig-' + r.k + 's'}" cx="${x1}" cy="${r.y}" r="6"/>`;
      if (!inf) svg += `<circle class="fig-end ${I.hiIn ? 'in fig-' + r.k : 'out fig-' + r.k + 's'}" cx="${x2}" cy="${r.y}" r="6"/>`;
      // guide verticali verso l'asse
      svg += `<line class="fig-guide" x1="${x1}" y1="${r.y + 8}" x2="${x1}" y2="${axisY}"/>`;
      if (!inf) svg += `<line class="fig-guide" x1="${x2}" y1="${r.y + 8}" x2="${x2}" y2="${axisY}"/>`;
    });
    if (wit) {
      const x = xOf(NICE.some((t) => cmp(t, wit.t) === 0) || ticks.some((t) => cmp(t, wit.t) === 0) ? (ticks.find((t) => cmp(t, wit.t) === 0) || wit.t) : wit.t);
      const hasTick = ticks.some((t) => cmp(t, wit.t) === 0);
      if (hasTick) {
        const y = wit.row === 'x' ? rows[0].y : rows[1].y;
        svg += `<g class="fig-mark ${wit.good ? 'good' : 'bad'}"><circle cx="${x}" cy="${y}" r="9"/><text x="${x}" y="${y + 4}" text-anchor="middle">${wit.good ? '✓' : '✕'}</text></g>`;
      }
    }
    return svg + '</svg>';
  }
  function describe(cls) {
    const d = (c) => { const I = interval(c); return `${F(c)} copre le crescite da ${fmtG(I.lo)}${I.loIn ? ' (incluso)' : ' (escluso)'} a ${cmp(I.hi, INF) === 0 ? 'infinito' : fmtG(I.hi) + (I.hiIn ? ' (incluso)' : ' (escluso)')}`; };
    return 'Scala delle crescite. ' + d(cls[0]) + '. ' + d(cls[1]) + '.';
  }

  /* ------------------------------------------------------------------ spiegazioni */
  const RULE = {
    base: '<b>Regola d’oro</b>: O ≈ «≤», Ω ≈ «≥», Θ ≈ «=», o ≈ «&lt;». «Sempre» = per <u>ogni</u> algoritmo della classe; «potrebbe» = ne esiste <u>almeno uno</u>.',
    floor: '<b>Pavimento</b>: ogni algoritmo esegue almeno un’operazione, quindi T(n) ≥ 1 e <u>ogni</u> algoritmo sta in Ω(1) (e in Ω(5), Ω(100)… sono la stessa classe).',
    const: '<b>Costanti</b>: nelle notazioni asintotiche i fattori costanti non contano: Θ(2n) = Θ(n) = Θ(100n).',
  };

  function reasonAll(X, Y, truth, ctxName) {
    const c1 = X.c, c2 = Y.c, g1 = fmtG(X.g), g2 = fmtG(Y.g), r = cmp(X.g, Y.g);
    const w = truth ? null : witnessIn(X, Y);
    const wt = w ? fT(w) : '';
    const sameClass = r === 0 && c1 === c2;
    const key = c1 + '>' + c2;
    if (sameClass) return truth ? `Sono la stessa classe: ${F(X)} ⊆ ${F(Y)} (le costanti moltiplicative non contano).` : '';
    switch (key) {
      case 'O>O':
        return truth ? (r === 0 ? `${g1} e ${g2} hanno lo stesso ordine di grandezza (cambiano solo le costanti): le classi coincidono.`
          : `Se T cresce al più come ${g1} e ${g1} cresce meno di ${g2}, allora T cresce al più come ${g2}: O(${g1}) sta <b>dentro</b> O(${g2}) (proprietà transitiva, slide 040 p.24).`)
          : `${g1} cresce <b>più</b> di ${g2}. Controesempio: ${wt} sta in ${F(X)} ma <b>non</b> in ${F(Y)}.`;
      case 'Omega>Omega':
        return truth ? (r === 0 ? `${g1} e ${g2} hanno lo stesso ordine di grandezza (cambiano solo le costanti): le classi coincidono.`
          : `Se T cresce almeno come ${g1} e ${g1} cresce più di ${g2}, allora T cresce almeno come ${g2}: Ω(${g1}) sta <b>dentro</b> Ω(${g2}).`)
          : `${g1} cresce <b>meno</b> di ${g2}. Controesempio: ${wt} sta in ${F(X)} ma <b>non</b> in ${F(Y)} (non cresce abbastanza).`;
      case 'Theta>Theta':
        return truth ? `${g1} e ${g2} hanno lo stesso ordine di grandezza: ${F(X)} e ${F(Y)} sono la <b>stessa</b> classe.`
          : `Θ è una relazione di equivalenza (slide 040 p.45): classi Θ diverse sono <b>disgiunte</b>. ${wt} sta in ${F(X)} ma non in ${F(Y)}.`;
      case 'O>Omega':
        return truth ? `Ogni algoritmo esegue almeno un’operazione, cioè T(n) ≥ 1: quindi sta sempre in Ω(1) (qualunque costante). Ecco perché da O(…) si arriva sempre a ${F(Y)}.`
          : `O è <b>solo</b> un limite superiore: dice «non cresce più di ${g1}», non «cresce almeno ${g2}». Controesempio: ${wt} sta in ${F(X)} ma <b>non</b> in ${F(Y)}.`;
      case 'Omega>O':
        return `Ω è <b>solo</b> un limite inferiore e non pone alcun tetto alla crescita. Controesempio: ${wt} sta in ${F(X)} ma <b>non</b> in ${F(Y)} (cresce troppo).`;
      case 'O>Theta':
        return truth ? `T è limitato da una costante e vale almeno 1: quindi T ∈ Θ(1).`
          : `Θ richiede limite superiore <b>e</b> inferiore, O dà solo il superiore. Controesempio: ${wt} sta in ${F(X)} ma <b>non</b> in ${F(Y)}.`;
      case 'Omega>Theta':
        return `Ω dà solo il limite inferiore, Θ ne richiede due. Controesempio: ${wt} sta in ${F(X)} ma <b>non</b> in ${F(Y)}.`;
      case 'Theta>O':
        return truth ? `Θ(${g1}) = O(${g1}) ∩ Ω(${g1}) ⊆ O(${g1}), e O(${g1}) ⊆ O(${g2}) perché ${g1} cresce al più come ${g2}. (Gerarchia delle classi, slide 040 p.46–47.)`
          : `T ∈ Θ(${g1}) cresce <b>esattamente</b> come ${g1}, che cresce più di ${g2}: ${wt} sta in ${F(X)} ma non in ${F(Y)}.`;
      case 'Theta>Omega':
        return truth ? `Θ(${g1}) = O(${g1}) ∩ Ω(${g1}) ⊆ Ω(${g1}), e Ω(${g1}) ⊆ Ω(${g2}) perché ${g1} cresce almeno come ${g2}. (Gerarchia delle classi, slide 040 p.46–47.)`
          : `T ∈ Θ(${g1}) cresce <b>esattamente</b> come ${g1}, che cresce meno di ${g2}: ${wt} sta in ${F(X)} ma non in ${F(Y)}.`;
      case 'Theta>o':
        return truth ? `T ∈ Θ(${g1}) cresce come ${g1}, e ${g1} cresce <b>strettamente</b> meno di ${g2}: il rapporto T/${g2} tende a 0, cioè T ∈ o(${g2}).`
          : `o è «strettamente più lento»: ${g1} ${r === 0 ? 'cresce come' : 'cresce più di'} ${g2}. ${wt} sta in ${F(X)} ma non in ${F(Y)}.`;
      case 'O>o':
        return truth ? `T cresce al più come ${g1}, e ${g1} cresce <b>strettamente</b> meno di ${g2}: T/${g2} → 0, cioè T ∈ o(${g2}).`
          : (r === 0 ? `O(${g1}) contiene anche le funzioni che crescono <b>esattamente</b> come ${g1} (es. ${wt}), che non sono «strettamente più lente» di ${g2}: stanno in O ma non in o.`
            : `${g1} cresce più di ${g2}: ${wt} sta in ${F(X)} ma non in ${F(Y)}.`);
      case 'Omega>o':
        return `Ω non pone un tetto alla crescita. Controesempio: ${wt} sta in ${F(X)} ma non in ${F(Y)}.`;
      case 'o>O':
        return truth ? `o(${g1}) ⊆ O(${g1}) (strettamente più lento implica «al più»), e O(${g1}) ⊆ O(${g2}) perché ${g1} cresce al più come ${g2}.`
          : `o(${g1}) contiene funzioni che crescono quasi come ${g1}, più di ${g2}. Controesempio: ${wt} sta in ${F(X)} ma non in ${F(Y)}.`;
      case 'o>Omega':
        return truth ? `Ogni algoritmo esegue almeno un’operazione (T(n) ≥ 1), quindi sta sempre in Ω(1).` : `o(${g1}) contiene anche funzioni che crescono pochissimo (es. ${wt}), che non sono Ω(${g2}).`;
      case 'o>Theta':
        return `o(${g1}) comprende funzioni di crescita molto diversa tra loro; non possono stare tutte in una sola classe Θ. Controesempio: ${wt} sta in ${F(X)} ma non in ${F(Y)}.`;
      case 'o>o':
        return truth ? (r === 0 ? 'Stessa classe.' : `Se T cresce strettamente meno di ${g1}, e ${g1} cresce al più come ${g2}, allora T cresce strettamente meno di ${g2}.`)
          : `${g1} cresce più di ${g2}: ${wt} sta in ${F(X)} ma non in ${F(Y)}.`;
      default: return truth ? 'Ogni funzione della prima classe sta anche nella seconda.' : `Controesempio: ${wt}.`;
    }
  }

  function reasonMay(X, Y, truth) {
    const g1 = fmtG(X.g), g2 = fmtG(Y.g), r = cmp(X.g, Y.g);
    if (truth) {
      const w = witnessBoth(X, Y);
      return `Sì, esistono: per esempio un algoritmo con ${fT(w)} sta <b>sia</b> in ${F(X)} <b>sia</b> in ${F(Y)}. Nella figura i due intervalli si <b>sovrappongono</b>.`;
    }
    const key = X.c + '&' + Y.c;
    switch (key) {
      case 'Omega&O': case 'O&Omega': {
        const [lo, hi] = X.c === 'Omega' ? [X, Y] : [Y, X];
        return `Per stare in ${F(lo)} deve crescere <b>almeno</b> come ${fmtG(lo.g)}, per stare in ${F(hi)} <b>al più</b> come ${fmtG(hi.g)}. Ma ${fmtG(lo.g)} cresce <b>più</b> di ${fmtG(hi.g)}: i due requisiti sono incompatibili, gli intervalli non si toccano.`;
      }
      case 'Theta&Theta': return `Θ è una relazione di equivalenza: classi Θ diverse non hanno elementi in comune (slide 040 p.45).`;
      case 'Theta&O': case 'O&Theta': {
        const [th, o] = X.c === 'Theta' ? [X, Y] : [Y, X];
        return `Un algoritmo in ${F(th)} cresce <b>esattamente</b> come ${fmtG(th.g)}, che cresce più di ${fmtG(o.g)}: non può rispettare il tetto O(${fmtG(o.g)}).`;
      }
      case 'Theta&Omega': case 'Omega&Theta': {
        const [th, om] = X.c === 'Theta' ? [X, Y] : [Y, X];
        return `Un algoritmo in ${F(th)} cresce <b>esattamente</b> come ${fmtG(th.g)}, che cresce meno di ${fmtG(om.g)}: non può rispettare il minimo Ω(${fmtG(om.g)}).`;
      }
      default: return `Le due classi non hanno nessuna funzione in comune (vedi figura: gli intervalli non si sovrappongono).`;
    }
  }

  function explain(spec, truth, opts) {
    opts = opts || {};
    let reason = '', fig = '', rule = RULE.base, hdr = '';
    switch (spec.k) {
      case 'all': case 'subset': {
        const X = spec.k === 'all' ? spec.from : spec.sub, Y = spec.k === 'all' ? spec.to : spec.sup;
        hdr = `${F(X)} = ${SET[X.c](fmtG(X.g))}. ${F(Y)} = ${SET[Y.c](fmtG(Y.g))}.`;
        reason = reasonAll(X, Y, truth);
        if (spec.k === 'subset' && spec.dir === 'contains') reason = `«${F(Y)} contiene ${F(X)}» significa ${F(X)} ⊆ ${F(Y)}. ` + reason;
        const w = truth ? null : witnessIn(X, Y);
        fig = figure(spec, truth, w ? { t: w, row: 'x', good: false } : null);
        if (Y.c === 'Omega' && cmp(Y.g, ONE) === 0) rule = RULE.floor;
        else if (X.g && Y.g && cmp(X.g, Y.g) === 0 && X.c === Y.c) rule = RULE.const;
        break;
      }
      case 'may': case 'cannot': {
        const X = spec.a, Y = spec.b;
        const inter = T.intersects(interval(X), interval(Y));
        hdr = `${F(X)} = ${SET[X.c](fmtG(X.g))}. ${F(Y)} = ${SET[Y.c](fmtG(Y.g))}.`;
        reason = (spec.k === 'cannot' ? (inter ? 'Può, eccome. ' : 'Infatti non può. ') : '') + reasonMay(X, Y, inter);
        const w = inter ? witnessBoth(X, Y) : null;
        fig = figure(spec, truth, w ? { t: w, row: 'y', good: true } : null);
        rule = RULE.base;
        break;
      }
      case 'fn': {
        const d = T.dominantOf(spec.f), g = fmtG(d);
        const f = spec.f.replace(/\^(\d)/g, (m, k) => T.SUP[k]);
        hdr = `T(n) = ${f}`;
        reason = `Per la regola della somma conta solo il termine che cresce di più (slide 040 p.23–27): il termine dominante di ${f} è <b>${g}</b>, quindi T(n) ∈ Θ(${g}). ` +
          (spec.cls.c === 'O' ? `T ∈ ${F(spec.cls)} ⇔ ${g} cresce al più come ${fmtG(spec.cls.g)}: ${truth ? 'sì' : 'no'}.`
            : spec.cls.c === 'Omega' ? `T ∈ ${F(spec.cls)} ⇔ ${g} cresce almeno come ${fmtG(spec.cls.g)}: ${truth ? 'sì' : 'no'}.`
              : spec.cls.c === 'Theta' ? `T ∈ ${F(spec.cls)} ⇔ ${g} e ${fmtG(spec.cls.g)} hanno lo stesso ordine: ${truth ? 'sì' : 'no'}. ${truth ? '' : 'Togliere o sommare termini di ordine inferiore (o fattori costanti) non cambia l’ordine, ma un termine più grande sì.'}`
                : `T ∈ ${F(spec.cls)} ⇔ ${g} cresce strettamente meno di ${fmtG(spec.cls.g)}: ${truth ? 'sì' : 'no'}.`);
        rule = '<b>Termine dominante</b>: in una somma/differenza di potenze vince l’esponente più alto; i coefficienti e i termini più piccoli sono irrilevanti (n³ − n² ∈ Θ(n³), non Θ(n²)).';
        break;
      }
      case 'algo': {
        const a = T.ALGOS[spec.algo], g = fmtG(T.parseG(a.g));
        hdr = `${a.name}: nel caso peggiore Θ(${g}).`;
        reason = `${a.note} Quindi la complessità del caso peggiore è Θ(${g}) e la domanda è se Θ(${g}) ⊆ ${F(spec.cls)}: ${truth ? 'sì' : 'no'}` +
          (truth ? ` (${g} ${spec.cls.c === 'O' ? 'cresce al più come' : spec.cls.c === 'Omega' ? 'cresce almeno come' : spec.cls.c === 'Theta' ? 'ha lo stesso ordine di' : 'cresce strettamente meno di'} ${fmtG(spec.cls.g)}).` : '.') +
          (spec.cls.c === 'o' && !truth ? ' Attenzione: o(g) significa «strettamente più lento di g»: una funzione Θ(g) <b>non</b> è mai in o(g).' : '');
        rule = '<b>Da sapere a memoria</b>: Selection Θ(n²) sempre · Insertion Θ(n²) peggiore, Θ(n) migliore · Merge Θ(n log n) sempre · Exhaustive Θ(n·n!).';
        break;
      }
      case 'pseudo': {
        const g = fmtG(T.parseG(spec.g || T.PSEUDO[spec.id].g));
        hdr = `Il programma ha complessità Θ(${g}) nel caso peggiore.`;
        reason = (opts.analysis || '') + ` Quindi: Θ(${g}) ⊆ ${F(spec.cls)}? ${truth ? 'Sì' : 'No'}.`;
        rule = '<b>Cicli annidati</b>: si moltiplicano le iterazioni (n · n = n²); cicli in sequenza si sommano (n + n = Θ(n)). Slide 050 p.31–33.';
        break;
      }
      case 'allalgos': case 'somenot': {
        hdr = `Ogni algoritmo esegue almeno un’operazione: T(n) ≥ 1.`;
        const inOm1 = T.subset(interval(T.C('Omega', ONE)), interval(spec.cls));
        reason = spec.cls.c === 'Omega' && cmp(spec.cls.g, ONE) === 0
          ? `${F(spec.cls)} è la stessa classe di Ω(1) (una costante è una costante): ogni algoritmo esegue almeno un’operazione, quindi T(n) ≥ 1 ∈ Ω(1). ${spec.k === 'allalgos' ? 'Tutti gli algoritmi vi appartengono.' : 'Non esistono algoritmi fuori da Ω(1).'}`
          : `Ω(1) contiene tutti gli algoritmi, ma ${F(spec.cls)} no: ${inOm1 ? '' : 'per esempio un algoritmo con T(n) = 1 non appartiene a ' + F(spec.cls) + '.'}`;
        fig = figure(spec, truth, null);
        rule = RULE.floor;
        break;
      }
      case 'manual': reason = opts.manual || ''; rule = opts.rule || RULE.base; break;
      default: break;
    }
    const verdict = truth ? 'Vero' : 'Falso';
    return { verdict, hdr, reason, rule, figure: fig, html: `<p class="ex-v">${verdict}.</p>` + (hdr ? `<p class="ex-h">${hdr}</p>` : '') + `<p>${reason}</p>` + (fig ? `<div class="figwrap">${fig}<p class="figcap">Ogni classe è un tratto sulla scala delle crescite. Pallino pieno = estremo incluso, vuoto = escluso. Il pavimento è 1: nessun algoritmo cresce meno di una costante.</p></div>` : '') + `<p class="ex-r">${rule}</p>` };
  }

  return { explain, figure, witnessIn, witnessBoth, IDEA, RULE, fT, NICE };
});
</script>
<script>/* Logica dell'editor di codice C: chiusura automatica di parentesi e virgolette, auto-indentazione, Backspace e Tab "intelligenti".
   Funzioni pure: ricevono testo e posizione del cursore e restituiscono una modifica {a, b, text, selStart, selEnd}
   (sostituisci v[a..b) con text e metti il cursore in selStart..selEnd), oppure null per lasciare fare al browser. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.EditLogic = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const IND = '  ';
  const OPEN = { '(': ')', '[': ']', '{': '}' };
  const CLOSE = { ')': '(', ']': '[', '}': '{' };
  const isWord = (c) => !!c && /[A-Za-z0-9_]/.test(c);

  const lineStart = (v, i) => (i <= 0 ? 0 : v.lastIndexOf('\n', i - 1) + 1);
  const lineEnd = (v, i) => { const e = v.indexOf('\n', i); return e < 0 ? v.length : e; };
  const indentOf = (line) => /^[ \t]*/.exec(line)[0];
  const lineAt = (v, i) => v.slice(lineStart(v, i), lineEnd(v, i));

  /* stato lessicale in posizione pos e pila delle graffe aperte (solo nel codice, non in stringhe o commenti) */
  function scan(v, pos) {
    let st = 'code';
    const braces = [];
    const end = Math.min(pos, v.length);
    for (let i = 0; i < end; i++) {
      const c = v[i], d = v[i + 1];
      if (st === 'code') {
        if (c === '/' && d === '/') { st = 'line'; i++; }
        else if (c === '/' && d === '*') { st = 'block'; i++; }
        else if (c === '"') st = 'str';
        else if (c === "'") st = 'chr';
        else if (c === '{') braces.push(i);
        else if (c === '}') braces.pop();
      } else if (st === 'line') {
        if (c === '\n') st = 'code';
      } else if (st === 'block') {
        if (c === '*' && d === '/') { st = 'code'; i++; }
      } else if (c === '\\') i++;
      else if (c === '\n') st = 'code';
      else if ((st === 'str' && c === '"') || (st === 'chr' && c === "'")) st = 'code';
    }
    return { st, braces };
  }

  /* la parte di codice di una riga, senza commenti, senza spazi finali */
  function codeOf(line) {
    let out = '', st = 'code';
    for (let i = 0; i < line.length; i++) {
      const c = line[i], d = line[i + 1];
      if (st === 'code') {
        if (c === '/' && d === '/') break;
        if (c === '/' && d === '*') { const e = line.indexOf('*/', i + 2); if (e < 0) break; i = e + 1; out += ' '; continue; }
        if (c === '"') st = 'str'; else if (c === "'") st = 'chr';
        out += c;
      } else {
        out += c;
        if (c === '\\') { out += line[i + 1] || ''; i++; }
        else if ((st === 'str' && c === '"') || (st === 'chr' && c === "'")) st = 'code';
      }
    }

            add('braces', nx.line, 'warn', 'Questa riga è rientrata come se fosse dentro il `' + s + '` della riga ' + T[h].line + ', ma senza graffe il `' + s + '` controlla solo la prima istruzione: questa viene eseguita sempre. Servono le graffe `{ }`.');
          }
        }
      }
    }

    /* cicli che escono dall'array o saltano l'ultimo elemento */
    if (tf && C.lenNames.length && C.arrNames.length) {
      for (let h = tf.bodyOpen + 1; h < tf.bodyClose; h++) {
        if (T[h].s !== 'for' && T[h].s !== 'while') continue;
        const p = T[h + 1] && T[h + 1].s === '(' ? match(T, h + 1) : -1;
        if (p < 0) continue;
        const bodyEnd = stmtEnd(T, p + 1, tf.bodyClose - 1);
        for (let k = h + 2; k < p; k++) {
          if (T[k].t !== 'id' || !T[k + 1] || !(T[k + 1].s === '<=' || T[k + 1].s === '<') || !T[k + 2] || C.lenNames.indexOf(T[k + 2].s) < 0) continue;
          const iv = T[k].s, lenv = T[k + 2].s;
          let usesIdx = false, usesNext = false, arr = '';
          for (let x = p + 1; x <= bodyEnd; x++) {
            if (T[x].s === '[' && T[x - 1] && C.arrNames.indexOf(T[x - 1].s) >= 0 && T[x + 1] && T[x + 1].s === iv) {
              if (T[x + 2] && T[x + 2].s === ']') { usesIdx = true; arr = T[x - 1].s; }
              if (T[x + 2] && T[x + 2].s === '+' && T[x + 3] && T[x + 3].s === '1') usesNext = true;
            }
          }
          if (T[k + 1].s === '<=' && usesIdx && !(T[k + 3] && T[k + 3].s === '-')) add('off-by-one', T[k].line, 'err', 'La condizione `' + iv + ' <= ' + lenv + '` fa arrivare `' + iv + '` fino a ' + lenv + ', ma gli indici validi di `' + arr + '` vanno da 0 a ' + lenv + ' - 1: all\'ultimo giro leggi `' + arr + '[' + lenv + ']`, fuori dall\'array.');
          if (T[k + 1].s === '<' && T[k + 3] && T[k + 3].s === '-' && T[k + 4] && T[k + 4].s === '1' && usesIdx && !usesNext) add('skip-last', T[k].line, 'warn', 'Con `' + iv + ' < ' + lenv + ' - 1` il ciclo si ferma un elemento prima della fine: l\'ultimo elemento di `' + arr + '` non viene mai guardato (serve `' + iv + ' < ' + lenv + '`, a meno che dentro usi anche `' + arr + '[' + iv + ' + 1]`).');
        }
      }
      for (let i = tf.bodyOpen + 1; i < tf.bodyClose; i++) {
        if (T[i].t === 'id' && C.arrNames.indexOf(T[i].s) >= 0 && T[i + 1] && T[i + 1].s === '[' && T[i + 2] && C.lenNames.indexOf(T[i + 2].s) >= 0 && T[i + 3] && T[i + 3].s === ']') add('a-len', T[i].line, 'err', '`' + T[i].s + '[' + T[i + 2].s + ']` è fuori dall\'array: l\'ultimo elemento è `' + T[i].s + '[' + T[i + 2].s + ' - 1]`.');
        if (T[i].s === 'sizeof' && T[i + 1] && T[i + 1].s === '(' && T[i + 2] && C.arrNames.indexOf(T[i + 2].s) >= 0 && T[i + 3] && T[i + 3].s === ')') add('sizeof', T[i].line, 'err', 'Dentro la funzione `' + T[i + 2].s + '` è un puntatore: `sizeof(' + T[i + 2].s + ')` è la dimensione del puntatore (8 byte), non quella dell\'array. La lunghezza te la passa il parametro `' + (C.lenNames[0] || 'len') + '`.');
      }
    }

    /* conta le occorrenze solo "dopo" la posizione i: for (j = i + 1; ...) { c++ } e poi un confronto su c */
    if (tf && /ripetut|volte|esattamente|quante/i.test(ex.statement)) {
      for (let h = tf.bodyOpen + 1; h < tf.bodyClose; h++) {
        if (T[h].s !== 'for' || !T[h + 1] || T[h + 1].s !== '(') continue;
        const p = match(T, h + 1);
        if (p < 0) continue;
        let jv = null, iv = null;
        for (let k = h + 2; k + 4 < p; k++) {
          if (T[k].t === 'id' && T[k + 1].s === '=' && T[k + 2].t === 'id' && T[k + 3].s === '+' && T[k + 4].s === '1' && (!T[k + 5] || T[k + 5].s === ';')) { jv = T[k].s; iv = T[k + 2].s; break; }
        }
        if (!jv) continue;
        const bodyEnd = stmtEnd(T, p + 1, tf.bodyClose - 1);
        let cv = null;
        for (let x = p + 1; x <= bodyEnd; x++) {
          if (T[x].t === 'id' && T[x].s !== jv && ((T[x + 1] && T[x + 1].s === '++') || (T[x + 1] && T[x + 1].s === '+=' && T[x + 2] && T[x + 2].s === '1') || (T[x - 1] && T[x - 1].s === '++'))) { cv = T[x].s; break; }
        }
        if (!cv) continue;
        let cmp = false;
        for (let x = bodyEnd + 1; x < Math.min(tf.bodyClose, bodyEnd + 14); x++) if (T[x].s === cv && T[x + 1] && /^(==|!=|<=|>=|<|>)$/.test(T[x + 1].s)) { cmp = true; break; }
        if (cmp) add('count-forward', T[h].line, 'err', 'Il ciclo interno parte da `' + iv + ' + 1`: così `' + cv + '` conta solo le occorrenze che stanno dopo la posizione `' + iv + '` e non quelle prima. Per sapere quante volte compare un valore in tutto l\'array il ciclo deve partire da 0 (e il contatore da 0, perché ora conti anche l\'elemento stesso). Prova con `{1, 1}`: all\'ultimo `1` il tuo codice vede una sola occorrenza.');
      }
    }

    /* parametro di output: assegnato senza asterisco / mai scritto */
    if (tf && C.outP && C.outP.name) {
      const nm = C.outP.name;
      let writes = 0; const direct = [];
      for (let i = tf.bodyOpen + 1; i < tf.bodyClose; i++) {
        if (T[i].t !== 'id' || T[i].s !== nm) continue;
        const pv = T[i - 1], n1 = T[i + 1], n2 = T[i + 2];
        const deref = pv && pv.s === '*' && !endsOperand(T, i - 2);
        if (n1 && assignOp(n1.s)) { if (deref) writes++; else if (!(pv && (pv.s === '->' || pv.s === '.'))) direct.push(T[i].line); }
        else if (deref && n1 && n1.s === ')' && n2 && assignOp(n2.s)) writes++;
        else if (n1 && n1.s === '[' ) { const j = match(T, i + 1); if (j > 0 && T[j + 1] && assignOp(T[j + 1].s)) writes++; }
        else if (pv && (pv.s === '++' || pv.s === '--')) direct.push(T[i].line);
      }
      const isListRem = OUT_PARAM[ex.kind] === 'first';
      if (direct.length && (!isListRem || writes === 0)) add('ptr-assign', direct[0], 'err', isListRem
        ? 'Qui assegni a `' + nm + '` e non a `*' + nm + '`: `' + nm + '` è l\'indirizzo della variabile-testa del chiamante, cambiare solo la tua copia non cambia la sua lista. Per modificare la testa scrivi `*' + nm + ' = ...`.'
        : 'Qui scrivi `' + nm + ' = ...` senza asterisco: cambi solo la copia locale del puntatore e il chiamante non vede nulla. Il valore va scritto nella variabile puntata: `*' + nm + ' = ...`.');
      if (!isListRem && writes === 0) add('no-out-write', tf.line, 'err', 'Non scrivi mai in `*' + nm + '`: il risultato deve arrivare al chiamante tramite quel puntatore (`*' + nm + ' = ...`), non con un return.');
    }

    /* modifiche vietate */
    if (tf && ex.kind !== 'A_inplace' && C.isArr && C.arrNames.length) {
      for (let i = tf.bodyOpen + 1; i < tf.bodyClose; i++) {
        if (T[i].t === 'id' && C.arrNames.indexOf(T[i].s) >= 0 && T[i + 1] && T[i + 1].s === '[') {
          const j = match(T, i + 1);
          if (j > 0 && T[j + 1] && assignOp(T[j + 1].s)) { add('mod-input', T[i].line, 'err', 'Scrivi dentro `' + T[i].s + '[...]`: l\'array di input non deve cambiare (il test controlla che resti uguale). Usa variabili locali per i conti.'); break; }
        }
      }
    }
    if (tf && /^L_(ret|val_ret)$/.test(ex.kind)) {
      for (let i = tf.bodyOpen + 1; i < tf.bodyClose; i++) {
        if (T[i].s === '->' && T[i + 1] && /^(next|prev|info)$/.test(T[i + 1].s) && T[i + 2] && assignOp(T[i + 2].s)) { add('mod-list', T[i].line, 'err', 'Qui modifichi la lista (`->' + T[i + 1].s + '`): questa funzione deve solo leggerla, i test controllano che resti uguale.'); break; }
        if (T[i].s === 'free' && T[i + 1] && T[i + 1].s === '(') { add('mod-list', T[i].line, 'err', 'Questa funzione non deve liberare né modificare la lista: i test la stampano dopo la chiamata.'); break; }
      }
    }

    /* rimozione da lista */
    if (tf && /^L_rem/.test(ex.kind)) {
      let free = false, prevW = false, nextW = false, headW = false, firstFree = 0;
      const pn = C.outP && C.outP.name;
      for (const f of fns) for (let i = f.bodyOpen + 1; i < f.bodyClose; i++) {
        if (T[i].s === 'free' && T[i + 1] && T[i + 1].s === '(') { free = true; if (!firstFree) firstFree = T[i].line; }
        if (T[i].s === '->' && T[i + 2] && assignOp(T[i + 2].s)) { if (T[i + 1].s === 'prev') prevW = true; if (T[i + 1].s === 'next') nextW = true; }
        if (pn && T[i].s === pn && T[i - 1] && T[i - 1].s === '*' && T[i + 1] && assignOp(T[i + 1].s)) headW = true;
        if (pn && T[i].s === pn && T[i - 1] && T[i - 1].s === '*' && T[i + 1] && T[i + 1].s === ')' && T[i + 2] && assignOp(T[i + 2].s)) headW = true;
      }
      if (!free) add('no-free', tf.line, 'err', 'Non c\'è nessuna `free(...)`: il testo chiede di deallocare l\'elemento rimosso, e i test contano le free eseguite.');
      if (nextW && !prevW && !/ultimo/.test(ex.id)) add('no-prev', tf.line, 'warn', 'Aggiorni i `next` ma mai i `prev`: la lista è doppiamente concatenata, dopo una rimozione il `prev` del successivo deve puntare al precedente.');
      if (free && !headW && !prevW && !nextW) add('no-relink', tf.line, 'warn', 'Liberi un elemento senza collegare fra loro quelli che restano: dopo la free la lista conterrebbe un puntatore a memoria liberata.');
      if (free && prevW && nextW && !headW) add('no-head', tf.line, 'warn', 'Non modifichi mai `*' + pn + '`: se l\'elemento da togliere è il primo, la testa della lista (`*' + pn + '`) deve passare al successivo.');
    }

    /* tipi di errore classici */
    if (tf) {
      for (let i = tf.bodyOpen + 1; i < tf.bodyClose - 3; i++) {
        if (T[i].s === '%' && T[i + 1].s === '2' && (T[i + 2].s === '==') && T[i + 3].s === '1') { add('mod2', T[i].line, 'warn', 'Con i numeri negativi `x % 2 == 1` fallisce: in C `-3 % 2` vale `-1`, non `1`. Per "dispari" usa `x % 2 != 0`.'); break; }
      }
      if (ex.kind === 'A_float') {
        const hasFloat = T.slice(tf.bodyOpen, tf.bodyClose).some((t) => t.s === 'float' || t.s === 'double' || (t.t === 'num' && /[.eE]/.test(t.s) && !/^0[xX]/.test(t.s)));
        if (!hasFloat) for (let i = tf.bodyOpen + 1; i < tf.bodyClose; i++) if (T[i].s === '/') { add('int-div', T[i].line, 'err', 'Qui dividi due interi: in C il risultato è un intero (la parte decimale si perde, `7 / 2` vale `3`). Trasforma uno dei due in float: `(float) somma / len`.'); break; }
      }
      /* funzione non void che puo' finire senza return */
      if (tf.retBase !== 'void' || tf.retPtr) {
        let d = 0, last = -1, anyRet = false;
        for (let i = tf.bodyOpen + 1; i < tf.bodyClose; i++) { const s = T[i].s; if (s === '{') d++; else if (s === '}') d--; if (T[i].s === 'return') anyRet = true; }
        let k = tf.bodyOpen + 1;
        while (k < tf.bodyClose) { last = k; k = stmtEnd(T, k, tf.bodyClose - 1) + 1; }
        const lastTok = last >= 0 ? T[last].s : '';
        if (!anyRet) add('no-return', tf.endLine, 'err', 'La funzione deve restituire un valore ma non c\'è nessun `return`.');
        else if (lastTok === 'for' || lastTok === 'while') add('end-return', tf.endLine, 'warn', 'Se il ciclo finisce senza trovare nulla la funzione arriva alla fine senza `return` e restituisce un valore a caso: aggiungi il `return` finale (quale valore va restituito in quel caso?).');
      }
      /* parametri mai usati */
      tf.params.forEach((p) => {
        if (!p.name || p === C.outP) return;
        let used = false;
        for (let i = tf.bodyOpen + 1; i < tf.bodyClose; i++) if (T[i].t === 'id' && T[i].s === p.name) { used = true; break; }
        if (!used) add('unused-' + p.name, tf.line, 'warn', 'Il parametro `' + p.name + '` non compare mai nel corpo di `test`: è un dato dell\'enunciato, di solito serve.');
      });
    }

    const rank = { err: 0, warn: 1, info: 2 };
    out.sort((a, b) => (rank[a.sev] - rank[b.sev]) || (a.line - b.line));
    return out;
  }

  /* ================================================================ cosa e' successo nei test */
  const oneLine = (s) => String(s).replace(/\n+$/, '').replace(/\n/g, ' ⏎ ');
  function dynamicFindings(ex, code, tests) {
    const lines = code.split('\n');
    const q = (l) => (l ? (lines[l - 1] || '').trim() : '');
    const items = [], seen = new Set();
    const add = (id, line, sev, text) => { const k = id + ':' + line; if (seen.has(k)) return; seen.add(k); items.push({ id, line, sev, text, quote: q(line) }); };
    const failing = tests.filter((r) => !r.ok);
    for (const r of failing) {
      const e = r.res && r.res.error;
      if (!e || e.kind === 'compile') continue;
      const L = r.res.sline || 0, qt = q(L);
      const tagTxt = (r.t.tags || []).filter((g) => g !== 'prof').join(', ');
      const when = tagTxt ? ' (caso «' + tagTxt + '»)' : '';
      if (e.kind === 'segv') {
        const mm = /\b([A-Za-z_]\w*)\s*->/.exec(qt);
        if (/NULL/.test(e.message) && mm) add('segv', L, 'err', 'Qui `' + mm[1] + '` è NULL quando scrivi `' + mm[1] + '->...`' + when + '. Controlla `' + mm[1] + ' != NULL` prima di usarlo: lista vuota? fine della lista?');
        else if (/NULL/.test(e.message)) add('segv', L, 'err', 'Qui usi un puntatore NULL' + when + ': controlla che non sia NULL prima di dereferenziarlo (lista vuota? ultimo elemento?).');
        else add('segv', L, 'err', 'Accesso a memoria non valida' + when + ': ' + e.message.replace(/^Segmentation fault: /, ''));
      } else if (e.kind === 'timeout') add('timeout', L, 'err', L ? 'Questo ciclo non finisce mai' + when + ': controlla che dentro cambi la variabile della condizione (o avanzi il puntatore) e che la condizione possa diventare falsa.' : 'Il programma non termina' + when + ': probabile ciclo infinito.');
      else if (e.kind === 'runtime') {
        if (/fuori dai limiti/.test(e.message)) add('oob', L, 'err', 'Indice fuori dall\'array' + when + ': ' + e.message.replace(/^accesso fuori dai limiti dell'array /, 'l\'array ').replace(/^accesso fuori dai limiti di /, ''));
        else if (/già liberata/.test(e.message)) add('uaf', L, 'err', 'Usi memoria che hai già liberato con free' + when + ': prima di fare `free(x)` salva ciò che ti serve (per esempio `x->next`) e dopo la free non toccare più `x`.');
        else if (/doppia|double/i.test(e.message)) add('dfree', L, 'err', 'Doppia free' + when + ': lo stesso blocco viene liberato due volte.');
        else add('rt', L, 'err', e.message.charAt(0).toUpperCase() + e.message.slice(1) + when + '.');
      }
    }
    for (const r of tests) for (const w of (r.res.swarn || [])) if (w.line) add('w:' + w.text.slice(0, 24), w.line, 'warn', w.text.charAt(0).toUpperCase() + w.text.slice(1));
    for (const r of tests) for (const w of (r.res.swarn || [])) if (!w.line && /senza eseguire un return/.test(w.text)) add('w:noret', 0, 'warn', 'La funzione arriva alla fine senza un `return`: in qualche caso (' + ((r.t.tags || []).filter((g) => g !== 'prof').join(', ') || 'un test') + ') non restituisce nessun valore.');

    /* il caso piu' semplice che fallisce */
    let simplest = null;
    for (const r of failing) if (!simplest || r.t.code.length < simplest.t.code.length) simplest = r;
    let narrative = null;
    if (simplest) {
      const exp = String(simplest.t.expected).replace(/\n+$/, '').split('\n'), got = String(simplest.stdout || '').replace(/\n+$/, '').split('\n');
      let k = 0; while (k < exp.length && k < got.length && exp[k] === got[k]) k++;
      const tagTxt = (simplest.t.tags || []).filter((g) => g !== 'prof').join(', ');
      const sentinel = /(?:int|float)\s+result\s*=\s*(-?\d+(?:\.\d+)?)/.exec(simplest.t.code);
      narrative = { n: simplest.t.n, tags: tagTxt, error: !!(simplest.res && simplest.res.error), expected: exp[k] === undefined ? '' : exp[k], got: got[k] === undefined ? '' : got[k], line: k + 1, multi: exp.length > 1, untouched: !!(sentinel && got[0] !== undefined && Number(got[0]) === Number(sentinel[1]) && exp[0] !== got[0]), sentinel: sentinel ? sentinel[1] : null, extraOutput: /Hai modificato l'array/.test(simplest.stdout || '') };
    }
    return { items, narrative };
  }

  /* ================================================================ ricerca della correzione minima */
  const REL = { '<': ['<=', '>', '>='], '<=': ['<', '>=', '>'], '>': ['>=', '<', '<='], '>=': ['>', '<=', '<'] };
  const KIND_PRIO = { rel: 1, eq: 1, logic: 2, bound: 2, index: 2, deref: 2, link: 2, const: 3, step: 3, arith: 3, not: 3, var: 4, insert: 4.5, del: 5 };

  function mutants(ex, code, hotLines) {
    const C = context(ex, code);
    const { T, fns, tf } = C;
    const out = [], seenKey = new Set();
    const hot = new Set(hotLines || []);
    const push = (start, end, repl, kind, line, extra) => {
      const key = start + ':' + end + ':' + repl;
      if (seenKey.has(key)) return; seenKey.add(key);
      out.push(Object.assign({ start, end, repl, kind, line, from: code.slice(start, end), to: repl, prio: (KIND_PRIO[kind] || 5) - (hot.has(line) ? 1.5 : 0), ord: out.length }, extra || {}));
    };
    const ptrNames = new Set();
    const intNames = new Set();
    for (const f of fns) {
      f.params.forEach((p) => { if (p.name) (p.ptr > 0 ? ptrNames : intNames).add(p.name); });
      for (let i = f.bodyOpen + 1; i < f.bodyClose; i++) {
        if (T[i].t === 'id' && TYPES.has(T[i].s) && !KW.has(T[i].s)) {
          let k = i + 1, stars = T[i].s === 'plist' ? 1 : 0;
          while (T[k] && (T[k].s === '*' || (T[k].t === 'id' && TYPES.has(T[k].s)))) { if (T[k].s === '*') stars++; k++; }
          while (T[k] && T[k].t === 'id' && !TYPES.has(T[k].s)) {
            let s2 = stars; if (T[k - 1] && T[k - 1].s === '*') s2 = stars;
            (s2 > 0 ? ptrNames : intNames).add(T[k].s);
            k++;
            if (T[k] && T[k].s === '=') { let d = 0; while (T[k] && !(d === 0 && (T[k].s === ',' || T[k].s === ';'))) { if (T[k].s === '(') d++; if (T[k].s === ')') d--; k++; } }
            if (T[k] && T[k].s === ',') { k++; stars = (T[i].s === 'plist' ? 1 : 0); while (T[k] && T[k].s === '*') { stars++; k++; } } else break;
          }
        }
      }
    }
    const ints = [...intNames], ptrs = [...ptrNames];
    /* intervalli delle dichiarazioni: li lascio stare */
    const declRanges = [];
    for (const f of fns) {
      for (let i = f.bodyOpen + 1; i < f.bodyClose; i++) {
        if (T[i].t === 'id' && TYPES.has(T[i].s) && (i === f.bodyOpen + 1 || /^[;{}]$/.test(T[i - 1].s) || T[i - 1].s === ')')) { const e = stmtEnd(T, i, f.bodyClose - 1); declRanges.push([i, e]); }
      }
    }
    const inDecl = (i) => declRanges.some(([a, b]) => i >= a && i <= b);

    for (const f of fns) {
      for (let i = f.bodyOpen + 1; i < f.bodyClose; i++) {
        const t = T[i], pv = T[i - 1], nx = T[i + 1];
        const L = t.line;
        if (t.t === 'op') {
          if (REL[t.s] && !(t.s === '<' && pv && pv.s === '<')) REL[t.s].forEach((r) => push(t.i, t.e, r, 'rel', L));
          else if (t.s === '==') push(t.i, t.e, '!=', 'eq', L);
          else if (t.s === '!=') push(t.i, t.e, '==', 'eq', L);
          else if (t.s === '&&') push(t.i, t.e, '||', 'logic', L);
          else if (t.s === '||') push(t.i, t.e, '&&', 'logic', L);
          else if ((t.s === '+' || t.s === '-') && endsOperand(T, i - 1)) push(t.i, t.e, t.s === '+' ? '-' : '+', 'arith', L);
          else if (t.s === '++') push(t.i, t.e, '--', 'step', L);
          else if (t.s === '--') push(t.i, t.e, '++', 'step', L);
          else if (t.s === '!' && !endsOperand(T, i - 1)) push(t.i, t.e, '', 'not', L);
          else if (t.s === '*' && !endsOperand(T, i - 1) && !inDecl(i) && !(pv && pv.t === 'id' && TYPES.has(pv.s))) push(t.i, t.e, '', 'deref', L);
        } else if (t.t === 'num' && /^\d+$/.test(t.s)) {
          const n = +t.s;
          if (pv && pv.s === '[' && nx && nx.s === ']') ints.forEach((o) => push(t.i, t.e, o, 'index', L));

    eq: (m) => 'la condizione ha l\'operatore `' + m.from + '`: è invertita rispetto a quello che vuoi controllare.',

  }

  });
}

/* ===== progressi: localStorage + (se disponibile) db dell'artifact, privato per utente ===== */
const LS_P = 'asd.palestra.progress.v1', LS_D = 'asd.palestra.drafts.v1', LS_T = 'asd.palestra.theme';
const blankP = () => ({ v: 1, q: {}, x: {}, hist: [], gen: {}, t: 0 });
let P = blankP();      /* q: id -> {h:'0110', n, t}  x: esercizio -> {runs, pass, last:[ok,tot], t}  gen: argomento -> [n, c] */
let DR = {};           /* bozze del codice: id -> {c, t} */
const sync = { state: 'local', note: 'Solo su questo browser', uid: null };
let refP = null, refD = null, dirtyP = false, dirtyD = false, saving = false, saveTimer = 0, onSyncChange = () => {};

function loadLocal() {
  try { const p = JSON.parse(lsGet(LS_P) || 'null'); if (p && p.v === 1 && p.q) P = Object.assign(blankP(), p); } catch (e) { /* dati rovinati: riparto da zero */ }
  try { const d = JSON.parse(lsGet(LS_D) || 'null'); if (d && typeof d === 'object') DR = d; } catch (e) { /* idem */ }
}

function mergeProgress(r) {
  if (!r || r.v !== 1) return;
  for (const id in (r.q || {})) {
    const a = P.q[id], b = r.q[id];
    if (!ITEM.has(id)) continue;
    if (!a || (b.t || 0) > (a.t || 0)) P.q[id] = b;
  }
  for (const id in (r.x || {})) {
    const a = P.x[id], b = r.x[id];
    if (!EXER.has(id)) continue;
    if (!a || (b.t || 0) > (a.t || 0)) P.x[id] = b;
  }
  for (const k in (r.gen || {})) {
    const a = P.gen[k], b = r.gen[k];
    if (!a || b[0] > a[0]) P.gen[k] = b;
  }
  const seen = new Set(P.hist.map((s) => s.t));
  for (const s of (r.hist || [])) if (!seen.has(s.t)) P.hist.push(s);
  P.hist.sort((a, b) => a.t - b.t);
  P.hist = P.hist.slice(-80);
  P.t = Math.max(P.t || 0, r.t || 0);
}
function mergeDrafts(r) {
  for (const id in (r || {})) {
    if (!EXER.has(id)) continue;
    if (!DR[id] || (r[id].t || 0) > (DR[id].t || 0)) DR[id] = r[id];
  }
}

function touch() { P.t = Date.now(); statsCache = null; dirtyP = true; queueSave(); }
function touchDraft() { dirtyD = true; queueSave(); }
function queueSave() {
  lsSet(LS_P, JSON.stringify(P));
  lsSet(LS_D, JSON.stringify(DR));
  if (!refP) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 900);
}
async function flush() {
  if (saving || !refP) return;
  saving = true;
  try {
    if (dirtyP) {
      dirtyP = false;
      if (JSON.stringify(P).length > 220000) P.hist = P.hist.slice(-20);
      await refP.set(JSON.parse(JSON.stringify(P)));
    }
    if (dirtyD) {
      dirtyD = false;
      await refD.set({ d: JSON.parse(JSON.stringify(DR)) });
    }
    sync.state = 'saved'; sync.note = 'Salvato nel tuo account';
  } catch (e) {
    sync.state = 'error'; sync.note = 'Salvataggio nell’account non riuscito: i progressi restano su questo browser';
    dirtyP = dirtyP || true;
  }
  saving = false;
  onSyncChange();
  if (dirtyP || dirtyD) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 4000); }
}

async function initCloud(onDone) {
  try {
    const c = window.claude;
    if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    sync.uid = id;
    const base = 'data/users/' + id;
    refP = db.doc(base + '/progress'); refD = db.doc(base + '/drafts');
    const [sp, sd] = await Promise.all([refP.get(), refD.get()]);
    if (sp.exists) mergeProgress(sp.data());
    if (sd.exists) mergeDrafts((sd.data() || {}).d);
    statsCache = null;
    dirtyP = true; dirtyD = true;
    sync.state = 'saved'; sync.note = 'Salvato nel tuo account';
    queueSave();
    onDone && onDone();
  } catch (e) {
    refP = refD = null;
    sync.state = 'local'; sync.note = 'Solo su questo browser';
  }
  onSyncChange();
}

/* ---- 20-stats.js ---- */
/* ===== statistiche per argomento e classifica "cosa studiare" ===== */
let statsCache = null;
const itemsByTopic = new Map(), exByTopic = new Map(), profFreq = new Map();
for (const t of BANK.topics) { itemsByTopic.set(t.id, []); exByTopic.set(t.id, []); profFreq.set(t.id, 0); }
for (const it of BANK.items) for (const t of it.topics) { itemsByTopic.get(t).push(it); if (it.prof) profFreq.set(t, profFreq.get(t) + Math.max(1, it.freq)); }
for (const e of BANK.exercises) for (const t of e.topics) { exByTopic.get(t).push(e); profFreq.set(t, profFreq.get(t) + (e.prof ? 1 : 0)); }

/* punteggio 0..1 di una domanda: ultimi risultati con peso decrescente (il piu' recente pesa di piu') */
function qScore(rec) {
  if (!rec || !rec.h) return null;
  let w = 1, num = 0, den = 0;
  for (let i = rec.h.length - 1; i >= 0; i--) { num += w * (rec.h[i] === '1' ? 1 : 0); den += w; w *= 0.62; }
  return num / den;
}
function xScore(rec) {
  if (!rec || !rec.runs) return null;
  if (rec.pass && rec.last && rec.last[0] === rec.last[1]) return 1;
  const f = rec.last && rec.last[1] ? rec.last[0] / rec.last[1] : 0;
  return rec.pass ? 0.8 : 0.7 * f;
}

function computeStats() {
  const out = new Map();
  for (const t of BANK.topics) {
    const its = itemsByTopic.get(t.id), exs = exByTopic.get(t.id);
    let seen = 0, sum = 0, wrong = 0, unseen = 0, attempts = 0, right = 0;
    for (const it of its) {
      const rec = P.q[it.id];
      if (!rec) { unseen++; continue; }
      seen++; sum += qScore(rec);
      attempts += rec.n;
      if (rec.h[rec.h.length - 1] === '0') wrong++;
    }
    let xSeen = 0, xPass = 0;
    for (const e of exs) {
      const rec = P.x[e.id];
      if (!rec || !rec.runs) { unseen++; continue; }
      seen++; xSeen++; sum += xScore(rec);
      if (rec.pass) xPass++;
      if (!(rec.last && rec.last[0] === rec.last[1])) wrong++;
    }
    const g = P.gen[t.id];
    let gw = 0, gs = 0;
    if (g && g[0] > 0) { gw = Math.min(g[0], 8) * 0.5; gs = gw * ((g[1] + 1) / (g[0] + 2)); }
    const total = its.length + exs.length;
    const k = 1.5;                                   /* a priori: senza dati la precisione e' 50% */
    const acc = (sum + gs + 0.5 * k) / (seen + gw + k);
    const cov = total ? seen / total : 0;
    const evidence = seen + gw > 0;
    const imp = 1 + Math.log2(1 + profFreq.get(t.id)) / 4;
    let need = evidence ? 0.65 * (1 - acc) + 0.35 * (1 - cov) : 0.5;
    let level = 'new';
    if (evidence) level = acc < 0.6 ? 'weak' : (acc >= 0.85 && seen >= Math.min(3, total) ? 'good' : 'mid');
    if (level === 'good' && cov < 0.5) level = 'mid';
    const priority = need * imp;
    out.set(t.id, { id: t.id, total, nQ: its.length, nX: exs.length, seen, unseen, wrong, acc, cov, level, priority, imp, evidence, xPass, xSeen, attempts, gen: g ? g[0] : 0 });
  }
  return out;
}
function allStats() { if (!statsCache) statsCache = computeStats(); return statsCache; }
function stat(tid) { return allStats().get(tid); }
function ranked() { return BANK.topics.slice().sort((a, b) => stat(b.id).priority - stat(a.id).priority); }

function reasonFor(s) {
  if (!s.evidence) return s.imp > 1.7 ? 'Non l’hai ancora provato, ed esce spesso nei quiz.' : 'Non l’hai ancora provato.';
  const parts = [];
  if (s.wrong) parts.push(s.wrong === 1 ? 'una domanda da rifare' : s.wrong + ' domande da rifare');
  if (s.unseen) parts.push(s.unseen === 1 ? 'una mai vista' : s.unseen + ' mai viste');
  if (s.level === 'weak') parts.unshift(s.seen >= 3 ? 'rispondi giusto circa ' + pct(s.acc) : 'hai già sbagliato qui');
  if (!parts.length) return s.level === 'good' ? 'Lo padroneggi: basta un ripasso ogni tanto.' : 'Va bene, ma ripassalo.';
  const t = parts.join(' · ');
  return t.charAt(0).toUpperCase() + t.slice(1) + (s.imp > 1.7 ? ' · esce spesso nei quiz' : '');
}
const LEVEL_LABEL = { weak: 'Da rivedere', mid: 'Quasi', good: 'Solido', new: 'Non provato' };

function overall() {
  const st = allStats();
  let wsum = 0, accw = 0, seenItems = 0;
  for (const t of BANK.topics) { const s = st.get(t.id); wsum += s.imp; accw += s.imp * (s.evidence ? s.acc * (0.4 + 0.6 * s.cov) : 0); }
  for (const id in P.q) if (ITEM.has(id)) seenItems++;
  let right = 0, tot = 0;
  for (const id in P.q) { const r = P.q[id]; if (!ITEM.has(id)) continue; tot++; if (r.h[r.h.length - 1] === '1') right++; }
  let exPass = 0; for (const e of BANK.exercises) if (P.x[e.id] && P.x[e.id].pass) exPass++;
  const wrong = BANK.items.filter((i) => P.q[i.id] && P.q[i.id].h.slice(-1) === '0');
  const profSeen = BANK.items.filter((i) => i.prof && P.q[i.id]).length;
  return { ready: wsum ? accw / wsum : 0, seenItems, lastRight: tot ? right / tot : 0, tot, exPass, wrong, profSeen, profTotal: BANK.items.filter((i) => i.prof).length };
}

/* ---- 30-quiz.js ---- */
/* ===== generatore di Vero/Falso sulle notazioni asintotiche (motore verificato con due metodi indipendenti) ===== */
const GEN_G = ['1', 'log n', '(log n)^2', 'n', 'n log n', 'n^2', 'n^3', '2^n'];
const GEN_C = ['O', 'Omega', 'Theta', 'o'];
const pick1 = (a) => a[Math.floor(Math.random() * a.length)];
function genTopics(spec) {
  const t = new Set();
  const flag = (a, b) => {
    if (a === 'o' || b === 'o') t.add('asy-o');
    if (a === 'Theta' || b === 'Theta') t.add('asy-theta');
    if ((a === 'O' && b === 'Omega') || (a === 'Omega' && b === 'O')) t.add('asy-ol');
  };
  if (spec.k === 'subset') { t.add('asy-insiemi'); flag(spec.sub.c, spec.sup.c); }
  else if (spec.k === 'may' || spec.k === 'cannot') { t.add('asy-esiste'); flag(spec.a.c, spec.b.c); if (spec.a.c === spec.b.c) t.add('asy-incl'); }
  else {
    flag(spec.from.c, spec.to.c);
    if (spec.from.c === spec.to.c) t.add('asy-incl');
    if (spec.to.c === 'Omega' && Theory.cmp(spec.to.g, Theory.ONE) === 0) t.add('asy-ct');
    if (!t.size) t.add('asy-incl');
  }
  return [...t];
}
function genItem(wantTruth, seen) {
  for (let tries = 0; tries < 400; tries++) {
    const kind = pick1(['all', 'all', 'all', 'may', 'cannot', 'subset']);
    const A = Theory.C(pick1(GEN_C), pick1(GEN_G)), B = Theory.C(pick1(GEN_C), pick1(GEN_G));
    if (Theory.isEmpty(Theory.interval(A)) || Theory.isEmpty(Theory.interval(B))) continue;
    if (A.c === B.c && Theory.cmp(A.g, B.g) === 0) continue;
    const spec = kind === 'all' ? { k: 'all', from: A, to: B }
      : kind === 'may' ? { k: 'may', a: A, b: B }
        : kind === 'cannot' ? { k: 'cannot', a: A, b: B }
          : { k: 'subset', sub: A, sup: B, dir: Math.random() < 0.5 ? 'contains' : undefined };
    const truth = Theory.decide(spec).truth;
    if (truth !== Theory.decideBrute(spec).truth) continue;       /* i due metodi devono concordare */
    if (wantTruth != null && truth !== wantTruth) continue;
    const key = [kind, A.c, Theory.fmtG(A.g), B.c, Theory.fmtG(B.g), spec.dir || ''].join('|');
    if (seen && seen.has(key)) continue;
    if (seen) seen.add(key);
    const ex = Explain.explain(spec, truth);
    return {
      id: 'gen:' + key, type: 'vf', gen: true, text: Theory.render(spec), answer: truth, html: ex.html,
      topics: genTopics(spec), prof: false, freq: 0,
      slides: [['040-notazione-asintotica', [46, 47, 48]], ['050-complessita-algoritmi', [13, 15, 16, 18]]],
    };
  }
  return null;
}

/* ===== scelta delle domande ===== */
function itemWeight(it) {
  const rec = P.q[it.id];
  let w;
  if (!rec) w = 1.1;
  else {
    const last = rec.h[rec.h.length - 1];
    if (last === '0') w = 3;
    else { const s = qScore(rec); w = (s > 0.9 && rec.h.length >= 2) ? 0.25 : 0.7; }
    if (Date.now() - rec.t < 90000) w *= 0.1;
  }
  const pri = Math.max.apply(null, it.topics.map((t) => stat(t).priority));
  return w * (0.35 + pri);
}
function weakSet(n) { return sampleWeighted(BANK.items, itemWeight, n); }
function diagnosticSet(n) {
  const order = BANK.topics.slice().sort((a, b) => stat(b.id).imp - stat(a.id).imp + (Math.random() - 0.5) * 0.5);
  const used = new Set(), out = [];
  for (const t of order) {
    if (out.length >= n) break;
    const c = itemsByTopic.get(t.id).filter((i) => !used.has(i.id));
    if (!c.length) continue;
    const pool = c.filter((i) => i.prof).length ? c.filter((i) => i.prof) : c;
    const it = pool[Math.floor(Math.random() * pool.length)];
    used.add(it.id); out.push(it);
  }
  while (out.length < n) { const rest = BANK.items.filter((i) => !used.has(i.id)); if (!rest.length) break; const it = rest[Math.floor(Math.random() * rest.length)]; used.add(it.id); out.push(it); }
  return shuffle(out);
}
function profOrder() {
  const num = (it) => { const s = (it.src || [])[0] || 'Q999'; const m = /(\d+)/.exec(s); return it.src && it.src[0] === 'esonero' ? 0 : (m ? +m[1] : 999); };
  return BANK.items.filter((i) => i.prof).sort((a, b) => num(a) - num(b));
}

function startMode(id, arg) {
  if (id === 'weak') startSession('weak', 'Punti deboli', weakSet(10));
  else if (id === 'diag') startSession('diag', 'Test d’ingresso', diagnosticSet(15));
  else if (id === 'wrong') startSession('wrong', 'Rifai gli sbagliati', shuffle(overall().wrong).slice(0, 15));
  else if (id === 'prof') startSession('prof', 'Domande dei quiz del prof', profOrder());

/* ===== esecuzione del C (simulatore in un Worker) ===== */
let worker = null, wSeq = 0;
const wPending = new Map();
function failAll(msg) {
  for (const [, p] of wPending) { clearTimeout(p.timer); p.resolve({ ok: false, stdout: '', stderr: '', warnings: [], error: { kind: 'runtime', message: msg } }); }
  wPending.clear();
}
function getWorker() {
  if (worker) return worker;
  const src = document.getElementById('cinterp-src').textContent +
    '\n;self.onmessage=function(e){var d=e.data,res;try{res=self.CInterp.run(d.src,{maxSteps:d.maxSteps||3000000});if(d.lint){try{res.lint=self.CInterp.lint(d.src);}catch(e2){}}}catch(err){res={ok:false,stdout:"",stderr:"",warnings:[],error:{kind:"runtime",message:"errore interno del simulatore: "+err.message}};}self.postMessage({id:d.id,res:res});};';
  worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  worker.onmessage = (e) => { const p = wPending.get(e.data.id); if (p) { wPending.delete(e.data.id); clearTimeout(p.timer); p.resolve(e.data.res); } };
  worker.onerror = () => { failAll('il simulatore si è fermato in modo inatteso'); try { worker.terminate(); } catch (e) { /* già chiuso */ } worker = null; };
  return worker;
}
let inlineReady = false;
function runInline(src, maxSteps) {
  if (!inlineReady) { const s = document.createElement('script'); s.textContent = document.getElementById('cinterp-src').textContent; document.head.append(s); inlineReady = true; }
  return Promise.resolve(window.CInterp.run(src, { maxSteps }));
}
function runC(src, maxSteps, lint) {
  let w;
  try { w = getWorker(); } catch (e) { return runInline(src, maxSteps || 3000000); }
  return new Promise((resolve) => {
    const id = ++wSeq;
    const timer = setTimeout(() => {
      wPending.delete(id);
      try { w.terminate(); } catch (e) { /* già chiuso */ }
      worker = null;
      failAll('il simulatore ha impiegato troppo tempo');
      resolve({ ok: false, stdout: '', stderr: '', warnings: [], error: { kind: 'timeout', message: 'esecuzione interrotta: troppo tempo (probabile ciclo infinito)' } });
    }, 12000);
    wPending.set(id, { resolve, timer });
    w.postMessage({ id, src, maxSteps: maxSteps || 3000000, lint: !!lint });
  });
}

const HEAD = '#include <stdio.h>\n#include <stdlib.h>\n';
const HEAD_LINES = 2;
function programFor(ex, student, snippet) {
  const body = snippet.split('\n').map((l) => '  ' + l).join('\n');
  return HEAD + student + '\n' + (ex.prelude ? ex.prelude + '\n' : '') + 'int main(void) {\n' + body + '\n  return 0;\n}\n';
}
const norm = (s) => String(s).replace(/\r/g, '').replace(/[ \t]+$/gm, '').replace(/\n+$/, '');
function describeError(err, studentLines) {
  if (!err) return '';
  const kind = { compile: 'Errore di compilazione', runtime: 'Errore durante l’esecuzione', segv: 'Errore di memoria', timeout: 'Esecuzione interrotta' }[err.kind] || 'Errore';
  let where = '';
  if (err.line) {
    const l = err.line - HEAD_LINES;
    where = l >= 1 && l <= studentLines ? ` (riga ${l})` : ' (nel codice di prova, non nel tuo)';
  }
  return `${kind}${where}: ${err.message}`;
}
function errLine(err, studentLines) {
  if (!err || !err.line) return 0;
  const l = err.line - HEAD_LINES;
  return l >= 1 && l <= studentLines ? l : 0;
}

/* righe del programma intero -> righe del codice dello studente (0 se cadono fuori) */
function studentLine(l, studentLines) { const s = l - HEAD_LINES; return s >= 1 && s <= studentLines ? s : 0; }
function fixWarnings(res, studentLines) {
  const list = [];
  for (const w of (res.warnings || [])) {
    const m = /^riga (\d+): ?([\s\S]*)$/.exec(w);
    if (!m) { list.push({ line: 0, text: w }); continue; }
    const L = studentLine(+m[1], studentLines);
    if (L) list.push({ line: L, text: m[2] });                 /* avvisi sul codice di prova: non sono colpa dello studente */
  }
  return list;
}

async function runTests(ex, code) {
  const studentLines = code.split('\n').length;
  const out = { tests: [], compile: null, passed: 0, total: ex.tests.length, warnList: [], studentLines };
  const seenW = new Set();
  for (const t of ex.tests) {
    const res = await runC(programFor(ex, code, t.code));
    if (res.error && res.error.kind === 'compile') { out.compile = res; break; }
    const stdout = res.stdout || '';
    const ok = res.ok && norm(stdout) === norm(t.expected);
    res.sline = res.error && res.error.line ? studentLine(res.error.line, studentLines) : 0;
    res.swarn = fixWarnings(res, studentLines);
    res.swarn.forEach((w) => { const k = w.line + '|' + w.text; if (!seenW.has(k)) { seenW.add(k); out.warnList.push(w); } });
    out.tests.push({ t, res, ok, stdout });
    if (ok) out.passed++;
  }
  return out;
}

/* messaggi su misura per gli errori piu' comuni */
function diagnose(ex, run) {
  const msgs = new Set();
  for (const r of run.tests) {
    if (r.ok) continue;
    const o = r.stdout;
    if (/Hai modificato l'array di input/.test(o)) msgs.add(ex.kind === 'A_inplace' ? 'Dopo la traslazione il contenuto dell’array non è quello atteso: controlla l’ordine con cui copi gli elementi e dove metti il vecchio primo.' : 'La tua funzione modifica l’array di input, ma qui non deve: lavora con variabili locali.');
    if (/prev non sono coerenti/.test(o)) msgs.add('I puntatori prev non sono coerenti con i next: dopo aver tolto o spostato un nodo devi aggiornare anche il prev del successivo (e la testa se cambia).');
    if (/sembra circolare/.test(o)) msgs.add('La lista restituita sembra circolare: controlla di non aver lasciato un next che punta indietro.');
    const m = /liberati: (\d+)/.exec(o), e = /liberati: (\d+)/.exec(r.t.expected);
    if (m && e && m[1] !== e[1]) msgs.add(+m[1] < +e[1] ? 'Non hai fatto free() del nodo rimosso (o l’hai fatto solo in alcuni casi).' : 'Hai fatto più free() del dovuto: libera solo il nodo che togli.');
    if (r.res.error && r.res.error.kind === 'segv') msgs.add('Accesso a memoria non valida: spesso è un puntatore NULL dereferenziato (lista vuota? ultimo elemento?) o un indice fuori dall’array.');
    if (r.res.error && r.res.error.kind === 'timeout') msgs.add('Il programma non termina: un ciclo while senza avanzare il puntatore, o una condizione che resta sempre vera.');
    if ((r.res.warnings || []).some((w) => /fuori dai limiti/.test(w))) msgs.add('Leggi o scrivi fuori dall’array: controlla le condizioni dei cicli (< len, non <= len) e gli indici i+1 / i-1.');
  }
  return [...msgs];
}

/* ===== editor ===== */
function makeEditor(opts) {
  const gut = h('pre', { class: 'gut', 'aria-hidden': 'true' });
  const ta = h('textarea', { spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off', wrap: 'off', id: opts.id || 'code-ed', 'aria-label': opts.label || 'Codice C' });
  const hlIn = h('div', { class: 'hli' });
  const hlc = h('pre', { class: 'hlc' });                /* copia colorata del testo, sotto la textarea trasparente */
  const el = h('div', { class: 'editor' }, gut, h('div', { class: 'edwrap' }, h('div', { class: 'hl', 'aria-hidden': 'true' }, hlIn), h('div', { class: 'hlcw', 'aria-hidden': 'true' }, hlc), ta));
  const shift = () => { const t = `translate(${-ta.scrollLeft}px, ${-ta.scrollTop}px)`; hlIn.style.transform = `translateY(${-ta.scrollTop}px)`; hlc.style.transform = t; };
  let marks = [];                                        /* righe segnalate: [{line, sev}] */
  const lhPx = () => parseFloat(getComputedStyle(ta).lineHeight) || 21.6;
  const paint = () => {
    const n = ta.value.split('\n').length;
    const sevOf = new Map(); marks.forEach((m) => { if (!sevOf.has(m.line) || m.sev === 'err') sevOf.set(m.line, m.sev); });
    let s = '';
    for (let i = 1; i <= n; i++) s += (sevOf.has(i) ? `<span class="mk-${sevOf.get(i)}">${i}</span>` : i) + (i < n ? '\n' : '');
    gut.innerHTML = s;
    gut.scrollTop = ta.scrollTop;
    const L = lhPx();
    hlIn.textContent = '';
    marks.forEach((m) => hlIn.append(h('i', { class: m.sev + (m.pulse ? ' pulse' : ''), style: `top:${12 + (m.line - 1) * L}px;height:${L}px` })));
    try { hlc.innerHTML = hlLines(ta.value).join('\n') + '\n'; el.classList.add('hlon'); } catch (e) { el.classList.remove('hlon'); }
    shift();
  };
  ta.value = opts.value || '';
  ta.addEventListener('input', () => { marks = []; paint(); opts.onChange && opts.onChange(ta.value); });
  ta.addEventListener('scroll', () => { gut.scrollTop = ta.scrollTop; shift(); });
  /* applica una modifica calcolata da EditLogic mantenendo la cronologia di annulla/ripeti del browser */
  let busy = false;
  const apply = (ed) => {
    const v = ta.value, want = v.slice(0, ed.a) + ed.text + v.slice(ed.b);
    busy = true;
    try {
      if (ed.a !== ed.b || ed.text) {
        ta.setSelectionRange(ed.a, ed.b);
        let ok = false;
        try { ok = ed.text ? document.execCommand('insertText', false, ed.text) : document.execCommand('delete'); } catch (e) { ok = false; }
        if (!ok || ta.value !== want) { ta.value = want; ta.dispatchEvent(new Event('input')); }
      }
      ta.setSelectionRange(ed.selStart, ed.selEnd == null ? ed.selStart : ed.selEnd);
    } finally { busy = false; }
  };
  ta.addEventListener('beforeinput', (e) => {
    if (busy || e.isComposing) return;
    const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
    let ed = null;
    if (e.inputType === 'insertText' && e.data && e.data.length === 1) ed = EditLogic.type(v, s, en, e.data);
    else if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') ed = EditLogic.enter(v, s, en);
    else if (e.inputType === 'deleteContentBackward' && s === en) ed = EditLogic.backspace(v, s);
    if (!ed) return;
    e.preventDefault();
    apply(ed);
  });
  ta.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); opts.onRun && opts.onRun(); return; }
    if (e.key === 'Escape') { ta.blur(); return; }
    if (e.key === 'Tab' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      apply(EditLogic.tab(ta.value, ta.selectionStart, ta.selectionEnd, e.shiftKey));
    }
  });
  paint();
  const reveal = (l) => { if (l > 0) { ta.scrollTop = Math.max(0, (l - 3) * lhPx()); gut.scrollTop = ta.scrollTop; shift(); } };
  return {
    el, ta, reveal, refresh: paint,
    get: () => ta.value,
    set: (v) => { ta.value = v; marks = []; paint(); opts.onChange && opts.onChange(v); },

/* testo con `codice` → HTML con <code> (il resto viene reso innocuo) */
const rich = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>');
const SEV_LABEL = { err: 'Errore', warn: 'Attenzione', info: 'Nota' };

/* mette insieme i controlli sul sorgente e quello che e' successo nei test */
function analyse(ex, code, run) {
  const st = Coach.staticFindings(ex, code);
  const dyn = run && !run.compile ? Coach.dynamicFindings(ex, code, run.tests) : { items: [], narrative: null };
  const all = [], seen = new Set();
  const hasStatic = (id) => st.some((f) => f.id === id);
  for (const f of st.concat(dyn.items)) {
    const k = f.id + ':' + f.line;
    if (seen.has(k)) continue;
    if (f.id === 'oob' && (hasStatic('off-by-one') || hasStatic('a-len'))) continue;     /* la causa l'ho gia' detta */
    seen.add(k); all.push(f);
  }
  const rank = { err: 0, warn: 1, info: 2 };
  all.sort((a, b) => (rank[a.sev] - rank[b.sev]) || (a.line - b.line));
  return { code, all, narrative: dyn.narrative, run };
}
function jumpTo(line) {
  const ed = EDITORS.cur; if (!ed || !line) return;
  ed.flash(line);
  ed.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function findingNode(f, opts) {
  opts = opts || {};
  const li = h('li', { class: 'find ' + f.sev });
  const head = h('div', { class: 'fhead' }, h('span', { class: 'fsev ' + f.sev }, SEV_LABEL[f.sev]));
  if (f.line && !opts.noJump) head.append(h('button', { class: 'btn sm ghost fjump', type: 'button', onclick: () => jumpTo(f.line), 'aria-label': 'Vai alla riga ' + f.line }, 'riga ' + f.line));
  else if (f.line) head.append(h('span', { class: 'muted small num' }, 'riga ' + f.line));
  li.append(head, h('div', { class: 'ftext', html: rich(f.text) }));
  if (f.quote) li.append(h('pre', { class: 'fq' }, f.quote));
  return li;
}
function narrativeNode(n) {
  if (!n) return null;
  const when = n.tags ? 'Nel caso «' + n.tags + '»' : 'Nel test n. ' + n.n;
  let t;
  if (n.error) t = `${when} il programma si è fermato prima di finire (vedi sotto).`;
  else if (n.untouched) t = `${when} il risultato è rimasto \`${n.sentinel}\`, cioè il valore con cui parte il test: nel tuo codice nessun ramo ha scritto il risultato per questo input. Atteso \`${n.expected}\`.`;
  else if (n.extraOutput) t = `${when} il test segnala che l'array di input è cambiato (o la funzione stampa qualcosa).`;
  else t = `${when} devi ottenere \`${n.expected || '(niente)'}\` e il tuo codice produce \`${n.got || '(niente)'}\`${n.multi ? ' (alla riga ' + n.line + ' dell\'output)' : ''}.`;
  return h('p', { class: 'narr', html: rich(t) });
}

  } catch (e) { /* preferenze rovinate: valgono quelle di base */ }
})();
const saveUiPrefs = () => lsSet('asd.palestra.ui.v1', JSON.stringify(UIP));
function applyEditorPrefs(ed) {
  ed.el.style.setProperty('--edfs', UIP.fs + 'px');
  if (UIP.h) ed.el.style.setProperty('--edh', UIP.h + 'px'); else ed.el.style.removeProperty('--edh');
}
const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* trascinare con mouse, dito o tastiera: drag(el, onMove(dx, dy), onEnd) */
function dragHandle(el, start, move, end) {
  el.addEventListener('pointerdown', (e) => {
    if (e.button != null && e.button > 0) return;
    e.preventDefault();
    const x0 = e.clientX, y0 = e.clientY, st = start();
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* non supportato */ }
    el.classList.add('drag');
    const mv = (ev) => move(st, ev.clientX - x0, ev.clientY - y0);
    const up = () => { el.classList.remove('drag'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); end && end(); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
}

/* esercizio precedente / successivo, nell'ordine dell'elenco (rispetta il filtro Array/Liste) */
function exNeighbour(ex, dir, openOnly) {
  let L = BANK.exercises.filter((e) => CODE.group === 'tutti' || e.group === CODE.group);
  let i = L.findIndex((e) => e.id === ex.id);
  if (i < 0) { L = BANK.exercises; i = L.findIndex((e) => e.id === ex.id); }
  const n = L.length;
  for (let k = 1; k < n; k++) {
    const e = L[(((i + dir * k) % n) + n) % n];
    if (!openOnly || exStatus(e) !== 'pass') return { ex: e, pos: i + 1, n };
  }
  return { ex: null, pos: i + 1, n };
}

function helpBody(ex, H, cur) {
  const wrap = h('div');
  if (H.status === 'running') { wrap.append(h('p', { class: 'muted', id: 'help-progress', role: 'status' }, H.progress || 'Provo il tuo codice…')); return wrap; }
  if (H.code !== cur) wrap.append(h('div', { class: 'warnbox small', style: 'margin-bottom:10px' }, 'Hai cambiato il codice da quando l’ho guardato. ', h('button', { class: 'btn sm', type: 'button', onclick: () => startHelp(ex) }, 'Rianalizza')));
  const step = (n, title, ...kids) => h('div', { class: 'hstep' }, h('div', { class: 'hs-t' }, h('span', { class: 'hs-n num' }, String(n)), title), ...kids);
  if (H.kind === 'compile') {
    const e = H.an.run.compile.error;
    wrap.append(step(1, 'Prima deve compilare', h('p', { style: 'margin:6px 0 0' }, describeError(e, H.an.run.studentLines)), h('p', { class: 'muted small', style: 'margin:6px 0 0' }, 'La riga è segnata nell’editor. Quando compila, chiedimi di nuovo.')));
    const f = H.an.all.filter((x) => x.sev === 'err').slice(0, 2);
    if (f.length) wrap.append(h('ul', { class: 'finds' }, f.map((x) => findingNode(x))));
    wrap.append(h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn sm', type: 'button', onclick: () => startHelp(ex) }, 'Riprova')));
    return wrap;
  }
  if (H.kind === 'pass') {
    wrap.append(step(1, 'Tutti i test passano', h('p', { style: 'margin:6px 0 0' }, 'Il tuo codice supera tutti i test dell’esercizio.'), H.an.all.length ? h('p', { class: 'muted small', style: 'margin:6px 0 0' }, 'Guarda comunque le osservazioni qui sotto ai test: sono cose che un correttore potrebbe notare.') : null));
    return wrap;
  }
  /* fallito */
  const rep = H.rep, target = rep && (rep.full[0] || rep.partial);
  const top = H.an.all.filter((x) => x.sev === 'err' && x.line).slice(0, 3);
  const s1 = step(1, 'Cosa succede', narrativeNode(H.an.narrative) || h('p', null, 'Qualche test non passa.'));
  if (top.length) s1.append(h('ul', { class: 'finds' }, top.map((x) => findingNode(x))));
  wrap.append(s1);
  if (H.step < 2) { wrap.append(h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn sm primary', type: 'button', onclick: () => { H.step = 2; if (target) CODE.flashLine = target.line; rerenderKeepEditor(); } }, 'Dove devo guardare?'))); return wrap; }
  /* passo 2: la riga */
  if (target) {
    const kindTxt = rep.full[0] ? 'Una sola modifica in questa riga fa passare tutti i test.' : `Una modifica in questa riga fa passare ${target.gain} test in più (restano altri errori da cercare).`;
    wrap.append(step(2, 'Guarda la riga ' + target.line, target.before ? h('pre', { class: 'fq' }, target.before) : null, h('p', { class: 'muted small', style: 'margin:6px 0 0' }, kindTxt), h('button', { class: 'btn sm ghost', type: 'button', style: 'margin-top:6px', onclick: () => jumpTo(target.line) }, 'Segnala nell’editor')));
  } else {
    wrap.append(step(2, 'Non è una sola riga', h('p', { style: 'margin:6px 0 0' }, 'Non riesco a isolare una riga con una piccola modifica: di solito vuol dire che manca un pezzo di logica o che gli errori sono più d’uno.'),
      h('p', { class: 'muted small', style: 'margin:6px 0 0' }, 'Parti dal caso più semplice che fallisce (sopra) e segui il codice a mano con quei valori. Poi guarda “Idea dell’esercizio”.' + (rep ? ` Ho provato ${rep.tried} modifiche.` : ''))));
    return wrap;
  }
  if (H.step < 3) { wrap.append(h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn sm primary', type: 'button', onclick: () => { H.step = 3; rerenderKeepEditor(); } }, 'Che tipo di errore è?'))); return wrap; }
  wrap.append(step(3, 'Che tipo di errore', h('p', { style: 'margin:6px 0 0', html: rich(target.what.charAt(0).toUpperCase() + target.what.slice(1)) })));
  if (H.step < 4) { wrap.append(h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn sm primary', type: 'button', onclick: () => { H.step = 4; rerenderKeepEditor(); } }, 'Mostrami la correzione'))); return wrap; }
  /* passo 4: la correzione */
  const fix = h('div');
  if (target.kind === 'insert') fix.append(h('p', { style: 'margin:6px 0 4px' }, 'Aggiungi questa istruzione (intorno alla riga ' + target.line + '):'), h('pre', { class: 'fq ok' }, target.after));
  else if (target.kind === 'del') fix.append(h('p', { style: 'margin:6px 0 4px' }, 'Togli questa istruzione:'), h('pre', { class: 'fq bad' }, target.before));
  else fix.append(h('p', { style: 'margin:6px 0 4px' }, 'Alla riga ' + target.line + ', cambia'), h('pre', { class: 'fq bad' }, target.before), h('p', { style: 'margin:6px 0 4px' }, 'in'), h('pre', { class: 'fq ok' }, target.after));
  fix.append(h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn sm primary', type: 'button', onclick: () => applyFix(ex, H, target) }, 'Applica al mio codice e riprova')));
  if (rep.full.length > 1) fix.append(h('p', { class: 'muted small', style: 'margin:8px 0 0' }, `Ci sono altre ${rep.full.length - 1} modifiche equivalenti: l’importante è capire perché questa funziona.`));
  fix.append(h('p', { class: 'muted small', style: 'margin:8px 0 0' }, 'Come l’ho trovata: ho provato piccole modifiche al tuo codice una alla volta (un operatore, un numero, un indice…) e questa è fra quelle che fanno passare i test.'));
  wrap.append(step(4, 'La correzione', fix));
  return wrap;
}

async function startHelp(ex) {
  if (CODE.helpBusy || !EDITORS.cur) return;
  CODE.helpBusy = true;
  const code = EDITORS.cur.get();
  CODE.help = { status: 'running', code, progress: 'Eseguo i test sul tuo codice…', step: 1 };
  rerenderKeepEditor();
  try {
    await doRun(ex, { quiet: true, code });
    const run = CODE.run, an = CODE.an;
    const H = { status: 'done', code, an, step: 1, rep: null, kind: run.compile ? 'compile' : run.passed === run.total ? 'pass' : 'fail' };
    if (H.kind === 'fail') {
      CODE.help = Object.assign({}, H, { status: 'running', progress: 'Provo piccole modifiche al tuo codice per trovare l’errore…' });
      if (CUR_TAB === 'codice' && CODE.exId === ex.id) rerenderKeepEditor();
      const env = {
        testCount: ex.tests.length, baseline: run.tests.map((r) => r.ok), now: () => performance.now(),
        runTest: async (src, i) => { const t = ex.tests[i]; const res = await runC(programFor(ex, src, t.code), 150000); return !!(res.ok && norm(res.stdout || '') === norm(t.expected)); },
      };
      H.rep = await Coach.repair(ex, code, env, {
        budgetMs: 6000, hotLines: an.all.filter((f) => f.line).map((f) => f.line),
        onProgress: (n, tot) => { const p = $('#help-progress'); if (p) p.textContent = `Provo piccole modifiche al tuo codice… ${n} di ${tot}`; },
      });
    }
    CODE.help = H;
  } catch (err) {
    console.error(err);
    CODE.help = { status: 'done', code, kind: 'fail', an: CODE.an || { all: [], run: CODE.run, narrative: null }, step: 1, rep: null };
  } finally { CODE.helpBusy = false; }
  if (CUR_TAB === 'codice' && CODE.exId === ex.id && CODE.view === 'ex') rerenderKeepEditor();
}
async function applyFix(ex, H, target) {
  const ed = EDITORS.cur; if (!ed) return;
  ed.set(target.patched);
  DR[ex.id] = { c: target.patched, t: Date.now() }; touchDraft();
  CODE.help = null; CODE.run = null; CODE.an = null;
  rerenderKeepEditor();
  toast('Correzione applicata: rieseguo i test');
  await doRun(ex);
  if (EDITORS.cur && target.line) EDITORS.cur.flash(target.line);
}

async function doRun(ex, opts) {
  opts = opts || {};

  const code = opts.code != null ? opts.code : EDITORS.cur.get();
  DR[ex.id] = { c: code, t: Date.now() }; touchDraft();
  CODE.running = true; CODE.run = null; CODE.an = null;
  const btn = $('#run-btn'); if (btn) { btn.disabled = true; btn.lastChild.textContent = 'Eseguo…'; }
  const resBox = $('#results'); if (resBox) { clear(resBox); resBox.append(h('p', { class: 'muted' }, 'Sto eseguendo i test…')); }
  const run = await runTests(ex, code);
  const inExam = !!(EXAM && EXAM.ids.length);
  CODE.running = false; CODE.run = run; CODE.runCode = code;
  CODE.an = inExam ? null : analyse(ex, code, run);
  if (inExam) EXAM.last[ex.id] = run.compile ? { compile: true } : { p: run.passed, t: run.total };
  if (!run.compile) recordRun(ex.id, run.passed, run.total);
  if (CUR_TAB !== 'codice' || CODE.exId !== ex.id || CODE.view !== 'ex') return;
  const b2 = $('#run-btn'); if (b2) { b2.disabled = false; b2.lastChild.textContent = 'Esegui i test'; }
  paintResults(ex, run, $('#results'), CODE.an, { next: !inExam });
  if (EDITORS.cur) {
    if (run.compile) { const l = errLine(run.compile.error, run.studentLines); if (l) EDITORS.cur.mark(l); }
    else if (CODE.an) EDITORS.cur.mark(CODE.an.all.filter((f) => f.line && f.sev !== 'info').map((f) => ({ line: f.line, sev: f.sev === 'err' ? 'err' : 'warn' })), null, true);
  }
  if (!opts.quiet) {                                   /* mostra l'esito sotto l'editor senza perdere di vista il codice */
    const bn = $('#results .result-banner, #results .errbox');
    if (bn) { const r = bn.getBoundingClientRect(); if (r.bottom > innerHeight - 24) window.scrollBy({ top: r.bottom - innerHeight + 150, behavior: 'smooth' }); }
  }
}

function diffHtml(obt, exp) {

  return a.map((ln, i) => (ln === b[i] ? esc(ln) : `<span class="diff-bad">${esc(ln) || '&nbsp;'}</span>`)).join('\n');

/* an: risultato di analyse(); se manca (simulazione d'esame in corso) si vede solo la tabella dei test */

function paintPlay(o, box) {
